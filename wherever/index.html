        // グループ分けのための初期化
        const groups = {
            'JR-SH': [],
            'JRE-IKST': [],
            'JRE-IKST（新幹線）': [],
            '一般': [],
            'ご当地': [],
            '接近メロディー': [],
            '私鉄': []
        };

        // ファイルをグループに分類
        mp3Files.forEach(file => {
            if (file.startsWith('JR-SH')) {
                groups['JR-SH'].push(file);
            } else if (file.startsWith('JRE-IKST-1')) {
                groups['JRE-IKST（新幹線）'].push(file);
            } else if (file.startsWith('JRE-IKST')) {
                groups['JRE-IKST'].push(file);
            } else if (file.startsWith('ｺﾞ')) {
                groups['ご当地'].push(file);
            } else if (file.includes('接近メロディー')) {
                groups['接近メロディー'].push(file);
            } else if (file.includes('私')) {
                groups['私鉄'].push(file);
            } else {
                groups['一般'].push(file);
            }
        });

        // 表示順を指定
        const displayOrder = ['JR-SH', 'JRE-IKST', 'JRE-IKST（新幹線）', '一般', 'ご当地', '接近メロディー', '私鉄'];

        displayOrder.forEach(label => {
            const files = groups[label];
            if (files.length === 0) return;

            const optgroup = document.createElement('optgroup');
            optgroup.label = label;

            files.sort((a, b) => a.localeCompare(b, 'ja')).forEach(file => {
                const option = document.createElement('option');
                option.value = file;

                if (label === '接近メロディー') {
                    // 表示名から「接近メロディー」を除く
                    option.textContent = file
                        .replace(/\.mp3$/i, '')
                        .replace(/接近メロディー/i, '')
                        .trim();
                } else if (label === 'ご当地') {
                    option.textContent = file.replace(/\.mp3$/i, '').replace(/^ｺﾞ/, '');
                } else if (label === '私鉄') {
                    option.textContent = file.replace(/\.mp3$/i, '').replace(/^私/, '');
                } else {
                    option.textContent = file.replace(/\.mp3$/i, '');
                }

                optgroup.appendChild(option);
            });

            musicSelect.appendChild(optgroup);
        });



        for (let i = 1; i <= 22; i++) {
            const option = document.createElement('option');
            option.value = i;
            option.textContent = `${i}番線`;
            trackSelect.appendChild(option);
        }

        musicSelect.addEventListener('change', function () {
            onSound.src = 'sounds/' + this.value;
            onSound.load();
        });

        onSound.src = 'sounds/' + musicSelect.value;

        function playOn() {
            // オーディオが再生中の場合は一旦停止
            if (!onSound.paused) {
                onSound.pause();
            }
            // 時間をリセットして再生
            onSound.currentTime = 0;
            onSound.play().catch(error => {
                console.error('再生エラー:', error);
            });
        }

        function playOff() {
            onSound.pause();
            onSound.currentTime = 0;

            const folder = peopleSelect.value;
            const trackNum = trackSelect.value;
            const filePath = `${folder}/${trackNum}.mp3`;

            offSound.src = filePath;
            offSound.load();

            setTimeout(() => {
                offSound.currentTime = 0;
                offSound.play();
            }, 1500);
        }


        // シャッフル関数
        function shuffle(array) {
            let arr = array.slice();
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        chorusLabel.style.display = 'block';
        chorusLabel.style.margin = '10px 0';
        chorusLabel.textContent = 'コーラス数: ';
        const chorusInput = document.createElement('input');
        chorusInput.type = 'number';
        chorusInput.min = '1';
        chorusInput.max = '10';
        chorusInput.value = '1';
        chorusInput.style.width = '60px';
        chorusLabel.appendChild(chorusInput);
        randomUI.appendChild(chorusLabel);
        randomUI.appendChild(playBtn);

        // IKSTボタン生成
        const ikstBtn = document.createElement('button');
        ikstBtn.textContent = 'IKST';
        ikstBtn.style.marginLeft = '10px';
        playBtn.after(ikstBtn);
        ikstBtn.style.display = 'none'; // 初期は非表示

        document.body.appendChild(randomUI);

        // IKST再生用変数
        let ikstList = [];
        let ikstIndex = 0;
        let isIKSTPlaying = false;

        function playNextIKST() {
            // 既存のaudio要素を削除
            const old = document.getElementById('ikstAudio');
            if (old) old.remove();

            if (ikstList.length === 0) return;

            if (ikstIndex >= ikstList.length) {
                ikstIndex = 0; // 最初に戻る
            }
            const file = ikstList[ikstIndex];
            h1.textContent = file.replace(/\.mp3$/i, '');

            // 新しいaudio要素を作成
            // このトラックを指定コーラス分繰り返す
            chorusRemaining = chorusesCount;
            const audio = document.createElement('audio');
            audio.id = 'ikstAudio';
            audio.src = 'sounds/' + file;
            audio.autoplay = true;
            audio.addEventListener('ended', function () {
                chorusRemaining--;
                if (chorusRemaining > 0) {
                    try {
                        audio.currentTime = 0;
                        audio.play();
                    } catch (e) {
                        console.error('IKST再生再試行エラー:', e);
                    }
                } else {
                    ikstIndex++;
                    if (ikstIndex >= ikstList.length) {
                        ikstIndex = 0;
                    }
                    if (isIKSTPlaying) playNextIKST();
                }
            });
            document.body.appendChild(audio);
        }

        ikstBtn.onclick = function () {
            // JRE-IKSTシリーズ＋新幹線シリーズを昇順で結合
            ikstList = groups['JRE-IKST']
                .concat(groups['JRE-IKST（新幹線）'])
                .sort((a, b) => a.localeCompare(b, 'ja'));
            if (ikstList.length === 0) {
                alert('JRE-IKSTシリーズがありません');
                return;
            }
            // コーラス数を取得して設定
            chorusesCount = parseInt(chorusInput.value, 10) || 1;
            chorusRemaining = chorusesCount;
            randomUI.style.display = 'none';
            isIKSTPlaying = true;
            ikstIndex = 0;
            playNextIKST();
        };

        function stopIKST() {
            isIKSTPlaying = false;
            h1.textContent = '発車ベル';
            const old = document.getElementById('ikstAudio');
            if (old) old.remove();
            // コーラス状態をリセット
            chorusRemaining = 0;
        }

        function playNextRandom() {
            // 既存のaudio要素を削除
            const old = document.getElementById('randomAudio');
            if (old) old.remove();

            if (playIndex >= playList.length) {
                playList = shuffle(playList);
                playIndex = 0;
                console.log('今回のランダム再生順:', playList);
            }
            const file = playList[playIndex];
            h1.textContent = file.replace(/\.mp3$/i, '');
            if (file.startsWith('ｺﾞ')) {
                h1.textContent = h1.textContent.replace(/^ｺﾞ/, '');
            } else if (file.includes('接近メロディー')) {
                h1.textContent = h1.textContent.replace(/接近メロディー/i, '').trim();
            } else if (file.startsWith('私')) {
                h1.textContent = h1.textContent.replace(/^私/, '');
            }

            // 新しいaudio要素を作成
            // そのトラックを指定コーラス分繰り返す
            chorusRemaining = chorusesCount;
            const audio = document.createElement('audio');
            audio.id = 'randomAudio';
            audio.src = 'sounds/' + file;
            audio.autoplay = true;
            audio.addEventListener('ended', function () {
                chorusRemaining--;
                if (chorusRemaining > 0) {
                    // 同じ曲をもう一度再生
                    try {
                        audio.currentTime = 0;
                        audio.play();
                    } catch (e) {
                        console.error('再生再試行エラー:', e);
                    }
                } else {
                    // 次の曲へ
                    playIndex++;
                    if (isRandomPlaying) playNextRandom();
                }
            });
            document.body.appendChild(audio);
        }

        hiddenBtn.addEventListener('click', function () {
            if (isRandomPlaying) {
                // ランダム再生を停止し、表示を元に戻す
                isRandomPlaying = false;
                h1.textContent = '発車ベル';
                const old = document.getElementById('randomAudio');
                if (old) old.remove();
                // コーラス状態をリセット
                chorusRemaining = 0;
                ikstBtn.style.display = 'none';
                return;
            }
            if (isIKSTPlaying) {
                stopIKST();
                ikstBtn.style.display = 'none';
                return;
            }
            // UI表示
            randomUI.style.display = 'block';
            ikstBtn.style.display = 'inline-block';
        });

        playBtn.onclick = function () {
            // チェックされたグループのみ抽出
            const selectedGroups = displayOrder.filter(label => groupCheckboxes[label].checked);
            let selectedFiles = [];
            selectedGroups.forEach(label => {
                selectedFiles = selectedFiles.concat(groups[label]);
            });
            if (selectedFiles.length === 0) {
                alert('グループを選択してください');
                return;
            }
            randomUI.style.display = 'none';
            // コーラス数を取得
            chorusesCount = parseInt(chorusInput.value, 10) || 1;
            chorusRemaining = chorusesCount;
            isRandomPlaying = true;
            playList = shuffle(selectedFiles);
            playIndex = 0;
            playNextRandom();
            ikstBtn.style.display = 'none';
            console.log('今回のランダム再生順:', playList);
        };
    </script>
</body>

</html>
