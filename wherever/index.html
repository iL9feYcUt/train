        let cosmosBroadcastTimeoutId = null;
        let cosmosBroadcastInProgress = false;
        // COSMOS用の追加セレクト要素（名前、号数(百/十/一)、行先、次の停車駅）
        let cosmosUI = null;
        const sortedMp3Files = mp3Files.slice().sort((a, b) => a.localeCompare(b, 'ja'));


        // グループ分けのための初期化
        const groups = {
            'JR-SH': [],
            'JR-SHR': [],
            'JRE-IKST': [],
            'JRE-IKST（新幹線）': [],
            '一般': [],
            'ご当地': [],
            '接近メロディー': [],
            '私鉄': [],
            'ベル': []
        };

        // ファイルをグループに分類
        mp3Files.forEach(file => {
            if (file.startsWith('JR-SHR')) {
                groups['JR-SHR'].push(file);
            } else if (file.startsWith('JR-SH')) {
                groups['JR-SH'].push(file);
            } else if (file.startsWith('JRE-IKST-1')) {
                groups['JRE-IKST（新幹線）'].push(file);
            } else if (file.startsWith('JRE-IKST')) {
                groups['JRE-IKST'].push(file);
            } else if (file.startsWith('ｺﾞ')) {
                groups['ご当地'].push(file);
            } else if (file.includes('接近メロディー')) {
                groups['接近メロディー'].push(file);
            } else if (file.includes('私')) {
                groups['私鉄'].push(file);
            } else if (file.startsWith('bell')) {
                groups['ベル'].push(file);
            } else {
                groups['一般'].push(file);
            }
        });

        // 表示順を指定
        const displayOrder = ['JR-SH', 'JR-SHR', 'JRE-IKST', 'JRE-IKST（新幹線）', '一般', 'ご当地', 'ベル', '接近メロディー', '私鉄'];

            const files = groups[label];

        // 号数のパーツ候補リストを作成
        function buildNoParts(hund, ten, one) {
            // hund/ten/one are digits 0-9
            const parts = [];
            const hd = parseInt(hund,10)||0;
            const td = parseInt(ten,10)||0;
            const od = parseInt(one,10)||0;
            const h = hd * 100;
            const t = td * 10;
            const o = od;

            // 特別扱い: ちょうど百の倍数（例:100,200...）
            if (h > 0 && t === 0 && o === 0) {
                // まず単独の「100号.mp3」を優先して、その後で素の100.mp3を試す
                parts.push([`COSMOS/no/${h}号.mp3`, `COSMOS/no/${h}.mp3`]);
                return parts;
            }

            // 百の位（存在する場合はまず素の100.mp3を流すのが基本）
            if (h > 0) {
                parts.push([`COSMOS/no/${h}.mp3`, `COSMOS/no/${h}号.mp3`]);
            }

            // 十の位
            if (t > 0) {
                if (o === 0) {
                    // ちょうど10の倍数（例:10,20,...,90,120など）では「20号.mp3」を優先
                    parts.push([`COSMOS/no/${t}号.mp3`, `COSMOS/no/${t}.mp3`]);
                } else {
                    // 一の位がある場合はまず素の20.mp3を流す
                    parts.push([`COSMOS/no/${t}.mp3`, `COSMOS/no/${t}号.mp3`]);
                }
            }

            // 一の位（あれば必ず「3号.mp3」をまず試す）
            if (o > 0) {
                parts.push([`COSMOS/no/${o}号.mp3`, `COSMOS/no/${o}.mp3`]);
            }

            return parts;
        }

        // 各パートは候補配列（存在しない場合は次の候補へフォールバック）
        function playPartsWithFallbacks(parts, onFinished) {
            let idx = 0;
            cosmosBroadcastInProgress = true;

            function playPart(partCandidates) {
                if (!cosmosBroadcastInProgress) { if (onFinished) onFinished(); return; }
                if (!partCandidates || partCandidates.length === 0) { nextPart(); return; }
                let candIndex = 0;
            const audio = document.createElement('audio');
            audio.className = 'cosmos-broadcast-audio';
                audio.autoplay = false;
                audio.preload = 'auto';

                function tryCandidate() {
                    if (candIndex >= partCandidates.length) { nextPart(); return; }
                    const url = partCandidates[candIndex];
                    audio.src = url;
                    // エラーなら次の候補へ
                    audio.onerror = function () { candIndex++; tryCandidate(); };
                    audio.onended = function () { try{ audio.remove(); }catch(e){} nextPart(); };
                    // 再生可能になれば再生
                    audio.oncanplaythrough = function () {
                        audio.play().catch(e=>{ nextPart(); });
                    };
                    // 読み込み開始してみる
                    audio.load();
                    // タイムアウト: 読み込めなければ次へ（1.5s）
                    setTimeout(()=>{ if (!audio.duration || isNaN(audio.duration)) { candIndex++; tryCandidate(); } }, 1500);
                }

                tryCandidate();
            }

            function nextPart() {
                idx++;
                if (idx > parts.length - 1) {
                    if (onFinished) onFinished();
                    return;
                }
                playPart(parts[idx]);
            }

            // start
            if (parts.length === 0) { cosmosBroadcastInProgress = false; if (onFinished) onFinished(); return; }
            idx = 0;
            playPart(parts[0]);
        }

        // 放送実行: trackNumは番線（11など）
        function startCosmosBroadcast(trackNum) {
            // 既に放送中なら無視
            if (cosmosBroadcastInProgress) return;
            createCosmosUI();
            // 取得値
            const nameVal = (document.getElementById('cosmosName') || {value:''}).value;
            const h = (document.getElementById('cosmosNoHundreds') || {value:'0'}).value;
            const t = (document.getElementById('cosmosNoTens') || {value:'0'}).value;
            const o = (document.getElementById('cosmosNoOnes') || {value:'0'}).value;
            const dest = (document.getElementById('cosmosDestination') || {value:''}).value;
            const next = (document.getElementById('cosmosNext') || {value:''}).value;
            const coupled = !!(document.getElementById('cosmosCoupled') && document.getElementById('cosmosCoupled').checked);
            const nameVal2 = (document.getElementById('cosmosName2') || {value:''}).value;
            const h2 = (document.getElementById('cosmosNoHundreds2') || {value:'0'}).value;
            const t2 = (document.getElementById('cosmosNoTens2') || {value:'0'}).value;
            const o2 = (document.getElementById('cosmosNoOnes2') || {value:'0'}).value;
            const dest2 = (document.getElementById('cosmosDestination2') || {value:''}).value;

            // 構成パーツ（論理パーツごとに候補配列）
            const parts = [];
            // 〇番線から
            parts.push([`COSMOS/track_from/${trackNum}.mp3`]);

            if (!coupled) {
                // 通常の単独放送
                if (nameVal) parts.push([`COSMOS/name/${nameVal}.mp3`]);
                const noParts = buildNoParts(h,t,o);
                noParts.forEach(p=>parts.push(p));
                if (dest) parts.push([`COSMOS/stations_up/${dest}.mp3`]);
            } else {
                // 併結放送
                // 異なる行先
                if (dest !== dest2) {
                    if (nameVal) parts.push([`COSMOS/name/${nameVal}.mp3`]);
                    const noPartsA = buildNoParts(h,t,o);
                    noPartsA.forEach(p=>parts.push(p));
                    if (dest) parts.push([`COSMOS/stations_up/${dest}.mp3`]);
                    // 1本目の後に「行と」
                    parts.push([`COSMOS/行と.mp3`]);

                    // 2本目
                    if (nameVal2) parts.push([`COSMOS/name/${nameVal2}.mp3`]);
                    const noPartsB = buildNoParts(h2,t2,o2);
                    noPartsB.forEach(p=>parts.push(p));
                    if (dest2) parts.push([`COSMOS/stations_up/${dest2}.mp3`]);
                } else {
                    // 同一行先: 1本目は行先を後に回す、かつ最後の号数を「号と」にする
                    if (nameVal) parts.push([`COSMOS/name/${nameVal}.mp3`]);
                    const noPartsA = buildNoParts(h,t,o);
                    // 最後のパートに '号と' を優先候補として挿入（onesがある場合）
                    if (noPartsA.length > 0) {
                        // 最後の数値パート（百・十・一のいずれか）を特定して '号と' 候補を先頭に追加
                        const hdA = parseInt(h,10)||0;
                        const tdA = parseInt(t,10)||0;
                        const odA = parseInt(o,10)||0;
                        const numericPartsA = [];
                        if (hdA > 0) numericPartsA.push(hdA * 100);
                        if (tdA > 0) numericPartsA.push(tdA * 10);
                        if (odA > 0) numericPartsA.push(odA);
                        if (numericPartsA.length > 0) {
                            const lastNumber = numericPartsA[numericPartsA.length - 1];
                            const lastIdx = noPartsA.length - 1;
                            const candidate = `COSMOS/no/${lastNumber}号と.mp3`;
                            if (noPartsA[lastIdx].indexOf(candidate) === -1) {
                                noPartsA[lastIdx].unshift(candidate);
                            }
                        }
                    }
                    noPartsA.forEach(p=>parts.push(p));

                    // 2本目
                    if (nameVal2) parts.push([`COSMOS/name/${nameVal2}.mp3`]);
                    const noPartsB = buildNoParts(h2,t2,o2);
                    noPartsB.forEach(p=>parts.push(p));
                    // ここで行先を1回だけ追加
                    if (dest) parts.push([`COSMOS/stations_up/${dest}.mp3`]);
                }
            }

            // 再生開始
            playPartsWithFallbacks(parts, function () {
                if (!cosmosBroadcastInProgress) return;
                // 併結かつ行先が異なる場合、固定フレーズの前に追加の '行が' は parts に含まれるため通常でOK
                // ただし、異なる行先でも最終的には '行が' + 発車以下を再生したいため playFixedPhrases を呼ぶ
                playFixedPhrases(next);
            });
        }

        // 固定フレーズを順次再生する (nextStationは表示名)
        function playFixedPhrases(nextStation, onFinished) {
            const seq = [
                'COSMOS/行が.mp3',
                'COSMOS/発車いたします.mp3',
                'COSMOS/次は.mp3',
                `COSMOS/next/${nextStation}.mp3`,
                'COSMOS/とまります.mp3',
                'COSMOS/黄色い点字ブロック.mp3'
            ];
            let i = 0;
            function playNext() {
                if (!cosmosBroadcastInProgress) { if (onFinished) onFinished(); return; }
                if (i >= seq.length) { if (onFinished) onFinished(); cosmosBroadcastInProgress = false; return; }
                const a = document.createElement('audio');
                a.className = 'cosmos-broadcast-audio';
                a.autoplay = true;
                a.src = seq[i];
                a.onended = function () { try{ a.remove(); }catch(e){} i++; playNext(); };
                a.onerror = function () { try{ a.remove(); }catch(e){} i++; playNext(); };
                document.body.appendChild(a);
                // in case oncanplay isn't fired, try to play after load
                a.load();
            }
            playNext();
        }

        // peopleSelectがCOSMOSのときUIを表示

        function playOn() {

            // オーディオが再生中の場合は一旦停止
            if (!onSound.paused) {
                onSound.pause();
            }
            // 時間をリセットして再生
            onSound.currentTime = 0;
            onSound.play().catch(error => {
                console.error('再生エラー:', error);
            });

                // COSMOSが選択されている場合は通常の音楽をループ再生し、
                // 7秒後に放送を開始する
                const trackNum = trackSelect.value;
                if (peopleSelect.value === 'cosmos') {
                    onSound.loop = true;
                    // 既存の放送タイマーがあればクリア
                    if (cosmosBroadcastTimeoutId) {
                        clearTimeout(cosmosBroadcastTimeoutId);
                        cosmosBroadcastTimeoutId = null;
                    }
                    // 放送を7秒後に開始
                    cosmosBroadcastTimeoutId = setTimeout(() => {
                        startCosmosBroadcast(trackNum);
                    }, 7000);
                } else {
                    onSound.loop = true;
                }
        }

        function playOff() {
            // COSMOS用の保留タイマーをクリア（放送が既に開始していれば続行させる）
            if (cosmosBroadcastTimeoutId) {
                clearTimeout(cosmosBroadcastTimeoutId);
                cosmosBroadcastTimeoutId = null;
            }

            // 音楽だけ止める
            onSound.pause();
            onSound.currentTime = 0;

            const folder = peopleSelect.value;
            // COSMOS選択時はOFF時に放送を中断しない（音楽のみ停止）
            if (folder === 'cosmos') return;

            setTimeout(() => {
                offSound.currentTime = 0;
                offSound.play();
            }, 1500);
        }


        // シャッフル関数
        function shuffle(array) {
            let arr = array.slice();
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        randomUI.style.display = 'none';
        randomUI.style.position = 'fixed';
        randomUI.style.top = '50%';
        randomUI.style.left = '50%';
        randomUI.style.transform = 'translate(-50%, -50%)';
        randomUI.style.background = '#fff';
        randomUI.style.padding = '30px';
        randomUI.style.borderRadius = '10px';
        randomUI.style.boxShadow = '0 0 10px #aaa';
        randomUI.style.zIndex = '1000';

        const groupCheckboxes = {};
        displayOrder.forEach(label => {
            const labelElem = document.createElement('label');
            labelElem.style.display = 'block';
            labelElem.style.margin = '10px 0';
            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.value = label;
            checkbox.checked = true;
            groupCheckboxes[label] = checkbox;
            labelElem.appendChild(checkbox);
            labelElem.appendChild(document.createTextNode(' ' + label));
            randomUI.appendChild(labelElem);
        });

        const playBtn = document.createElement('button');
        playBtn.textContent = '再生';
        playBtn.style.marginTop = '20px';
        // コーラス数入力
        const chorusLabel = document.createElement('label');
        chorusLabel.style.display = 'block';
        chorusLabel.style.margin = '10px 0';
        chorusLabel.textContent = 'コーラス数: ';
        const chorusInput = document.createElement('input');
        chorusInput.type = 'number';
        chorusInput.min = '1';
        chorusInput.max = '10';
        chorusInput.value = '1';
        chorusInput.style.width = '60px';
        chorusLabel.appendChild(chorusInput);
        randomUI.appendChild(chorusLabel);
        randomUI.appendChild(playBtn);

        // IKSTボタン生成
        const ikstBtn = document.createElement('button');
        ikstBtn.textContent = 'IKST';
        ikstBtn.style.marginLeft = '10px';
        playBtn.after(ikstBtn);
        ikstBtn.style.display = 'none'; // 初期は非表示

        document.body.appendChild(randomUI);

        // IKST再生用変数
        let ikstList = [];
        let ikstIndex = 0;
        let isIKSTPlaying = false;

        function playNextIKST() {
            // 既存のaudio要素を削除
            const old = document.getElementById('ikstAudio');
            if (old) old.remove();

            if (ikstList.length === 0) return;

            if (ikstIndex >= ikstList.length) {
                ikstIndex = 0; // 最初に戻る
            }
            const file = ikstList[ikstIndex];
            h1.textContent = file.replace(/\.mp3$/i, '');

            // 新しいaudio要素を作成
            // このトラックを指定コーラス分繰り返す
            chorusRemaining = chorusesCount;
            const audio = document.createElement('audio');
            audio.id = 'ikstAudio';
            audio.src = 'sounds/' + file;
            audio.autoplay = true;
            audio.addEventListener('ended', function () {
                chorusRemaining--;
                if (chorusRemaining > 0) {
                    try {
                        audio.currentTime = 0;
                        audio.play();
                    } catch (e) {
                        console.error('IKST再生再試行エラー:', e);
                    }
                } else {
                    ikstIndex++;
                    if (ikstIndex >= ikstList.length) {
                        ikstIndex = 0;
                    }
                    if (isIKSTPlaying) playNextIKST();
                }
            });
            document.body.appendChild(audio);
        }

        ikstBtn.onclick = function () {
            // JRE-IKSTシリーズ＋新幹線シリーズを昇順で結合
            ikstList = groups['JRE-IKST']
                .concat(groups['JRE-IKST（新幹線）'])
                .sort((a, b) => a.localeCompare(b, 'ja'));
            if (ikstList.length === 0) {
                alert('JRE-IKSTシリーズがありません');
                return;
            }
            // コーラス数を取得して設定
            chorusesCount = parseInt(chorusInput.value, 10) || 1;
            chorusRemaining = chorusesCount;
            randomUI.style.display = 'none';
            isIKSTPlaying = true;
            ikstIndex = 0;
            playNextIKST();
        };

        function stopIKST() {
            isIKSTPlaying = false;
            h1.textContent = '発車ベル';
            const old = document.getElementById('ikstAudio');
            if (old) old.remove();
            // コーラス状態をリセット
            chorusRemaining = 0;
        }

        function playNextRandom() {
            // 既存のaudio要素を削除
            const old = document.getElementById('randomAudio');
            if (old) old.remove();

            if (playIndex >= playList.length) {
                playList = shuffle(playList);
                playIndex = 0;
                console.log('今回のランダム再生順:', playList);
            }
            const file = playList[playIndex];
            h1.textContent = file.replace(/\.mp3$/i, '');
            if (file.startsWith('ｺﾞ')) {
                h1.textContent = h1.textContent.replace(/^ｺﾞ/, '');
            } else if (file.includes('接近メロディー')) {
                h1.textContent = h1.textContent.replace(/接近メロディー/i, '').trim();
            } else if (file.startsWith('私')) {
                h1.textContent = h1.textContent.replace(/^私/, '');
            }

            // 新しいaudio要素を作成
            // そのトラックを指定コーラス分繰り返す
            chorusRemaining = chorusesCount;
            const audio = document.createElement('audio');
            audio.id = 'randomAudio';
            audio.src = 'sounds/' + file;
            audio.autoplay = true;
            audio.addEventListener('ended', function () {
                chorusRemaining--;
                if (chorusRemaining > 0) {
                    // 同じ曲をもう一度再生
                    try {
                        audio.currentTime = 0;
                        audio.play();
                    } catch (e) {
                        console.error('再生再試行エラー:', e);
                    }
                } else {
                    // 次の曲へ
                    playIndex++;
                    if (isRandomPlaying) playNextRandom();
                }
            });
            document.body.appendChild(audio);
        }

        hiddenBtn.addEventListener('click', function () {
            if (isRandomPlaying) {
                // ランダム再生を停止し、表示を元に戻す
                isRandomPlaying = false;
                h1.textContent = '発車ベル';
                const old = document.getElementById('randomAudio');
                if (old) old.remove();
                // コーラス状態をリセット
                chorusRemaining = 0;
                ikstBtn.style.display = 'none';
                return;
            }
            if (isIKSTPlaying) {
                stopIKST();
                ikstBtn.style.display = 'none';
                return;
            }
            // UI表示
            randomUI.style.display = 'block';
            ikstBtn.style.display = 'inline-block';
        });

        playBtn.onclick = function () {
            // チェックされたグループのみ抽出
            const selectedGroups = displayOrder.filter(label => groupCheckboxes[label].checked);
            let selectedFiles = [];
            selectedGroups.forEach(label => {
                selectedFiles = selectedFiles.concat(groups[label]);
            });
            if (selectedFiles.length === 0) {
                alert('グループを選択してください');
                return;
            }
            randomUI.style.display = 'none';
            // コーラス数を取得
            chorusesCount = parseInt(chorusInput.value, 10) || 1;
            chorusRemaining = chorusesCount;
            isRandomPlaying = true;
            playList = shuffle(selectedFiles);
            playIndex = 0;
            playNextRandom();
            ikstBtn.style.display = 'none';
            console.log('今回のランダム再生順:', playList);
        };
    </script>
</body>

</html>
