<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1500px">
    <title>HND International FIDS - High Precision Replica</title>
    <style>
        @font-face {
            font-family: 'Frutiger';
            src: url(fonts/Frutiger.ttf) format('truetype');
        }
        @font-face {
            font-family: 'ShinGo';
            src: url(fonts/AOTFSHINGOPROREGULAR.OTF) format('opentype');
        }
        :root {
            /* 本物のフォントを最優先。なければシステムで近いものを */
            --font-main: 'Frutiger', sans-serif;
            --font-ja: 'ShinGo', sans-serif;
            
            --bg-deep: #000000;
            --bg-stripe: #2b2d30; /* 縞模様用のわずかに明るいグレー */
            --hnd-blue: #003399;
            --text-white: #ffffff;
            --text-orange: #ffcc00;
            --border-line: #1a2a3a;
            --header-label: #88aadd;
        }

        body {
            background-color: white;
            margin: 0;
            padding: 5px;
            color: var(--text-white);
            font-family: var(--font-main);
            -webkit-font-smoothing: antialiased;
        }

        .fids-board {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            background-color: var(--bg-deep);
            border: 1px solid #222;
        }

        /* ヘッダー */
        .fids-header {
            background-color: black;
            padding: 4px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--text-white);
        }

        .title-box h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 500;
            letter-spacing: 1px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .mode-icon { display: inline-flex; align-items: center; width: 28px; height: 28px; line-height: 1; }
        .mode-icon img, .mode-icon svg { width: 28px; height: 28px; display: block; }
        .mode-icon img.hidden, .mode-icon svg.hidden { display: none; }
        .dep-fill { fill: #00cc66; }
        .arr-fill { fill: #ffcc00; }
        .mode-text { font-family: var(--font-ja); }

        .clock-box { text-align: right; }
        .time-display { font-size: 34px; font-weight: 400; line-height: 1; }

        /* タブ */
        .tab-bar { display: flex; background: #001a33; }
        .tab-btn {
            padding: 6px 25px;
            font-size: 15px;
            font-weight: bold;
            background: none; border: none;
            color: #556677; cursor: pointer;
            font-family: 'Frutiger',var(--font-ja);
        }
        .tab-btn.active {
            background: #002a55;
            color: var(--text-white);
            border-bottom: 2px solid var(--text-orange);
        }

        /* テーブル */
        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        th {
            background-color: #001a33;
            color: white;
            text-align: left;
            padding: 4px 15px;
            font-size: 12px;
            font-family: var(--font-ja);
            font-weight: 500;
            border-bottom: 3px solid #00ba22;
        }

        /* 縞模様の適用 */
        tbody tr:nth-child(odd) { background-color: var(--bg-deep); }
        tbody tr:nth-child(even) { background-color: var(--bg-stripe); }

        td {
            padding: 5px 15px;
            border-bottom: 1px solid var(--border-line);
            font-size: 23px; /* 高解像度向けに微調整 */
            font-weight: 400;
            height: 30px;
            overflow: hidden;
            line-height: 100%;
            white-space: nowrap;
            vertical-align: middle;
        }

        /* 列別設定 */
        .col-time { width: 110px; }
        .col-time, .col-status { position: relative; vertical-align: middle; }
        .sched-time { font-size: 25px; color: var(--text-white); margin-right: 10px; }
        .estim-time { font-size: 25px; color: var(--text-orange); }

        .col-dest { width: 380px; font-family: var(--font-ja); }
        .col-dest span { font-family: var(--font-main); font-size: 17px; margin-left: 8px; }

        .col-flight { width: 100px; }
        .main-flight { font-size: 23px; margin-right: 6px; margin-left: 4px; display: inline-block; vertical-align: middle; line-height: 1; }
        .sub-flight { font-size: 23px; }

        /* 航空会社ロゴ */
        .airline-logos { display: inline-flex; gap: 6px; align-items: center; }
        .airline-logo { display: inline-flex; align-items: center; justify-content: center; width: 44px; margin-right: 4px; vertical-align: middle; }
        .airline-logo img { width: 36px; height: 24px; object-fit: contain; display: block; vertical-align: middle; transform-origin: center center; transform: scale(1.4); }
        .airline-logo.secondary img { width: 24px; height: 16px; transform-origin: center center; transform: scale(1.2); }
        .airline-fallback { display: none; align-items: center; justify-content: center; width: 36px; height: 24px; background: #222; color: #fff; font-size: 12px; border-radius: 2px; }

        .col-gate { width: 80px; text-align: left; }
        .col-codeshare { width: 100px; }
        .col-status { width: 200px; font-family: var(--font-ja); vertical-align: middle;}

        /* コードシェア列 */
        .codeshare-list { display: inline-flex; gap: 8px; align-items: center; overflow: hidden; white-space: nowrap; }
        .codeshare-item { display: inline-flex; align-items: center; gap: 11px; vertical-align: middle; }
        .codeshare-item img { width: 36px; height: 24px; object-fit: contain; display: block; transform-origin: center center; transform: scale(1.4); }
        .codeshare-text { font-size: 23px; }

        /* ハイライト行の左に縦線を表示 */
        .highlight-line td.col-time::before,
        .highlight-line td.col-status::before {
            content: '';
            position: absolute;
            left: 8px;
            top: 15%;
            bottom: 15%;
            width: 4px;
            background: var(--text-orange);
            border-radius: 0px;
        }

        .status-orange { color: var(--text-orange); }
        .fade-out { opacity: 0; transition: opacity 0.3s; }
    </style>
</head>
<body>

<div class="fids-board">
    <div class="fids-header">
        <div class="title-box"><h1 id="js-mode-title">
                <span class="mode-icon">
                    <img id="icon-dep" src="departure.png" alt="出発">
                    <img id="icon-arr" src="arrival.png" alt="到着" class="hidden">
                </span>
                <span class="mode-text">出発</span>
            </h1></div>
        <div class="clock-box">
            <div class="time-display" id="js-clock">00:00</div>
        </div>
    </div>

    <div class="tab-bar">
        <button class="tab-btn active" id="btn-dep" onclick="switchMode('departure')">出発 DEPARTURES</button>
        <button class="tab-btn" id="btn-arr" onclick="switchMode('arrival')">到着 ARRIVALS</button>
    </div>

    <table>
        <thead id="js-thead"></thead>
        <tbody id="js-tbody"></tbody>
    </table>
</div>

<script>
    const API_KEY = 'od5dwqe1ja91vjtdq6uij9tfgqhrce8wgzx20jt76z68tswjetzgxtfxqng09vwx';
    let currentMode = 'departure';
    let flightEntries = [];

    // ステータスの日本語マッピング
    const statusMap = {
        'CHECKIN': '搭乗手続中',
        'CHECKINCLOSE': '搭乗終了',
        'NOWBOARDING': '搭乗中',
        'FINALCALL': '最終搭乗案内',
        'DEPARTED': '出発済',
        'ARRIVED': '到着済',
        'CANCELLED': '欠航',
        'DELAYED': '遅延',
        'ONTIME': '定刻',
        'LANDED': '着陸済',
        'BAGGAGEAVAILABLE': '手荷物受取',
        'POSTPONEDTOMORROW': '明日出発'
    };

    const cityMap = {
        'DXB': ['ドバイ', 'DUBAI'], 'HKG': ['香港', 'HONG KONG'], 'ICN': ['ソウル(仁川)', 'SEOUL(INCHEON)'], 'LHR': ['ロンドン/ヒースロー', 'LONDON'], 'FRA': ['フランクフルト', 'FRANKFURT'], 'ORD': ['シカゴ', 'CHICAGO'],
        'TSA': ['台北(松山)', 'TAIPEI(SONGSHAN)'], 'LAX': ['ロサンゼルス', 'LOS ANGELES'], 'GMP': ['ソウル(金浦)', 'SEOUL(GIMPO)'], 'BKK': ['バンコク', 'BANGKOK'], 'SIN': ['シンガポール', 'SINGAPORE'], 'PVG': ['上海(浦東)', 'SHANGHAI(PUDONG)'],
        'EWR': ['ニューヨーク(LGA)', 'NEW YORK(LGA)'], 'SFO': ['サンフランシスコ', 'SAN FRANCISCO'], 'JFK': ['ニューヨーク(JFK)', 'NEW YORK(JFK)'], 'DTW': ['デトロイト', 'DETROIT'], 'HAN': ['ハノイ', 'HANOI'], 'SEA': ['シアトル', 'SEATTLE'], 'PEK': ['北京(首都)', 'BEIJING(CAPITAL)'],
        'PKX': ['北京(大興)', 'BEIJING(DA XING)'], 'MNL': ['マニラ', 'MANILA'], 'CDG': ['パリ(CDG)', 'PARIS(CDG)'], 'HEL': ['ヘルシンキ', 'HELSINKI'], 'DLC': ['大連', 'DALIAN'], 'SHA': ['上海(虹橋)', 'SHANGHAI(HONGQIAO)'], 'HEL': ['ヘルシンキ', 'HELSINKI'], 'YYZ': ['トロント', 'TORONTO'], 'SYD': ['シドニー', 'SYDNEY'],
        'ATL': ['アトランタ', 'ATLANTA'], 'MEX': ['メキシコシティ', 'MEXICO CITY'], 'HNL': ['ホノルル', 'HONOLULU'], 'IST': ['イスタンブール', 'ISTANBUL'], 'YVR': ['バンクーバー', 'VANCOUVER'], 'KUL': ['クアラルンプール', 'KUALA LUMPUR'], 'SZX': ['深圳', 'SHENZHEN'],
        'CAN': ['広州', 'GUANGZHOU'], 'BOM': ['ムンバイ', 'MUMBAI'], 'CJU': ['済州', 'JEJU'], 'COK': ['コーチン', 'KOCHI'], 'DEL': ['デリー', 'DELHI'], 'GUM': ['グアム', 'GUAM'], 'VIE': ['ウィーン', 'VIENNA'], 'DOH': ['ドーハ', 'DOHA'],
        'MUC': ['ミュンヘン', 'MUNICH'], 'MXP': ['ミラノ', 'MILAN'], 'ARN': ['ストックホルム', 'STOCKHOLM'], 'CPH': ['コペンハーゲン', 'COPENHAGEN'], 'ZRH': ['チューリッヒ', 'ZURICH'], 'CGK': ['ジャカルタ', 'JAKARTA'],
        'FCO': ['ローマ', 'ROME'], 'IAD': ['ワシントンD.C.', 'WASHINGTON D.C.'], 'MSP': ['ミネアポリス', 'MINNEAPOLIS'], 'IAH': ['ヒューストン', 'HOUSTON'], 'DFW': ['ダラス', 'DALLAS']
    };

    function updateClock() {
        const now = new Date();
        document.getElementById('js-clock').innerText = now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0');
    }
    setInterval(updateClock, 1000);
    updateClock();

    async function fetchFlights() {
        const type = currentMode === 'departure' ? 'odpt:FlightInformationDeparture' : 'odpt:FlightInformationArrival';
        const url = `https://api-challenge.odpt.org/api/v4/${type}?odpt:operator=odpt.Operator:HND-TIAT&acl:consumerKey=${API_KEY}`;
        
        try {
            const res = await fetch(url);
            const data = await res.json();
            const nowTime = new Date().getHours().toString().padStart(2, '0') + ":" + new Date().getMinutes().toString().padStart(2, '0');

            flightEntries = data.map(f => {
                const sched = f['odpt:scheduledDepartureTime'] || f['odpt:scheduledArrivalTime'];
                const estim = f['odpt:estimatedDepartureTime'] || f['odpt:estimatedArrivalTime'];
                const rawStatus = (f['odpt:flightStatus'] || '').split(':').pop().toUpperCase();

                // 到着モード時はターミナル表示を T1/T2/T3 形式に正規化する
                let gateVal = '-';
                if (currentMode === 'departure') {
                    gateVal = f['odpt:departureGate'] || '';
                } else {
                    let t = f['odpt:arrivalAirportTerminal'] || '';
                    if (t && t.indexOf('.') !== -1) t = t.split('.').pop();
                    // 例: 'T1', 'Terminal 1', 'Terminal1', '1' などに対応
                    const mT = t.match(/T(\d+)/i);
                    const mTerm = t.match(/Terminal[\s-_]*(\d+)/i);
                    const mNum = t.match(/(\d+)/);
                    if (mT) t = 'T' + mT[1];
                    else if (mTerm) t = 'T' + mTerm[1];
                    else if (mNum) t = 'T' + mNum[1];
                    gateVal = t || '-';
                }

                return {
                    sched,
                    estim: (estim && estim !== sched) ? estim : null,
                    dest: (f['odpt:destinationAirport'] || f['odpt:originAirport'] || '').split(':').pop(),
                    flights: f['odpt:flightNumber'] || [],
                    gate: gateVal,
                    status: statusMap[rawStatus] || rawStatus,
                    subIdx: 1
                };
            })
            .filter(f => (f.estim || f.sched) >= nowTime)
            .sort((a, b) => (a.estim || a.sched).localeCompare(b.estim || b.sched))
            .slice(0, 15);

            renderBoard();
        } catch (e) { console.error(e); }
    }

    function renderBoard() {
        const thead = document.getElementById('js-thead');
        const tbody = document.getElementById('js-tbody');
        
        thead.innerHTML = `<tr><th class="col-time">定刻　　　　変更時刻</th><th class="col-dest">${currentMode === 'departure' ? '行先' : '出発地'}</th><th class="col-flight">便名</th><th class="col-codeshare"></th><th class="col-gate">${currentMode === 'departure' ? '搭乗口' : 'ターミナル'}</th><th class="col-status">備考</th></tr>`;

        tbody.innerHTML = '';
        flightEntries.forEach((f, idx) => {
            const tr = document.createElement('tr');
            const city = cityMap[f.dest] || [f.dest, f.dest];
            
            // 便名ごとにロゴをセット表示（メイン便は大きめ）。コードシェアは別列に表示
            const flightsArray = Array.isArray(f.flights) ? f.flights : [f.flights];
            const firstFlight = flightsArray[0] || '';

            const mainCodeMatch = (firstFlight || '').match(/^\s*([A-Za-z0-9]{2})/);
            const mainCode = mainCodeMatch ? mainCodeMatch[1].toUpperCase() : '';
            const mainLogo = `<span class="airline-logo">` +
                `<img src="logos/${mainCode}.png" alt="${mainCode}" ` +
                `onerror="this.style.display='none'; this.parentNode.querySelector('.airline-fallback').style.display='inline-flex';" ` +
                `onload="this.parentNode.querySelector('.airline-fallback').style.display='none';">` +
                `<span class="airline-fallback">${mainCode}</span>` +
                `</span>`;

            // 便名が複数ある場合は、コードシェアを専用の列(td.col-codeshare)に表示する。
            const codeshares = flightsArray.slice(1).filter(Boolean);
            let codeshareHtml = '';
            if (codeshares.length) {
                // 初期は2番目の便を表示（インライン要素にidを付けてローテーションで差し替える）
                const cs0 = codeshares[0];
                const m0 = (cs0 || '').match(/^\s*([A-Za-z0-9]{2})/);
                const c0 = m0 ? m0[1].toUpperCase() : '';
                codeshareHtml = `<span class="codeshare-item" id="codeshare-${idx}">` +
                    `<img src="logos/${c0}.png" alt="${c0}" ` +
                    `onerror="this.style.display='none'; this.parentNode.querySelector('.codeshare-text').style.display='inline-block';">` +
                    `<span class="codeshare-text">${cs0}</span>` +
                    `</span>`;
            }

            const flightsHtml = `${mainLogo}<span class="main-flight">${firstFlight}</span>`;
            const isStatusOrange = (f.status === '搭乗中' || f.status === '最終搭乗案内' || f.status === '遅延' || f.status === '欠航' || f.status === '手荷物受取');
            const isHighlightLine = (f.status === '搭乗中' || f.status === '最終搭乗案内' || f.status === '手荷物受取');

            tr.innerHTML = `
                <td class="col-time"><span class="sched-time">${f.sched}</span><span class="estim-time">${f.estim || ''}</span></td>
                <td class="col-dest">${city[0]} <span>${city[1]}</span></td>
                <td class="col-flight">${flightsHtml}</td>
                <td class="col-codeshare">${codeshareHtml || ''}</td>
                <td class="col-gate">${f.gate}</td>
                <td class="col-status ${isStatusOrange ? 'status-orange' : ''}">${f.status}</td>
            `;
            tr.classList.toggle('highlight-line', isHighlightLine);
            tbody.appendChild(tr);
        });

        // 空行で15行分にする
        const currentCount = flightEntries.length;
        for (let i = currentCount; i < 15; i++) {
            const trEmpty = document.createElement('tr');
            trEmpty.innerHTML = `
                <td class="col-time"></td>
                <td class="col-dest"></td>
                <td class="col-flight"></td>
                <td class="col-codeshare"></td>
                <td class="col-gate"></td>
                <td class="col-status"></td>
            `;
            tbody.appendChild(trEmpty);
        }
    }

    function rotateSubFlights() {
        flightEntries.forEach((f, idx) => {
            if (!Array.isArray(f.flights) || f.flights.length <= 2) return;
            const el = document.getElementById(`codeshare-${idx}`);
            if (!el) return;
            el.classList.add('fade-out');
            setTimeout(() => {
                f.subIdx = (f.subIdx % (f.flights.length - 1)) + 1;
                const newFlight = f.flights[f.subIdx];
                const m = (newFlight || '').match(/^\s*([A-Za-z0-9]{2})/);
                const code = m ? m[1].toUpperCase() : '';
                const img = el.querySelector('img');
                const txt = el.querySelector('.codeshare-text');
                if (img) { img.src = `logos/${code}.png`; img.alt = code; img.style.display = ''; }
                if (txt) txt.innerText = newFlight;
                el.classList.remove('fade-out');
            }, 300);
        });
    }

    function switchMode(mode) {
        currentMode = mode;
        const titleEl = document.getElementById('js-mode-title');
        const depIcon = titleEl.querySelector('#icon-dep');
        const arrIcon = titleEl.querySelector('#icon-arr');
        const textEl = titleEl.querySelector('.mode-text');
        if (mode === 'departure') {
            depIcon.classList.remove('hidden');
            arrIcon.classList.add('hidden');
            textEl.innerText = '出発';
        } else {
            depIcon.classList.add('hidden');
            arrIcon.classList.remove('hidden');
            textEl.innerText = '到着';
        }
        document.getElementById('btn-dep').classList.toggle('active', mode === 'departure');
        document.getElementById('btn-arr').classList.toggle('active', mode === 'arrival');
        fetchFlights();
    }

    fetchFlights();
    setInterval(fetchFlights, 60000);
    setInterval(rotateSubFlights, 6000);
</script>

</body>
</html>
