<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1100,initial-scale=1" />
  <title>山手駅 発車標</title>
  <style>
    @font-face {
      font-family: "Frutiger";
      src: url("Frutiger.ttf") format("truetype");
    }

    @font-face {
      font-family: "Frutiger-B";
      src: url(Frutiger_bold.ttf) format("truetype");
    }

    @font-face {
      font-family: "ShinGo";
      src: url(AOTFShinGoProMedium.otf) format("opentype");
    }

    :root {
      --bg: #0b0b0b;
      --muted: #9aa3a8;
      --jk-blue: #00bae8;
      --jh-green: #80C342;
    }

    body {
      margin: 0;
      font-family: "Frutiger", "ShinGo", sans-serif;
      background: #ffffff;
      display: block;
      padding: 24px;
      color: #fff;
    }

    .atos {
      width: 1000px;
      background: #1a1a1a;
      border-radius: 8px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, .7);
      display: flex;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.03);
      margin: 24px auto;
    }

    .slot-number {
      font-family: "Frutiger-B";
      width: 140px;
      background: #1f1f1f;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .slot-number .num {
      font-size: 160px;
      color: #e8e8e8;
      text-shadow: 0 2px 0 rgba(0, 0, 0, .6);
    }

    .display {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 10px 16px;
      box-sizing: border-box;
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0px 12px;
      background: #2b2b2b;
      border-radius: 4px;
      margin-bottom: 8px;
    }

    .jk-badge {
      font-family: "Frutiger-B";
      width: 40px;
      height: 40px;
      border: var(--jk-blue) 5px solid;
      border-radius: 4px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #0b0b0b;
      font-size: 32px;
    }

    .jh-badge {
      font-family: "Frutiger-B";
      width: 40px;
      height: 40px;
      border: var(--jh-green) 5px solid;
      border-radius: 4px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #0b0b0b;
      font-size: 32px;
      margin-left: 20px;
    }

    .station-badge {
      font-family: "Frutiger-B";
      width: 30px;
      height: 30px;
      aspect-ratio: 1/1;
      border: 5px solid var(--jk-blue);
      border-radius: 4px;
      background: #fff;
      display: flex;
      flex-direction: column;
      /* 縦方向に配置 */
      align-items: center;
      justify-content: center;
      color: #0b0b0b;
      font-size: 16px;
      padding: 2px 4px 4px 4px;
      margin-right: 8px;
      line-height: 100%;
    }

    .station-prefix {
      font-size: 16px;
      /* 駅ナンバリングの接頭辞のサイズ */
    }

    .station-number {
      font-size: 23px;
      /* 駅ナンバリングの数字のサイズ */
    }

    .line-name {
      color: #ffffff;
      font-size: 20px;
      line-height: 1.2;
    }

    .line-sub {
      color: #fff;
      font-size: 25px;
      line-height: 1.2;
      text-align: right;
    }

    .rows {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .row {
      display: grid;
      grid-template-columns: 200px 220px 1fr;
      align-items: center;
      background: #0c0c0c;
      border-radius: 4px;
      padding: 4px 8px;
      min-height: 80px;
      border-top: #fff 1px solid;
    }

    .type {
      font-family: "Helvetica", "ShinGo";
      font-size: 28px;
      width: 200px;
      color: #fff;
      text-align: center;
      background-color: #ff0000;
      border-radius: 7px;
      line-height: 100%;
      padding: 6px 0;
      justify-content: center;
    }

    .route-label {
      font-family: "Helvetica", "ShinGo";
      width: 200px;
      font-size: 20px;
      margin: 0;
      line-height: 130%;
    }

    .time {
      font-size: 75px;
      text-align: right;
    }

    .platform {
      font-size: 52px;
      text-align: left;
      color: #fff;
      display: flex;
      gap: 8px;
      justify-content: flex-start;
      align-items: center;
    }

    .badge-circle {
      width: 38px;
      height: 26px;
      border-radius: 4px;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    .badge-jb {
      background: var(--jb-yellow);
      color: #111;
    }

    .cars-badge {
      color: #fffd94;
      font-size: 55px;
      border-radius: 6px;
      padding: 2px 0px;
      margin-right: 10px;
      display: inline-block;
      width: 105px;
    }

    .dest-text {
      font-family: "Helvetica", "ShinGo";
      font-size: 52px;
      line-height: 100%;
      color: #fff;
      display: flex;
      align-items: center;
      width: 280px;
    }

    .dest-text .sx-shrink {
      display: inline-block;
      transform-origin: left center;
      vertical-align: middle;
      white-space: nowrap;
    }

    td {
      padding: 0;
      margin: 0;
      line-height: 100%;
    }

    tr {
      height: 85px;
    }
  </style>
</head>

<body>
  <!-- 1番線表示 -->
  <div class="atos">
    <div class="slot-number">
      <div class="num">1</div>
    </div>
    <div class="display">
      <div class="topbar">
        <div class="jk-badge"><span>JK</span></div>
        <div>
          <div class="line-name">根岸線</div>
          <div class="line-sub">磯子・大船方面</div>
        </div>
      </div>
      <div class="rows" id="rows1"></div>
    </div>
  </div>
  <!-- 2番線表示 -->
  <div class="atos">
    <div class="slot-number">
      <div class="num">2</div>
    </div>
    <div class="display">
      <div class="topbar">
        <div class="jk-badge"><span>JK</span></div>
        <div>
          <div class="line-name">京浜東北・根岸線</div>
          <div class="line-sub">横浜・川崎・品川・東京方面</div>
        </div>
        <div class="jh-badge"><span>JH</span></div>
        <div>
          <div class="line-name">横浜線</div>
          <div class="line-sub">新横浜・八王子方面</div>
        </div>
      </div>
      <div class="rows" id="rows2"></div>
    </div>
  </div>
  <button id="enable-audio-btn"
    style="position:fixed;top:30px;right:30px;z-index:1000;font-size:15px;padding:6px 12px;">ATOS放送</button>
  <script>
    let debugTime = null; // 例: "23:58" など。nullなら通常の現在時刻
    function getNowDate() {
      if (debugTime) {
        const now = new Date();
        const [h, m] = debugTime.split(':').map(Number);
        now.setHours(h);
        now.setMinutes(m);
        now.setSeconds(0);
        now.setMilliseconds(0);
        return now;
      } else {
        return new Date();
      }
    }

    const stationNumbers = {
      '大船': 'JK01', '磯子': 'JK06', '桜木町': 'JK11', '横浜': 'JK12', '鶴見': 'JK15', '蒲田': 'JK17', '品川': 'JK20', '上野': 'JK30', '東十条': 'JK37', '赤羽': 'JK38', '南浦和': 'JK42', '大宮': 'JK47',
      '東神奈川': 'JH13', '八王子': 'JH32', '橋本': 'JH28', '町田': 'JH23', '中山': 'JH19'
    };
    const lineColors = { JK: '#00bae8', JH: '#80C342' };
    const typeColors = { '快': 'red', '快　速': 'red', '各駅停車': '#383838', '普　通': '#383838', '通勤快速': 'purple', '特別快速': 'green', '特　急': 'red', 'はまかいじ': 'red' };
    const rowsEl1 = document.getElementById('rows1');
    const rowsEl2 = document.getElementById('rows2');
    let trains1 = [];
    let trains2 = [];

    function buildTable(data) {
      isAltMode = false;
      const table = document.createElement('table');
      table.style.width = '100%';
      table.style.borderCollapse = 'collapse';

      data.forEach(datum => {
        const tr = document.createElement('tr');
        tr.style.background = '#0c0c0c';
        tr.style.borderRadius = '4px';
        tr.style.minHeight = '80px';
        tr.style.borderTop = '#fff 1px solid';

        // 路線名ラベル
        const typeTd = document.createElement('td');
        typeTd.style.textAlign = 'left';
        typeTd.style.width = '120px';
        typeTd.style.verticalAlign = 'center';
        // 路線名分岐（駅ナンバリングのprefixで判定）
        let routeName = '';
        let routeColor = '';
        // ↓ここでdestArrを定義
        let destArr = datum.dest ? datum.dest.split(',') : [''];
        if (destArr.length > 1) isAltMode = true;
        const stationNumber = stationNumbers[destArr[altIndex % destArr.length]];
        if (stationNumber) {
          const prefix = stationNumber.match(/([A-Za-z]+)/)[1];
          if (prefix === 'JH') {
            routeName = '横浜線';
            routeColor = 'var(--jh-green)';
          } else if (prefix === 'JK') {
            routeName = '京浜東北線';
            routeColor = 'var(--jk-blue)';
          } else {
            routeName = '';
            routeColor = '#fff';
          }
        } else {
          routeName = '';
          routeColor = '#fff';
        }
        const routeLabel = document.createElement('div');
        routeLabel.className = 'route-label';
        if (showEnglish && routeEn[routeName]) {
          routeLabel.textContent = routeEn[routeName];
        } else {
          routeLabel.textContent = routeName;
        }
        routeLabel.style.color = routeColor;
        routeLabel.style.background = 'none';
        routeLabel.style.marginBottom = '0px';
        routeLabel.style.justifyContent = 'flex-start';
        typeTd.appendChild(routeLabel);

        // 種別
        let typeArr = datum.type ? datum.type.split(',') : [''];
        // 省略記号を正式名称に変換
        typeArr = typeArr.map(t => abbrevTypeMap[t] || t);
        if (typeArr.length > 1) isAltMode = true;
        let typeToShow = typeArr[altIndex % typeArr.length] || '';

        // ★ここでtypeBgをtypeToShowで参照するよう修正
        const typeBg = typeColors[typeToShow] || '#0c0c0c';

        const typeDiv = document.createElement('div');
        typeDiv.className = 'type';
        typeDiv.style.backgroundColor = typeBg;

        if (showEnglish && typeEn[typeToShow]) {
          typeDiv.textContent = typeEn[typeToShow];
        } else {
          typeDiv.textContent = typeToShow || '\u00A0';
        }
        if (!routeName) {
          typeDiv.style.height = '50px';
          typeDiv.style.fontSize = '2.5em';
          typeDiv.style.display = 'flex';
          typeDiv.style.alignItems = 'center';
          typeDiv.style.justifyContent = 'center';
        }
        typeTd.appendChild(typeDiv);

        // 時刻
        const timeTd = document.createElement('td');
        timeTd.style.textAlign = 'right';
        if (datum.time) {
          const [h, m] = datum.time.split(':');
          const hour = String(Number(h));
          const minute = String(m).padStart(2, '0');
          timeTd.innerHTML = `<div class="time" style="min-width:110px;">${hour}:${minute}</div>`;
        } else {
          timeTd.innerHTML = '<div class="time" style="min-width:110px;">&nbsp;</div>';
        }

        // 行先＋駅ナンバリング
        const destTd = document.createElement('td');
        destTd.style.textAlign = 'left';
        destTd.style.paddingLeft = '16px';
        destTd.style.width = '240px';
        const destWrap = document.createElement('div');
        destWrap.className = 'dest-text';
        let destToShow = destArr[altIndex % destArr.length] || '';
        // 省略記号を正式名称に変換
        destArr = destArr.map(d => abbrevDestMap[d] || d);
        if (destArr.length > 1) isAltMode = true;
        destToShow = destArr[altIndex % destArr.length] || '';
        if (destToShow) {
          const stationNumber = stationNumbers[destToShow];
          if (stationNumber) {
            const badge = document.createElement('div');
            badge.className = 'station-badge';
            const [prefix, number] = stationNumber.match(/([A-Za-z]+)(\d+)/).slice(1);
            badge.innerHTML = `<span class="station-prefix">${prefix}</span><span class="station-number">${number}</span>`;
            const borderColor = lineColors[prefix] || '#000';
            badge.style.border = `5px solid ${borderColor}`;
            badge.style.marginLeft = '0px';
            destWrap.appendChild(badge);
          }
          const destName = document.createElement('span');
          destName.style.marginLeft = '5px';
          if (showEnglish && destEn[destToShow]) {
            destName.textContent = destEn[destToShow];
            // 幅を計測し、必要ならscaleXを自動計算
            const testSpan = document.createElement('span');
            testSpan.style.visibility = 'hidden';
            testSpan.style.position = 'absolute';
            testSpan.style.fontSize = '52px';
            testSpan.style.fontFamily = '"Helvetica","ShinGo"';
            testSpan.style.whiteSpace = 'nowrap';
            testSpan.textContent = destEn[destToShow];
            document.body.appendChild(testSpan);
            const width = testSpan.offsetWidth;
            document.body.removeChild(testSpan);
            const maxWidth = 225;
            if (width > maxWidth) {
              const scaleX = maxWidth / width;
              destName.style.display = 'inline-block';
              destName.style.transformOrigin = 'left center';
              destName.style.whiteSpace = 'nowrap';
              destName.style.transform = `scaleX(${scaleX})`;
            }
          } else {
            destName.textContent = destToShow;
          }
          destWrap.appendChild(destName);
        } else {
          destWrap.innerHTML = '&nbsp;';
        }
        destTd.appendChild(destWrap);

        // 両数バッジ
        const carsTd = document.createElement('td');
        carsTd.style.textAlign = 'right';
        carsTd.style.width = '100px';
        if (datum.cars) {
          const carsBadge = document.createElement('span');
          carsBadge.className = 'cars-badge';
          if (showEnglish) {
            carsBadge.innerHTML = carsEn(datum.cars);
          } else {
            carsBadge.innerHTML = `${datum.cars}<span style="font-size:0.7em;padding-left:5px;">両</span>`;
          }
          carsTd.appendChild(carsBadge);
        } else {
          carsTd.innerHTML = '&nbsp;';
        }

        tr.appendChild(typeTd);
        tr.appendChild(timeTd);
        tr.appendChild(destTd);
        tr.appendChild(carsTd);

        table.appendChild(tr);
      });
      return table;
    }

    function getCurrentTimeStr() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      return `${h}:${m}`;
    }

    function getUpcomingTrains(data, count = 5) {
      const now = getNowDate();
      let nowMinutes = now.getHours() * 60 + now.getMinutes();
      if (now.getHours() < 4) nowMinutes += 1440;

      // 各列車の分数を計算
      let trainsWithMinutes = data.map(d => {
        if (!d.time) return { ...d, minutes: null };
        const [h, m] = d.time.split(':').map(Number);
        let minutes = h * 60 + m;
        // 4:00未満は+1440分（翌日分）
        if (h < 4) minutes += 1440;
        return { ...d, minutes };
      });

      // 時刻順にソート
      const sorted = trainsWithMinutes
        .filter(d => d.minutes !== null)
        .sort((a, b) => a.minutes - b.minutes);

      // 現在時刻以降の電車を抽出
      const upcoming = sorted.filter(d => d.minutes >= nowMinutes);

      // 必要数だけ取得
      const result = upcoming.slice(0, count).map(d => ({ type: d.type, time: d.time, dest: d.dest, cars: d.cars }));

      // 足りない場合は空行で埋める
      while (result.length < count) {
        result.push({ type: '', time: '', dest: '', cars: '' });
      }
      return result;
    }

    function render() {
      // 1番線
      rowsEl1.innerHTML = '';
      const trainsToShow1 = getUpcomingTrains(trains1, 2);
      rowsEl1.appendChild(buildTable(trainsToShow1));
      // 2番線
      rowsEl2.innerHTML = '';
      const trainsToShow2 = getUpcomingTrains(trains2, 2);
      rowsEl2.appendChild(buildTable(trainsToShow2));
    }

    // --- 英語表記辞書 ---
    const typeEn = {
      '各駅停車': 'Local',
      '快　速': 'Rapid',
      '快　速': 'Rapid',
      '通勤快速': 'Com. Rapid',
      '特別快速': 'Spe. Rapid',
      '普通': 'Local',
      '特　急': 'Ltd. Exp.',
      'はまかいじ': 'Hamakaiji'
    };
    const destEn = {
      '大船': 'Ōfuna',
      '磯子': 'Isogo',
      '桜木町': 'Sakuragichō',
      '横浜': 'Yokohama',
      '鶴見': 'Tsurumi',
      '蒲田': 'Kamata',
      '品川': 'Shinagawa',
      '赤羽': 'Akabane',
      '蒲田': 'Kamata',
      '東十条': 'Higashi-Jūjō',
      '南浦和': 'Minami-Urawa',
      '大宮': 'Ōmiya',
      '東神奈川': 'Higashi-Kanagawa',
      '八王子': 'Hachiōji',
      '町田': 'Machida',
      '川越': 'Kawagoe',
      '橋本': 'Hashimoto',
      '中山': 'Nakayama',
      '松本': 'Matsumoto',
      '南小谷': 'Minami-Otari',
      '長野': 'Nagano',
      '富士山': 'Mt.Fuji',
      '河口湖': 'Kawaguchiko'
    };
    const routeEn = {
      '京浜東北線': 'Keihin-Tōhoku Line',
      '横浜線': 'Yokohama Line'
    };
    const carsEn = n => `${n}<span style="font-size:0.7em;padding-left:0px;">cars</span>`;
    const abbrevTypeMap = {
      '特': '特　急',
      'は': 'はまかいじ',
      '快': '快　速',
      '通': '通勤快速',
      '別': '特別快速',
      '普': '普　通',
      // 必要に応じて追加
    };
    const abbrevDestMap = {
      '赤': '赤羽',
      '大': '大船',
      '磯': '磯子',
      '桜': '桜木町',
      '横': '横浜',
      '鶴': '鶴見',
      '蒲': '蒲田',
      '品': '品川',
      '東': '東十条',
      '浦': '南浦和',
      '宮': '大宮',
      '神': '東神奈川',
      '八': '八王子',
      '町': '町田',
      '川': '川越',
      '橋': '橋本',
      '中': '中山',
      '熊': '熊谷',
      '松': '松本',
      '谷': '南小谷',
      '長': '長野',
      '富': '富士山',
      '河': '河口湖'
      // 必要に応じて追加
    };

    // --- 表示切替用フラグ ---
    let showEnglish = false;
    let altIndex = 0; // 交互表示用インデックス
    let isAltMode = false; // 2要素交互表示モード
    let langTimer = 0;

    // --- 表示切替タイマー ---
    setInterval(() => {
      langTimer++;
      // 2要素交互表示時の周期: 0-59:日1, 60-119:日2, 120-149:英1, 150-179:英2
      // (6秒,6秒,3秒,3秒) 合計180カウント(18秒)
      if (isAltMode) {
        const t = langTimer % 180;
        if (t < 60) {
          showEnglish = false;
          altIndex = 0;
        } else if (t < 120) {
          showEnglish = false;
          altIndex = 1;
        } else if (t < 150) {
          showEnglish = true;
          altIndex = 0;
        } else {
          showEnglish = true;
          altIndex = 1;
        }
      } else {
        // 通常: 0-119:日本語(12秒), 120-179:英語(6秒)
        const t = langTimer % 180;
        if (t < 120) {
          showEnglish = false;
          altIndex = 0;
        } else {
          showEnglish = true;
          altIndex = 0;
        }
      }
    }, 50); // 0.1秒ごと

    // 固定祝日（MM-DD形式）
    const fixedHolidays = [
      '01-01', // 元日
      '02-11', // 建国記念の日
      '02-23', // 天皇誕生日
      '04-29', // 昭和の日
      '05-03', // 憲法記念日
      '05-04', // みどりの日
      '05-05', // こどもの日
      '08-11', // 山の日
      '11-03', // 文化の日
      '11-23', // 勤労感謝の日
    ];

    // 変動祝日計算
    function calcHappyMonday(year, month, nth) {
      // month: 1-12, nth: 第何月曜
      let count = 0;
      for (let d = 1; d <= 31; d++) {
        const date = new Date(year, month - 1, d);
        if (date.getMonth() + 1 !== month) break;
        if (date.getDay() === 1) {
          count++;
          if (count === nth) return d;
        }
      }
      return null;
    }

    // 春分・秋分の日（国立天文台方式、2099年まで対応）
    function calcVernalEquinox(year) {
      if (year <= 1979) return 0;
      if (year <= 2099) return Math.floor(20.8431 + 0.242194 * (year - 1980) - Math.floor((year - 1980) / 4));
      return 0;
    }
    function calcAutumnalEquinox(year) {
      if (year <= 1979) return 0;
      if (year <= 2099) return Math.floor(23.2488 + 0.242194 * (year - 1980) - Math.floor((year - 1980) / 4));
      return 0;
    }

    function isHoliday(date) {
      // 土日祝判定（毎年対応）
      const day = date.getDay();
      if (day === 0 || day === 6) return true; // 日曜または土曜
      const year = date.getFullYear();
      const mmdd = `${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
      // 固定祝日
      if (fixedHolidays.includes(mmdd)) return true;
      // 春分の日
      if (date.getMonth() + 1 === 3 && date.getDate() === calcVernalEquinox(year)) return true;
      // 秋分の日
      if (date.getMonth() + 1 === 9 && date.getDate() === calcAutumnalEquinox(year)) return true;
      // 海の日（7月第3月曜）
      if (date.getMonth() + 1 === 7 && date.getDate() === calcHappyMonday(year, 7, 3)) return true;
      // 敬老の日（9月第3月曜）
      if (date.getMonth() + 1 === 9 && date.getDate() === calcHappyMonday(year, 9, 3)) return true;
      // 体育の日（10月第2月曜、2020年以降はスポーツの日で7月に移動）
      if (year <= 2019 && date.getMonth() + 1 === 10 && date.getDate() === calcHappyMonday(year, 10, 2)) return true;
      // スポーツの日（2020年以降、7月第2月曜）
      if (year >= 2020 && date.getMonth() + 1 === 7 && date.getDate() === calcHappyMonday(year, 7, 2)) return true;
      return false;
    }

    // 音声連続再生: 各音声ごとに新しいAudioインスタンスを生成し、endedイベントのみで制御

    // --- 行先・種別リスト管理 ---

    const audioCache = {};

    let audioPlaying = false;


    // --- playAudioSequence1 ---
    function playAudioSequence1(train) {
  // デバッグ用: files配列の中身を出力
  setTimeout(() => { console.log('playAudioSequence1 files:', files); }, 0);
      if (!audioEnabled || audioPlaying) return;

      // 種別が複数ある場合は全て正式名称に変換して連結
      let typeArr = train.type ? train.type.split(',') : [];
      typeArr = typeArr.map(t => abbrevTypeMap[t] || t);
      let typePhrase = typeArr.join('　'); // 全角スペースで連結

      // 行先も複数ある場合は全て正式名称に変換して連結（ただし通常は1つ）
      let destArr = train.dest ? train.dest.split(',') : [];
      destArr = destArr.map(d => abbrevDestMap[d] || d);
      let destPhrase = destArr.join('・'); // 複数なら「・」で連結

      let typeFile = `atos/w/${typePhrase}.mp3`.replace(/\s/g, '');
      let destFile = `atos/w/${destPhrase}行がまいります.mp3`;
      let destSingleFile = `atos/w/${destPhrase}.mp3`;
      let goFile = `atos/w/行がまいります.mp3`;
      let files = [
        'atos/ATOS接近音.mp3',
        'atos/w/まもなく1番線に.mp3'
      ];

      // 種別音声
      if (audioCache[typeFile]) {
        files.push(typeFile);
      } else {
        // 個別に分割して再生（例：「特急」「はまかいじ」）
        typeArr.forEach(t => {
          let tFull = t.replace(/\s/g, '').replace(/　/g, ''); // ←全角・半角スペース両方除去
          let tFile = `atos/w/${tFull}.mp3`;
          if (audioCache[tFile]) files.push(tFile);
        });
      }

      // 行先音声
      if (audioCache[destFile]) {
        files.push(destFile);
      } else if (destArr.length === 2) {
        // 2つある場合は従来通り
        destArr.forEach((d, i) => {
          let dFull = d.replace(/\s/g, '');
          if (i === 0) {
            let f = `atos/w/${dFull}.mp3`;
            if (audioCache[f]) files.push(f);
          } else {
            let f = `atos/w/${dFull}行がまいります.mp3`;
            if (audioCache[f]) files.push(f);
          }
        });

        if (audioCache[destSingleFile]) files.push(destSingleFile);
        if (audioCache[goFile]) files.push(goFile);

      let idx = 0;
      audioPlaying = true;
      function playNext() {
        if (idx >= files.length) {
          audioPlaying = false;
          return;
        }
        let src = files[idx];
        let audio = audioCache[src] ? audioCache[src].cloneNode() : new Audio(src);

          if (!advanced) {
            advanced = true;
            idx++;
            playNext();

            advanced = true;
            idx++;
            playNext();

            idx++;
            playNext();

    // --- playAudioSequence2 ---

  // デバッグ用: files配列の中身を出力

      if (!audioEnabled || audioPlaying2) return;

        destArr.forEach((d, i) => {
          let dFull = d.replace(/\s/g, '').replace(/　/g, '');
          if (i === 0) {

            if (audioCache[f]) files.push(f);

            let f = `atos/m/${dFull}行がまいります.mp3`;
            if (audioCache[f]) files.push(f);
          }
        });
      } else if (audioCache[destFile]) {
        files.push(destFile);
      }
      // 2つの行先でない場合は必ず両方push
      if (destArr.length !== 2) {
        files.push(destSingleFile);
        files.push(goFile);
      }

      files.push('atos/m/危ないですから.mp3');

      // --- 最終電車放送を追加（2秒ラグ後に） ---
      let isLast = isLastTrainToday(trains2, train);
      let lastTrainFiles = [];
      if (isLast) {
        lastTrainFiles = [
          'atos/m/この電車は.mp3',
          destSingleFile,
          'atos/m/行の最終です.mp3'
        ];
      }

      let idx = 0;
      audioPlaying2 = true;
      function playNext() {
        // 通常放送が終わったら2秒ラグ→最終放送
        if (idx === files.length && isLast && lastTrainFiles.length > 0) {
          setTimeout(() => {
            idx = -100; // 特別な値で分岐
            playNext();
          }, 2000);
          return;
        }
        // 最終放送パート
        if (idx === -100) {
          let lastIdx = 0;
          function playLast() {
            if (lastIdx >= lastTrainFiles.length) {
              audioPlaying2 = false;
              return;
            }
            let src = lastTrainFiles[lastIdx];
            let audio = audioCache[src] ? audioCache[src].cloneNode() : new Audio(src);
            let advanced = false;
            audio.addEventListener('ended', () => {
              if (!advanced) {
                advanced = true;
                lastIdx++;
                playLast();
              }
            });
            audio.addEventListener('error', () => {
              if (!advanced) {
                advanced = true;
                lastIdx++;
                playLast();
              }
            });
            audio.play().catch(() => {
              if (!advanced) {
                advanced = true;
                lastIdx++;
                playLast();
              }
            });
          }
          playLast();
          return;
        }
        // 通常放送パート
        if (idx >= files.length) {
          audioPlaying2 = false;
          return;

          if (!advanced) {
            advanced = true;
            idx++;
            playNext();
          }
        });

          if (!advanced) {
            advanced = true;
            idx++;
            playNext();

          if (!advanced) {
            advanced = true;
            idx++;
            playNext();

        });

    function checkAndAnnounce1() {
      if (!trains1 || trains1.length === 0) return;
      const now = getNowDate();
      let nowMinutes = now.getHours() * 60 + now.getMinutes();
      if (now.getHours() < 4) nowMinutes += 1440; // ← 追加
      const nextTrain = trains1.find(t => t.time && (() => {
        const [h, m] = t.time.split(':').map(Number);
        let min = h * 60 + m;
        if (h < 4) min += 1440;
        return min >= nowMinutes;
      })());
      if (!nextTrain || !nextTrain.time) return;
      const [h, m] = nextTrain.time.split(':').map(Number);
      let trainMin = h * 60 + m;
      if (h < 4) trainMin += 1440;
      // 1分前
      if (trainMin - nowMinutes === 1) {
        if (lastAnnouncedTime1 !== nextTrain.time) {
          playAudioSequence1(nextTrain);
          lastAnnouncedTime1 = nextTrain.time;
        }
      } else if (trainMin - nowMinutes > 1) {
        lastAnnouncedTime1 = null;
      }
    }

    // --- 音声案内機能 2番線 ---
    let lastAnnouncedTime2 = null;
    let audioPlaying2 = false;


    function checkAndAnnounce2() {
      if (!trains2 || trains2.length === 0) return;
      const now = getNowDate();
      let nowMinutes = now.getHours() * 60 + now.getMinutes();
      if (now.getHours() < 4) nowMinutes += 1440; // ← 追加
      const nowSeconds = now.getSeconds();
      const nextTrain = trains2.find(t => t.time && (() => {
        const [h, m] = t.time.split(':').map(Number);
        let min = h * 60 + m;
        if (h < 4) min += 1440;
        return min >= nowMinutes;
      })());
      if (!nextTrain || !nextTrain.time) return;
      const [h, m] = nextTrain.time.split(':').map(Number);
      let trainMin = h * 60 + m;
      if (h < 4) trainMin += 1440;
      const trainTimeSec = trainMin * 60;
      const nowTimeSec = nowMinutes * 60 + nowSeconds;
      // 30秒前
      if (trainTimeSec - nowTimeSec <= 30 && trainTimeSec - nowTimeSec > 0) {
        if (lastAnnouncedTime2 !== nextTrain.time) {
          playAudioSequence2(nextTrain);
          lastAnnouncedTime2 = nextTrain.time;
        }
      } else if (trainTimeSec - nowTimeSec > 30) {
        lastAnnouncedTime2 = null;
      }
    }

    function isLastTrainToday(trains, train) {
      // その日の4:00～翌4:00までの同じ行先の列車のうち、最も遅いものか判定
      if (!train.time || !train.dest) return false;
      // その日の始まり（4:00）と終わり（翌4:00）の分数
      const [h, m] = train.time.split(':').map(Number);
      let trainMin = h * 60 + m;
      if (h < 4) trainMin += 1440;

      // 同じ行先の列車を抽出
      const sameDestTrains = trains.filter(t => t.dest === train.dest && t.time).map(t => {
        const [hh, mm] = t.time.split(':').map(Number);
        let min = hh * 60 + mm;
        if (hh < 4) min += 1440;
        return { ...t, min };
      });
      if (sameDestTrains.length === 0) return false;
      // 最大時刻を持つ列車が自分自身なら最終
      const maxTrain = sameDestTrains.reduce((a, b) => (a.min > b.min ? a : b));
      return maxTrain.time === train.time;
    }

    // 初回ロード
    loadTimetable1();
    loadTimetable2();
    // 30秒ごとに自動更新
    setInterval(() => {
      loadTimetable1();
      loadTimetable2();

    setInterval(render, 100);
    // 1番線音声案内チェック（0.1秒ごと）
    setInterval(checkAndAnnounce1, 100);
    setInterval(checkAndAnnounce2, 100);
