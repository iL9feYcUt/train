<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1100,initial-scale=1" />
  <title>山手駅 発車標</title>
  <style>
    @font-face {
      font-family: "Frutiger";
      src: url("Frutiger.ttf") format("truetype");
    }

    @font-face {
      font-family: "Frutiger-B";
      src: url(Frutiger_bold.ttf) format("truetype");
    }

    @font-face {
      font-family: "ShinGo";
      src: url(AOTFShinGoProMedium.otf) format("opentype");
    }

    :root {
      --bg: #0b0b0b;
      --muted: #9aa3a8;
      --jk-blue: #00bae8;
      --jh-green: #80C342;
    }

    body {
      margin: 0;
      font-family: "Frutiger", "ShinGo", sans-serif;
      background: #ffffff;
      display: block;
      padding: 24px;
      color: #fff;
    }

    .atos {
      width: 1000px;
      background: #1a1a1a;
      border-radius: 8px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, .7);
      display: flex;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.03);
      margin: 24px auto;
    }

    .slot-number {
      font-family: "Frutiger-B";
      width: 140px;
      background: #1f1f1f;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .slot-number .num {
      font-size: 160px;
      color: #e8e8e8;
      text-shadow: 0 2px 0 rgba(0, 0, 0, .6);
    }

    .display {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 10px 16px;
      box-sizing: border-box;
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0px 12px;
      background: #2b2b2b;
      border-radius: 4px;
      margin-bottom: 8px;
    }

    .jk-badge {
      font-family: "Frutiger-B";
      width: 40px;
      height: 40px;
      border: var(--jk-blue) 5px solid;
      border-radius: 4px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #0b0b0b;
      font-size: 32px;
    }

    .jh-badge {
      font-family: "Frutiger-B";
      width: 40px;
      height: 40px;
      border: var(--jh-green) 5px solid;
      border-radius: 4px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #0b0b0b;
      font-size: 32px;
      margin-left: 20px;
    }

    .station-badge {
      font-family: "Frutiger-B";
      width: 30px;
      height: 30px;
      aspect-ratio: 1/1;
      border: 5px solid var(--jk-blue);
      border-radius: 4px;
      background: #fff;
      display: flex;
      flex-direction: column;
      /* 縦方向に配置 */
      align-items: center;
      justify-content: center;
      color: #0b0b0b;
      font-size: 16px;
      padding: 2px 4px 4px 4px;
      margin-right: 8px;
      line-height: 100%;
    }

    .station-prefix {
      font-size: 16px;
      /* 駅ナンバリングの接頭辞のサイズ */
    }

    .station-number {
      font-size: 23px;
      /* 駅ナンバリングの数字のサイズ */
    }

    .line-name {
      color: #ffffff;
      font-size: 20px;
      line-height: 1.2;
    }

    .line-sub {
      color: #fff;
      font-size: 25px;
      line-height: 1.2;
      text-align: right;
    }

    .rows {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .row {
      display: grid;
      grid-template-columns: 200px 220px 1fr;
      align-items: center;
      background: #0c0c0c;
      border-radius: 4px;
      padding: 4px 8px;
      min-height: 80px;
      border-top: #fff 1px solid;
    }

    .type {
      font-size: 28px;
      width: 200px;
      color: #fff;
      text-align: center;
      background-color: #ff0000;
      border-radius: 7px;
      line-height: 100%;
      padding: 6px 0;
      justify-content: center;
    }

    .route-label {
      width: 200px;
      font-size: 20px;
      margin: 0;
      line-height: 130%;
    }

    .time {
      font-size: 75px;
      text-align: right;
    }

    .platform {
      font-size: 52px;
      text-align: left;
      color: #fff;
      display: flex;
      gap: 8px;
      justify-content: flex-start;
      align-items: center;
    }

    .badge-circle {
      width: 38px;
      height: 26px;
      border-radius: 4px;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    .badge-jb {
      background: var(--jb-yellow);
      color: #111;
    }

    .cars-badge {
      color: #fffd94;
      font-size: 55px;
      border-radius: 6px;
      padding: 2px 0px;
      margin-right: 10px;
      display: inline-block;
      width: 105px;
    }

    .dest-text {
      font-size: 52px;
      line-height: 100%;
      color: #fff;
      display: flex;
      align-items: center;
      width: 280px;
    }

    td {
      padding: 0;
      margin: 0;
      line-height: 100%;
    }

    tr {
      height: 85px;
    }
  </style>
</head>

<body>
  <!-- 1番線表示 -->
  <div class="atos">
    <div class="slot-number">
      <div class="num">1</div>
    </div>
    <div class="display">
      <div class="topbar">
        <div class="jk-badge"><span>JK</span></div>
        <div>
          <div class="line-name">根岸線</div>
          <div class="line-sub">磯子・大船方面</div>
        </div>
      </div>
      <div class="rows" id="rows1"></div>
    </div>
  </div>
  <!-- 2番線表示 -->
  <div class="atos">
    <div class="slot-number">
      <div class="num">2</div>
    </div>
    <div class="display">
      <div class="topbar">
        <div class="jk-badge"><span>JK</span></div>
        <div>
          <div class="line-name">京浜東北・根岸線</div>
          <div class="line-sub">横浜・川崎・品川・東京方面</div>
        </div>
        <div class="jh-badge"><span>JH</span></div>
        <div>
          <div class="line-name">横浜線</div>
          <div class="line-sub">新横浜・八王子方面</div>
        </div>
      </div>
      <div class="rows" id="rows2"></div>
    </div>
  </div>
  <button id="enable-audio-btn"
    style="position:fixed;top:30px;right:30px;z-index:1000;font-size:15px;padding:6px 12px;">ATOS放送</button>
  <script>
    let debugTime = null; // 例: "23:58" など。nullなら通常の現在時刻
    function getNowDate() {
      if (debugTime) {
        const now = new Date();
        const [h, m] = debugTime.split(':').map(Number);
        now.setHours(h);
        now.setMinutes(m);
        now.setSeconds(0);
        now.setMilliseconds(0);
        return now;
      } else {
        return new Date();
      }
    }

    const stationNumbers = {
      '大船': 'JK01', '磯子': 'JK06', '桜木町': 'JK11', '鶴見': 'JK15', '蒲田': 'JK17', '品川': 'JK20', '上野': 'JK30', '東十条': 'JK37', '赤羽': 'JK38', '南浦和': 'JK42', '大宮': 'JK47',
      '東神奈川': 'JH13', '八王子': 'JH32', '橋本': 'JH28'
    };
    const lineColors = { JK: '#00bae8', JH: '#80C342' };
    const typeColors = { '快': 'red', '快　速': 'red', '各駅停車': '#383838' };
    const rowsEl1 = document.getElementById('rows1');
    const rowsEl2 = document.getElementById('rows2');
    let trains1 = [];
    let trains2 = [];

    function buildTable(data) {
      const table = document.createElement('table');
      table.style.width = '100%';
      table.style.borderCollapse = 'collapse';

      data.forEach(datum => {
        const tr = document.createElement('tr');
        tr.style.background = '#0c0c0c';
        tr.style.borderRadius = '4px';
        tr.style.minHeight = '80px';
        tr.style.borderTop = '#fff 1px solid';

        // 路線名ラベル
        const typeTd = document.createElement('td');
        typeTd.style.textAlign = 'left';
        typeTd.style.width = '120px';
        typeTd.style.verticalAlign = 'center';
        // 路線名分岐（駅ナンバリングのprefixで判定）
        let routeName = '';
        let routeColor = '';
        const stationNumber = stationNumbers[datum.dest];
        if (stationNumber) {
          const prefix = stationNumber.match(/([A-Za-z]+)/)[1];
          if (prefix === 'JH') {
            routeName = '横浜線';
            routeColor = 'var(--jh-green)';
          } else if (prefix === 'JK') {
            routeName = '京浜東北・根岸線';
            routeColor = 'var(--jk-blue)';
          } else {
            routeName = '';
            routeColor = '#fff';
          }
        } else {
          routeName = '';
          routeColor = '#fff';
        }
        const routeLabel = document.createElement('div');
        routeLabel.className = 'route-label';
        routeLabel.textContent = routeName;
        routeLabel.style.color = routeColor;
        routeLabel.style.background = 'none';
        routeLabel.style.marginBottom = '0px';
        routeLabel.style.justifyContent = 'flex-start';
        typeTd.appendChild(routeLabel);
        // 種別
        const typeBg = typeColors[datum.type] || '#0c0c0c';
        const typeDiv = document.createElement('div');
        typeDiv.className = 'type';
        typeDiv.style.backgroundColor = typeBg;
        typeDiv.textContent = datum.type || '\u00A0';
        // 路線名が空なら種別の高さを倍に
        if (!routeName) {
          typeDiv.style.height = '50px';
          typeDiv.style.fontSize = '2.5em';
          typeDiv.style.display = 'flex';
          typeDiv.style.alignItems = 'center';
          typeDiv.style.justifyContent = 'center';
        }
        typeTd.appendChild(typeDiv);

        // 時刻
        const timeTd = document.createElement('td');
        timeTd.style.textAlign = 'right';
        if (datum.time) {
          const [h, m] = datum.time.split(':');
          const hour = String(Number(h)); // 先頭0を除去
          const minute = String(m).padStart(2, '0');
          // 幅を固定するためspanでmin-width指定
          timeTd.innerHTML = `<div class="time" style="min-width:110px;">${hour}:${minute}</div>`;
        } else {
          timeTd.innerHTML = '<div class="time" style="min-width:110px;">&nbsp;</div>';
        }

        // 行先＋駅ナンバリング
        const destTd = document.createElement('td');
        destTd.style.textAlign = 'left';
        destTd.style.paddingLeft = '16px';
        destTd.style.width = '240px'; // 幅を固定
        const destWrap = document.createElement('div');
        destWrap.className = 'dest-text';
        if (datum.dest) {
          // 駅ナンバリング（stationNumbersに存在する場合のみ表示）
          const stationNumber = stationNumbers[datum.dest];
          if (stationNumber) {
            const badge = document.createElement('div');
            badge.className = 'station-badge';
            const [prefix, number] = stationNumber.match(/([A-Za-z]+)(\d+)/).slice(1);
            badge.innerHTML = `<span class="station-prefix">${prefix}</span><span class="station-number">${number}</span>`;
            // 路線ごとの枠線色を適用
            const borderColor = lineColors[prefix] || '#000'; // デフォルト色
            badge.style.border = `5px solid ${borderColor}`;
            badge.style.marginLeft = '0px';
            destWrap.appendChild(badge);
          }
          const destName = document.createElement('span');
          destName.textContent = datum.dest;
          destName.style.marginLeft = '5px';
          destWrap.appendChild(destName);
        } else {
          destWrap.innerHTML = '&nbsp;';
        }
        destTd.appendChild(destWrap);

        // 両数バッジ（独立した列）
        const carsTd = document.createElement('td');
        carsTd.style.textAlign = 'right';
        carsTd.style.width = '100px'; // 幅を固定
        if (datum.cars) {
          const carsBadge = document.createElement('span');
          carsBadge.className = 'cars-badge';
          carsBadge.innerHTML = `${datum.cars}<span style="font-size:0.7em;padding-left:5px;">両</span>`;
          carsTd.appendChild(carsBadge);
        } else {
          carsTd.innerHTML = '&nbsp;';
        }

        tr.appendChild(typeTd);
        tr.appendChild(timeTd);
        tr.appendChild(destTd);
        tr.appendChild(carsTd);

        table.appendChild(tr);
      });
      return table;
    }

    function getCurrentTimeStr() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      return `${h}:${m}`;
    }

    function getUpcomingTrains(data, count = 5) {
      const now = getNowDate();
      let nowMinutes = now.getHours() * 60 + now.getMinutes();
      if (now.getHours() < 4) nowMinutes += 1440;

      // 各列車の分数を計算
      let trainsWithMinutes = data.map(d => {
        if (!d.time) return { ...d, minutes: null };
        const [h, m] = d.time.split(':').map(Number);
        let minutes = h * 60 + m;
        // 4:00未満は+1440分（翌日分）
        if (h < 4) minutes += 1440;
        return { ...d, minutes };
      });

      // 時刻順にソート
      const sorted = trainsWithMinutes
        .filter(d => d.minutes !== null)
        .sort((a, b) => a.minutes - b.minutes);

      // 現在時刻以降の電車を抽出
      const upcoming = sorted.filter(d => d.minutes >= nowMinutes);

      // 必要数だけ取得
      const result = upcoming.slice(0, count).map(d => ({ type: d.type, time: d.time, dest: d.dest, cars: d.cars }));

      // 足りない場合は空行で埋める
      while (result.length < count) {
        result.push({ type: '', time: '', dest: '', cars: '' });
      }
      return result;
    }

    function render() {
      // 1番線
      rowsEl1.innerHTML = '';
      const trainsToShow1 = getUpcomingTrains(trains1, 2);
      rowsEl1.appendChild(buildTable(trainsToShow1));
      // 2番線
      rowsEl2.innerHTML = '';
      const trainsToShow2 = getUpcomingTrains(trains2, 2);
      rowsEl2.appendChild(buildTable(trainsToShow2));
    }

    // 固定祝日（MM-DD形式）
    const fixedHolidays = [
      '01-01', // 元日
      '02-11', // 建国記念の日
      '02-23', // 天皇誕生日
      '04-29', // 昭和の日
      '05-03', // 憲法記念日
      '05-04', // みどりの日
      '05-05', // こどもの日
      '08-11', // 山の日
      '11-03', // 文化の日
      '11-23', // 勤労感謝の日
    ];

    // 変動祝日計算
    function calcHappyMonday(year, month, nth) {
      // month: 1-12, nth: 第何月曜
      let count = 0;
      for (let d = 1; d <= 31; d++) {
        const date = new Date(year, month - 1, d);
        if (date.getMonth() + 1 !== month) break;
        if (date.getDay() === 1) {
          count++;
          if (count === nth) return d;
        }
      }
      return null;
    }

    // 春分・秋分の日（国立天文台方式、2099年まで対応）
    function calcVernalEquinox(year) {
      if (year <= 1979) return 0;
      if (year <= 2099) return Math.floor(20.8431 + 0.242194 * (year - 1980) - Math.floor((year - 1980) / 4));
      return 0;
    }
    function calcAutumnalEquinox(year) {
      if (year <= 1979) return 0;
      if (year <= 2099) return Math.floor(23.2488 + 0.242194 * (year - 1980) - Math.floor((year - 1980) / 4));
      return 0;
    }

    function isHoliday(date) {
      // 土日祝判定（毎年対応）
      const day = date.getDay();
      if (day === 0 || day === 6) return true; // 日曜または土曜
      const year = date.getFullYear();
      const mmdd = `${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
      // 固定祝日
      if (fixedHolidays.includes(mmdd)) return true;
      // 春分の日
      if (date.getMonth() + 1 === 3 && date.getDate() === calcVernalEquinox(year)) return true;
      // 秋分の日
      if (date.getMonth() + 1 === 9 && date.getDate() === calcAutumnalEquinox(year)) return true;
      // 海の日（7月第3月曜）
      if (date.getMonth() + 1 === 7 && date.getDate() === calcHappyMonday(year, 7, 3)) return true;
      // 敬老の日（9月第3月曜）
      if (date.getMonth() + 1 === 9 && date.getDate() === calcHappyMonday(year, 9, 3)) return true;
      // 体育の日（10月第2月曜、2020年以降はスポーツの日で7月に移動）
      if (year <= 2019 && date.getMonth() + 1 === 10 && date.getDate() === calcHappyMonday(year, 10, 2)) return true;
      // スポーツの日（2020年以降、7月第2月曜）
      if (year >= 2020 && date.getMonth() + 1 === 7 && date.getDate() === calcHappyMonday(year, 7, 2)) return true;
      return false;
    }

    // 1番線のデータ取得（2番線と同様、URLのみ変更）
    async function loadTimetable1() {
      const now = new Date();
      // ローカルHTMLファイルから取得
      const targetUrl = isHoliday(now)
        ? 'yamate/1h.html'
        : 'yamate/1.html';
      try {
        const res = await fetch(targetUrl);
        if (!res.ok) throw new Error('ファイル取得失敗');
        const html = await res.text();
        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');
        // 公式HTMLと同じ構造を仮定
        const rows = doc.querySelectorAll('table.result_03 tr');
        const tempTrains = [];
        // legend_dest対応
        let legend_dest = undefined;
        const legendScript = Array.from(doc.querySelectorAll('script')).find(s => s.textContent.includes('var legend_dest'));
        if (legendScript) {
          const legendMatch = legendScript.textContent.match(/var\s+legend_dest\s*=\s*({[\s\S]*?});/);
          if (legendMatch) {
            try {
              eval('legend_dest = ' + legendMatch[1]);
            } catch (e) {
              legend_dest = undefined;
            }
          }
        }
        rows.forEach(tr => {
          const hourTd = tr.querySelector('td');
          const hour = hourTd ? hourTd.textContent.replace('時', '').trim().padStart(2, '0') : '';
          const timesTd = tr.querySelectorAll('td')[1];
          if (!timesTd) return;
          timesTd.querySelectorAll('.timetable_time').forEach(div => {
            const minute = div.querySelector('.minute')?.textContent.trim();
            if (!minute) return;
            const time = `${hour}:${minute.padStart(2, '0')}`;
            let dest = div.getAttribute('data-dest') || '';
            // legend_destによる省略記号変換
            if (typeof legend_dest !== 'undefined' && legend_dest[dest]) {
              dest = legend_dest[dest].text;
            }
            // 快速判定
            let type = '各駅停車';
            const trainType = div.querySelector('.train')?.textContent.trim();
            if (trainType === '') type = '各駅停車';
            else if (trainType === '快') type = '快　速';
            else type = `${trainType}`;
            // 両数判定
            const cars = (dest === '八王子' || dest === '橋本') ? 8 : 10;
            tempTrains.push({ type, time, dest, cars });
          });
        });
        trains1 = tempTrains;
        render();
      } catch (e) {
        trains1 = [];
        render();
      }
    }

    // 2番線のデータ取得（従来通り）
    async function loadTimetable2() {
      const now = new Date();
      // ローカルHTMLファイルから取得
      const targetUrl = isHoliday(now)
        ? 'yamate/2h.html'
        : 'yamate/2.html';
      try {
        const res = await fetch(targetUrl);
        if (!res.ok) throw new Error('ファイル取得失敗');
        const html = await res.text();
        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');
        // 公式HTMLと同じ構造を仮定
        const rows = doc.querySelectorAll('table.result_03 tr');
        const tempTrains = [];
        // legend_dest対応
        let legend_dest = undefined;
        const legendScript = Array.from(doc.querySelectorAll('script')).find(s => s.textContent.includes('var legend_dest'));
        if (legendScript) {
          const legendMatch = legendScript.textContent.match(/var\s+legend_dest\s*=\s*({[\s\S]*?});/);
          if (legendMatch) {
            try {
              eval('legend_dest = ' + legendMatch[1]);
            } catch (e) {
              legend_dest = undefined;
            }
          }
        }
        rows.forEach(tr => {
          const hourTd = tr.querySelector('td');
          const hour = hourTd ? hourTd.textContent.replace('時', '').trim().padStart(2, '0') : '';
          const timesTd = tr.querySelectorAll('td')[1];
          if (!timesTd) return;
          timesTd.querySelectorAll('.timetable_time').forEach(div => {
            const minute = div.querySelector('.minute')?.textContent.trim();
            if (!minute) return;
            const time = `${hour}:${minute.padStart(2, '0')}`;
            let dest = div.getAttribute('data-dest') || '';
            // legend_destによる省略記号変換
            if (typeof legend_dest !== 'undefined' && legend_dest[dest]) {
              dest = legend_dest[dest].text;
            }
            // 快速判定
            let type = '各駅停車';
            const trainType = div.querySelector('.train')?.textContent.trim();
            if (trainType === '') type = '各駅停車';
            else if (trainType === '快') type = '快　速';
            else type = `${trainType}`;
            // 両数判定
            const cars = (dest === '八王子' || dest === '橋本') ? 8 : 10;
            tempTrains.push({ type, time, dest, cars });
          });
        });
        trains2 = tempTrains;
        render();
      } catch (e) {
        trains2 = [];
        render();
      }
    }

    // --- 音声案内機能 1番線 ---
    let lastAnnouncedTime1 = null;
    let audioEnabled = false;
    // ユーザー操作で有効化
    document.getElementById('enable-audio-btn').addEventListener('click', function () {
      audioEnabled = true;
      this.style.display = 'none';
    });

    // 音声連続再生: 各音声ごとに新しいAudioインスタンスを生成し、endedイベントのみで制御
    // --- 音声プリロード機能 ---
    // --- 行先・種別リスト管理 ---
    const destList = ['大船', '磯子', '桜木町', '鶴見', '蒲田', '品川', '上野', '東十条', '赤羽', '南浦和', '大宮', '東神奈川', '八王子', '橋本'];
    // よく使う種別を追加。必要に応じて拡張可能
    const typeList = ['各駅停車', '快速', '通勤快速', '普通'];

    const preloadFiles = [
      'atos/ATOS接近音.mp3',
      'atos/w/まもなく1番線に.mp3',
      'atos/w/まもなく2番線に.mp3',
      'atos/w/危ないですから.mp3',
      'atos/m/まもなく1番線に.mp3',
      'atos/m/まもなく2番線に.mp3',
      'atos/m/危ないですから.mp3'
    ];
    // 行先音声
    destList.forEach(dest => {
      preloadFiles.push(`atos/w/${dest}行がまいります.mp3`);
      preloadFiles.push(`atos/m/${dest}行がまいります.mp3`);
    });
    // 種別音声
    typeList.forEach(type => {
      preloadFiles.push(`atos/w/${type}.mp3`);
      preloadFiles.push(`atos/m/${type}.mp3`);
    });

    const audioCache = {};
    function preloadAudios() {
      preloadFiles.forEach(src => {
        const audio = new Audio(src);
        audio.preload = 'auto';
        audio.load();
        audioCache[src] = audio;
      });
    }
    window.addEventListener('DOMContentLoaded', preloadAudios);

    let audioPlaying = false;


    function playAudioSequence1(train) {
      if (!audioEnabled || audioPlaying) return;
      let typeFile = `atos/w/${train.type}.mp3`.replace(/\s/g, '');
      let destFile = `atos/w/${train.dest}行がまいります.mp3`;
      // どちらか一方でもファイルが無い場合は両方まとめて置き換え
      const typeExists = !!audioCache[typeFile];
      const destExists = !!audioCache[destFile];
      let files;
      if (typeExists && destExists) {
        files = [
          'atos/ATOS接近音.mp3',
          'atos/w/まもなく1番線に.mp3',
          typeFile,
          destFile,
          'atos/w/危ないですから.mp3'
        ];
      } else {
        files = [
          'atos/ATOS接近音.mp3',
          'atos/w/まもなく1番線に.mp3',
          'atos/w/電車がまいります.mp3',
          'atos/w/危ないですから.mp3'
        ];
      }
      let idx = 0;
      audioPlaying = true;
      function playNext() {
        if (idx >= files.length) {
          audioPlaying = false;
          return;
        }
        let audio;
        if (audioCache[files[idx]]) {
          audio = audioCache[files[idx]].cloneNode();
        } else {
          audio = new Audio(files[idx]);
        }
        let advanced = false;
        audio.addEventListener('ended', () => {
          if (!advanced) {
            advanced = true;
            idx++;
            playNext();
          }
        });
        audio.addEventListener('error', () => {
          if (!advanced) {
            advanced = true;
            idx++;
            playNext();
          }
        });
        audio.play().catch(() => {
          if (!advanced) {
            advanced = true;
            idx++;
            playNext();
          }
        });
      }
      playNext();
    }

    function checkAndAnnounce1() {
      if (!trains1 || trains1.length === 0) return;
      const now = getNowDate();
      let nowMinutes = now.getHours() * 60 + now.getMinutes();
      if (now.getHours() < 4) nowMinutes += 1440; // ← 追加
      const nextTrain = trains1.find(t => t.time && (() => {
        const [h, m] = t.time.split(':').map(Number);
        let min = h * 60 + m;
        if (h < 4) min += 1440;
        return min >= nowMinutes;
      })());
      if (!nextTrain || !nextTrain.time) return;
      const [h, m] = nextTrain.time.split(':').map(Number);
      let trainMin = h * 60 + m;
      if (h < 4) trainMin += 1440;
      // 1分前
      if (trainMin - nowMinutes === 1) {
        if (lastAnnouncedTime1 !== nextTrain.time) {
          playAudioSequence1(nextTrain);
          lastAnnouncedTime1 = nextTrain.time;
        }
      } else if (trainMin - nowMinutes > 1) {
        lastAnnouncedTime1 = null;
      }
    }

    // --- 音声案内機能 2番線 ---
    let lastAnnouncedTime2 = null;
    let audioPlaying2 = false;


    function playAudioSequence2(train) {
      if (!audioEnabled || audioPlaying2) return;
      let typeFile = `atos/m/${train.type}.mp3`.replace(/\s/g, '');
      let destFile = `atos/m/${train.dest}行がまいります.mp3`;
      // どちらか一方でもファイルが無い場合は両方まとめて置き換え
      const typeExists = !!audioCache[typeFile];
      const destExists = !!audioCache[destFile];
      let files;
      if (typeExists && destExists) {
        files = [
          'atos/ATOS接近音.mp3',
          'atos/m/まもなく2番線に.mp3',
          typeFile,
          destFile,
          'atos/m/危ないですから.mp3'
        ];
      } else {
        files = [
          'atos/ATOS接近音.mp3',
          'atos/w/まもなく2番線に.mp3',
          'atos/w/電車がまいります.mp3',
          'atos/w/危ないですから.mp3'
        ];
      }
      let idx = 0;
      audioPlaying2 = true;
      function playNext() {
        if (idx >= files.length) {
          audioPlaying2 = false;
          return;
        }
        let audio;
        if (audioCache[files[idx]]) {
          audio = audioCache[files[idx]].cloneNode();
        } else {
          audio = new Audio(files[idx]);
        }
        let advanced = false;
        audio.addEventListener('ended', () => {
          if (!advanced) {
            advanced = true;
            idx++;
            playNext();
          }
        });
        audio.addEventListener('error', () => {
          if (!advanced) {
            advanced = true;
            idx++;
            playNext();
          }
        });
        audio.play().catch(() => {
          if (!advanced) {
            advanced = true;
            idx++;
            playNext();
          }
        });
      }
      playNext();
    }

    function checkAndAnnounce2() {
      if (!trains2 || trains2.length === 0) return;
      const now = getNowDate();
      let nowMinutes = now.getHours() * 60 + now.getMinutes();
      if (now.getHours() < 4) nowMinutes += 1440; // ← 追加
      const nowSeconds = now.getSeconds();
      const nextTrain = trains2.find(t => t.time && (() => {
        const [h, m] = t.time.split(':').map(Number);
        let min = h * 60 + m;
        if (h < 4) min += 1440;
        return min >= nowMinutes;
      })());
      if (!nextTrain || !nextTrain.time) return;
      const [h, m] = nextTrain.time.split(':').map(Number);
      let trainMin = h * 60 + m;
      if (h < 4) trainMin += 1440;
      const trainTimeSec = trainMin * 60;
      const nowTimeSec = nowMinutes * 60 + nowSeconds;
      // 30秒前
      if (trainTimeSec - nowTimeSec <= 30 && trainTimeSec - nowTimeSec > 0) {
        if (lastAnnouncedTime2 !== nextTrain.time) {
          playAudioSequence2(nextTrain);
          lastAnnouncedTime2 = nextTrain.time;
        }
      } else if (trainTimeSec - nowTimeSec > 30) {
        lastAnnouncedTime2 = null;
      }
    }

    // 初回ロード
    loadTimetable1();
    loadTimetable2();
    // 30秒ごとに自動更新
    setInterval(() => {
      loadTimetable1();
      loadTimetable2();
    }, 30000);
    // 画面表示も0.1秒ごとに更新（時刻切替用）
    setInterval(render, 100);
    // 1番線音声案内チェック（0.1秒ごと）
    setInterval(checkAndAnnounce1, 100);
    setInterval(checkAndAnnounce2, 100);
  </script>
</body>
