<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1100,initial-scale=1" />
  <title>横浜駅 発車標</title>
  <style>
    @font-face {
      font-family: "Frutiger";
      src: url("Frutiger.ttf") format("truetype");
    }

    @font-face {
      font-family: "Frutiger-B";
      src: url(Frutiger_bold.ttf) format("truetype");
    }

    @font-face {
      font-family: "ShinGo";
      src: url(AOTFShinGoProMedium.otf) format("opentype");
    }

    :root {
      --bg: #0b0b0b;
      --muted: #9aa3a8;
      --jk-blue: #00bae8;
      --jh-green: #80C342;
      --jo-blue: #007ac0;
      --jt-orange: #f68b1e;
      --js-red: #e21f26;
    }

    body {
      margin: 0;
      font-family: "Frutiger", "ShinGo", sans-serif;
      background: #ffffff;
      display: block;
      padding: 24px;
      color: #fff;
    }

    .atos {
      width: 1000px;
      background: #1a1a1a;
      border-radius: 8px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, .7);
      display: flex;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.03);
      margin: 24px auto;
    }

    .slot-number {
      font-family: "Frutiger-B";
      width: 140px;
      background: #1f1f1f;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .slot-number .num {
      font-size: 160px;
      color: #e8e8e8;
      text-shadow: 0 2px 0 rgba(0, 0, 0, .6);
    }

    .display {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 10px 16px;
      box-sizing: border-box;
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0px 12px;
      background: #2b2b2b;
      border-radius: 4px;
      margin-bottom: 8px;
    }

    .jk-badge {
      font-family: "Frutiger-B";
      width: 40px;
      height: 40px;
      border: var(--jk-blue) 5px solid;
      border-radius: 4px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #0b0b0b;
      font-size: 32px;
    }

    .jh-badge {
      font-family: "Frutiger-B";
      width: 40px;
      height: 40px;
      border: var(--jh-green) 5px solid;
      border-radius: 4px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #0b0b0b;
      font-size: 32px;
      margin-left: 20px;
    }

    .jt-badge {
      font-family: "Frutiger-B";
      width: 40px;
      height: 40px;
      border: var(--jt-orange) 5px solid;
      border-radius: 4px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #0b0b0b;
      font-size: 32px;
      margin-left: 20px;
    }

    .jo-badge {
      font-family: "Frutiger-B";
      width: 40px;
      height: 40px;
      border: var(--jo-blue) 5px solid;
      border-radius: 4px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #0b0b0b;
      font-size: 32px;
      margin-left: 20px;
    }

    .js-badge {
      font-family: "Frutiger-B";
      width: 40px;
      height: 40px;
      border: var(--js-red) 5px solid;
      border-radius: 4px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #0b0b0b;
      font-size: 32px;
      margin-left: 20px;
    }

    .station-badge {
      font-family: "Frutiger-B";
      width: 38px;
      height: 38px;
      aspect-ratio: 1/1;
      border: 5px solid var(--jk-blue);
      border-radius: 4px;
      background: #fff;
      display: flex;
      flex-direction: column;
      /* 縦方向に配置 */
      align-items: center;
      color: #0b0b0b;
      font-size: 12px;
      margin-right: 6px;
      line-height: 100%;
    }

    .station-prefix {
      line-height: 110%;
      font-size: 17px;
      /* 駅ナンバリングの接頭辞のサイズ */
    }

    .station-number {
      font-size: 24px;
      /* 駅ナンバリングの数字のサイズ */
    }

    .line-name {
      color: #ffffff;
      font-size: 20px;
      line-height: 1.2;
    }

    .line-sub {
      color: #fff;
      font-size: 25px;
      line-height: 1.2;
      text-align: right;
    }

    .rows {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .row {
      display: grid;
      grid-template-columns: 200px 220px 1fr;
      align-items: center;
      background: #0c0c0c;
      border-radius: 4px;
      padding: 4px 8px;
      min-height: 80px;
      border-top: #fff 1px solid;
    }

    .type {
      font-size: 28px;
      width: 200px;
      color: #fff;
      text-align: center;
      background-color: #ff0000;
      border-radius: 7px;
      line-height: 100%;
      padding: 6px 0;
      justify-content: center;
    }

    .route-label {
      width: 200px;
      font-size: 20px;
      margin: 0;
      line-height: 130%;
    }

    .time {
      font-size: 73px;
      text-align: center;
    }

    .platform {
      font-size: 52px;
      text-align: left;
      color: #fff;
      display: flex;
      gap: 8px;
      justify-content: flex-start;
      align-items: center;
    }

    .badge-circle {
      width: 38px;
      height: 26px;
      border-radius: 4px;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    .cars-badge {
      color: #fffd94;
      font-size: 55px;
      border-radius: 6px;
      padding: 2px 0px;
      margin-right: 10px;
      display: inline-block;
    }

    .dest-text {
      font-size: 52px;
      line-height: 100%;
      color: #fff;
      display: flex;
      align-items: center;
    }

    td {
      padding: 0;
      margin: 0;
      line-height: 100%;
    }

    tr {
      height: 85px;
    }
  </style>
</head>

<body>
  <!-- 3番線表示 -->
  <div class="atos">
    <div class="slot-number">
      <div class="num">3</div>
    </div>
    <div class="display">
      <div class="topbar">
        <div class="jk-badge"><span>JK</span></div>
        <div>
          <div class="line-name">根岸線</div>
          <div class="line-sub">磯子・大船方面</div>
        </div>
      </div>
      <div class="rows" id="rows1"></div>
    </div>
  </div>
  <!-- 4番線表示（京浜東北線＋横浜線を統合） -->
  <div class="atos">
    <div class="slot-number">
      <div class="num">4</div>
    </div>
    <div class="display">
      <div class="topbar">
        <div class="jk-badge"><span>JK</span></div>
        <div>
          <div class="line-name">京浜東北線・横浜線</div>
          <div class="line-sub">川崎・品川・東京・上野方面</div>
        </div>
        <div class="jh-badge"><span>JH</span></div>
        <div>
          <div class="line-name">横浜線</div>
          <div class="line-sub">新横浜・八王子方面</div>
        </div>
      </div>
      <div class="rows" id="rows2"></div>
    </div>
  </div>
  <div class="atos">
    <div class="slot-number">
      <div class="num" style="transform: scale(0.7,1);letter-spacing: -0.2em;">5·6</div>
    </div>
    <div class="display">
      <div class="topbar">
        <div class="jt-badge" style="margin: 0;"><span>JT</span></div>
        <div>
          <div class="line-name">東海道線</div>
          <div class="line-sub">大船・平塚・国府津・小田原・熱海方面</div>
        </div>
      </div>
      <div class="rows" id="rows5and6"></div>
    </div>
  </div>
  <div class="atos">
    <div class="slot-number">
      <div class="num" style="transform: scale(0.7,1);letter-spacing: -0.2em;">7·8</div>
    </div>
    <div class="display">
      <div class="topbar">
        <div class="jt-badge" style="margin: 0;"><span>JT</span></div>
        <div>
          <div class="line-name">上野東京ライン</div>
          <div class="line-sub">東京・上野・大宮・高崎・宇都宮方面</div>
        </div>
      </div>
      <div class="rows" id="rows7and8"></div>
    </div>
  </div>
  <div class="atos">
    <div class="slot-number">
      <div class="num">9</div>
    </div>
    <div class="display">
      <div class="topbar">
        <div class="jo-badge" style="margin: 0;"><span>JO</span></div>
        <div>
          <div class="line-name">横須賀線</div>
          <div class="line-sub">鎌倉・逗子・久里浜方面</div>
        </div>
        <div class="js-badge"><span>JS</span></div>
        <div>
          <div class="line-name">湘南新宿ライン</div>
          <div class="line-sub">鎌倉・逗子・小田原方面</div>
        </div>
      </div>
      <div class="rows" id="rows9"></div>
    </div>
  </div>
  <div class="atos">
    <div class="slot-number">
      <div class="num" style="transform: scale(0.8,1);">10</div>
    </div>
    <div class="display">
      <div class="topbar">
        <div class="jo-badge" style="margin: 0;"><span>JO</span></div>
        <div>
          <div class="line-name">横須賀線</div>
          <div class="line-sub">品川・東京・千葉方面</div>
        </div>
        <div class="js-badge"><span>JS</span></div>
        <div>
          <div class="line-name">湘南新宿ライン</div>
          <div class="line-sub">渋谷・新宿・池袋方面</div>
        </div>
      </div>
      <div class="rows" id="rows10"></div>
    </div>
  </div>
  <script>
    const stationNumbersJK = {
      '大船': 'JK01', '磯子': 'JK06', '桜木町': 'JK11', '鶴見': 'JK15', '蒲田': 'JK17', '品川': 'JK20', '上野': 'JK30', '東十条': 'JK37', '赤羽': 'JK38', '南浦和': 'JK42', '大宮': 'JK47'
    };
    const stationNumbersJH = {
      '八王子': 'JH32', '橋本': 'JH28'
    };
    const stationNumbersJO = {
      '東京': 'JO19', '品川': 'JO17', '大船': 'JO09', '逗子': 'JO06', '横須賀': 'JO03', '久里浜': 'JO01',
      '津田沼': 'JO26', '千葉': 'JO28', '佐倉': 'JO33', '成田': 'JO35', '成田空港': 'JO37'
    };
    const stationNumbersJT = {
      '東京': 'JT01', '品川': 'JT03', '平塚': 'JT11', '国府津': 'JT14', '小田原': 'JT16', '熱海': 'JT21', '伊東': 'JT26',
      '上野': 'JU02',
    };
    const lineColors = { JK: '#00bae8', JH: '#80C342', JO: 'var(--jo-blue)', JT: 'var(--jt-orange)', JU: 'var(--jt-orange)' };
    const typeColors = { '快速': 'red', '普通': '#383838', '各駅停車': '#383838', '快速アーバン': 'var(--jt-orange)', '快速ラビット': 'var(--jt-orange)', '特別快速': '#00abd6', '特急': 'red', '特急踊り子': 'red' };
    const rowsEl1 = document.getElementById('rows1');
    const rowsEl2 = document.getElementById('rows2');
    const rowsEl5and6 = document.getElementById('rows5and6');
    const rowsEl7and8 = document.getElementById('rows7and8');
    const rowsEl9 = document.getElementById('rows9');
    const rowsEl10 = document.getElementById('rows10');

    let trains1 = [];
    let trains2 = [];
    let trains5and6 = [];
    let trains7and8 = [];
    let trains9 = [];
    let trains9js = [];
    let trains10 = [];
    let trains10js = [];

    function buildTable(data) {
      const table = document.createElement('table');
      table.style.width = '100%';
      table.style.borderCollapse = 'collapse';

      // stationNumbersを引数で受け取る
      const stationNumbers = arguments[1] || {};
      data.forEach(datum => {
        const tr = document.createElement('tr');
        tr.style.background = '#0c0c0c';
        tr.style.borderRadius = '4px';
        tr.style.minHeight = '80px';
        tr.style.borderTop = '#fff 1px solid';

        // 路線名ラベル
        const typeTd = document.createElement('td');
        typeTd.style.textAlign = 'left';
        typeTd.style.width = '120px';
        typeTd.style.verticalAlign = 'center';
        // 路線名分岐（駅ナンバリングのprefixで判定）
        let routeName = '';
        let routeColor = '';
        const stationNumber = stationNumbers[datum.dest];
        if (this && this.rowsTarget === 'rows10') {
          // 10番線だけは行先で分岐
          const jsDests = ['籠原', '高崎', '前橋', '古河', '小金井', '宇都宮'];
          if (jsDests.includes(datum.dest)) {
            routeName = '湘南新宿ライン';
            routeColor = 'var(--js-red)';
          } else {
            routeName = '横須賀線';
            routeColor = 'var(--jo-blue)';
          }
        } else if (stationNumber) {
          const prefix = stationNumber.match(/([A-Za-z]+)/)[1];
          if (prefix === 'JH') {
            routeName = '横浜線';
            routeColor = 'var(--jh-green)';
          } else if (prefix === 'JK') {
            routeName = '京浜東北線';
            routeColor = 'var(--jk-blue)';
          } else if (prefix === 'JO') {
            routeName = '横須賀線';
            routeColor = 'var(--jo-blue)';
          } else if (prefix === 'JT') {
            routeName = '東海道線';
            routeColor = 'var(--jt-orange)';
          } else {
            routeName = '';
            routeColor = '#fff';
          }
        } else {
          routeName = '';
          routeColor = '#fff';
        }

        // 7,8番線用の特別な路線名判定は、buildTableがrowsEl7and8への描画時のみ適用
        if (this && this.rowsTarget === 'rows7and8') {
          const dest = datum.dest || '';
          if (['上野'].includes(dest)) {
            routeName = '上野東京ライン直通';
            routeColor = 'var(--jt-orange)';
          } else if (['籠原', '高崎', '新前橋', '前橋'].includes(dest)) {
            routeName = '高崎線直通';
            routeColor = 'var(--jt-orange)';
          } else if (['古河', '小金井', '宇都宮'].includes(dest)) {
            routeName = '宇都宮線直通';
            routeColor = 'var(--jt-orange)';
          } else if (dest) {
            routeName = '東海道線';
            routeColor = 'var(--jt-orange)';
          }
        }

        const routeLabel = document.createElement('div');
        routeLabel.className = 'route-label';
        routeLabel.textContent = routeName;
        routeLabel.style.color = routeColor;
        routeLabel.style.background = 'none';
        routeLabel.style.marginBottom = '0px';
        routeLabel.style.justifyContent = 'flex-start';
        typeTd.appendChild(routeLabel);
        // 種別（背景色は全角スペース挿入前の元の種別名で判定）
        let rawType = datum.type ? datum.type.replace(/　/g, '') : '';
        let typeBg = typeColors[rawType] || '#0c0c0c';
        // 9,10番線限定で快速はオレンジ色
        if ((this && (this.rowsTarget === 'rows9' || this.rowsTarget === 'rows10')) && rawType === '快速') {
          typeBg = 'var(--jt-orange)';
        }

        const typeDiv = document.createElement('div');
        typeDiv.className = 'type';
        typeDiv.style.backgroundColor = typeBg;
        typeDiv.textContent = datum.type || '\u00A0';
        // 路線名が空なら種別の高さを倍に
        if (!routeName) {
          typeDiv.style.height = '50px';
          typeDiv.style.fontSize = '2.5em';
          typeDiv.style.display = 'flex';
          typeDiv.style.alignItems = 'center';
          typeDiv.style.justifyContent = 'center';
        }
        typeTd.appendChild(typeDiv);

        // 時刻
        const timeTd = document.createElement('td');
        timeTd.style.textAlign = 'center';
        timeTd.style.width = '120px'; // 幅を固定
        timeTd.innerHTML = datum.time ? `<div class="time">${datum.time}</div>` : '<div class="time">&nbsp;</div>';

        // 行先＋駅ナンバリング
        const destTd = document.createElement('td');
        destTd.style.textAlign = 'left';
        destTd.style.paddingLeft = '16px';
        destTd.style.width = '240px'; // 幅を固定
        const destWrap = document.createElement('div');
        destWrap.className = 'dest-text';
        if (datum.dest) {
          // 駅ナンバリング（stationNumbersに存在する場合のみ表示）
          const stationNumber = stationNumbers[datum.dest];
          if (stationNumber) {
            const badge = document.createElement('div');
            badge.className = 'station-badge';
            const [prefix, number] = stationNumber.match(/([A-Za-z]+)(\d+)/).slice(1);
            badge.innerHTML = `<span class="station-prefix">${prefix}</span><span class="station-number">${number}</span>`;
            // 路線ごとの枠線色を適用
            const borderColor = lineColors[prefix] || '#000'; // デフォルト色
            badge.style.border = `5px solid ${borderColor}`;
            destWrap.appendChild(badge);
          }
          const destName = document.createElement('span');
          destName.textContent = datum.dest;
          destWrap.appendChild(destName);
        } else {
          destWrap.innerHTML = '&nbsp;';
        }
        destTd.appendChild(destWrap);

        // 両数バッジ（独立した列）
        const carsTd = document.createElement('td');
        carsTd.style.textAlign = 'right';
        carsTd.style.width = '100px'; // 幅を固定
        if (datum.cars) {
          const carsBadge = document.createElement('span');
          carsBadge.className = 'cars-badge';
          carsBadge.innerHTML = `${datum.cars}<span style="font-size:0.7em;padding-left:5px;">両</span>`;
          carsTd.appendChild(carsBadge);
        } else {
          carsTd.innerHTML = '&nbsp;';
        }

        tr.appendChild(typeTd);
        tr.appendChild(timeTd);
        tr.appendChild(destTd);
        tr.appendChild(carsTd);

        table.appendChild(tr);
      });
      return table;
    }

    function getCurrentTimeStr() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      return `${h}:${m}`;
    }

    function getUpcomingTrains(data, count = 5) {
      const now = new Date();
      const nowMinutes = now.getHours() * 60 + now.getMinutes();
      // 分単位で日付またぎ対応
      const trainsWithMinutes = data.map(d => {
        if (!d.time) return { ...d, minutes: null };
        const [h, m] = d.time.split(':').map(Number);
        let minutes = h * 60 + m;
        // 0時台・1時台は翌日分として+1440分
        if (h === 0 || h === 1) minutes += 1440;
        return { ...d, minutes };
      });
      // 現在時刻が23時以降なら、nowMinutesも+1440分して翌日分扱い
      let compareMinutes = nowMinutes;
      if (now.getHours() >= 23) compareMinutes += 1440;
      // 時刻順にソート
      const sorted = trainsWithMinutes
        .filter(d => d.minutes !== null)
        .sort((a, b) => a.minutes - b.minutes);
      // 現在時刻以降の電車を抽出
      const upcoming = sorted.filter(d => d.minutes >= compareMinutes);
      // 必要数だけ取得
      const result = upcoming.slice(0, count).map(d => ({ type: d.type, time: d.time, dest: d.dest, cars: d.cars }));
      // 足りない場合は空行で埋める
      while (result.length < count) {
        result.push({ type: '', time: '', dest: '', cars: '' });
      }
      return result;
    }

    function render() {
      // 1番線
      rowsEl1.innerHTML = '';
      const trainsToShow1 = getUpcomingTrains(trains1, 2);
      rowsEl1.appendChild(buildTable(trainsToShow1, stationNumbersJK));
      // 4番線（京浜東北線＋横浜線を統合）
      rowsEl2.innerHTML = '';
      // 京浜東北線・横浜線の列車を合成し、時刻順で2本表示
      const mergedTrains = [...trains2, ...trains4_1];
      const trainsToShowMerged = getUpcomingTrains(mergedTrains, 2);
      // JK優先、なければJHのナンバリングを使う関数
      function getJKJHStationNumber(dest) {
        return stationNumbersJK[dest] || stationNumbersJH[dest] || '';
      }
      // buildTableにカスタムstationNumbersを渡す
      rowsEl2.appendChild(buildTable(trainsToShowMerged, { ...stationNumbersJK, ...stationNumbersJH, getJKJHStationNumber }));
      // 5-6番線
      rowsEl5and6.innerHTML = '';
      const trainsToShow5and6 = getUpcomingTrains(trains5and6, 2);
      rowsEl5and6.appendChild(buildTable(trainsToShow5and6, stationNumbersJT));
      // 7-8番線
      rowsEl7and8.innerHTML = '';
      const trainsToShow7and8 = getUpcomingTrains(trains7and8, 2);
      // rows7and8用の特別判定をbuildTableに伝えるためthisArgを利用
      rowsEl7and8.appendChild(buildTable.call({ rowsTarget: 'rows7and8' }, trainsToShow7and8, stationNumbersJT));
      // 9番線
      rowsEl9.innerHTML = '';
      // 横須賀線(JO)＋湘南新宿ライン(JS)を合成し、時刻順で2本表示
      const mergedTrains9 = [...trains9, ...trains9js];
      const trainsToShow9 = getUpcomingTrains(mergedTrains9, 2);
      // JO優先、なければJT(JS)のナンバリングを使う
      rowsEl9.appendChild(buildTable.call({ rowsTarget: 'rows9' }, trainsToShow9, { ...stationNumbersJO, ...stationNumbersJT }));

    // 固定祝日（MM-DD形式）
    const fixedHolidays = [
      '01-01', // 元日
      '02-11', // 建国記念の日
      '02-23', // 天皇誕生日
      '04-29', // 昭和の日
      '05-03', // 憲法記念日
      '05-04', // みどりの日
      '05-05', // こどもの日
      '08-11', // 山の日
      '11-03', // 文化の日
      '11-23', // 勤労感謝の日
    ];

    // 変動祝日計算
    function calcHappyMonday(year, month, nth) {
      // month: 1-12, nth: 第何月曜
      let count = 0;
      for (let d = 1; d <= 31; d++) {
        const date = new Date(year, month - 1, d);
        if (date.getMonth() + 1 !== month) break;
        if (date.getDay() === 1) {
          count++;
          if (count === nth) return d;
        }
      }
      return null;
    }

    // 春分・秋分の日（国立天文台方式、2099年まで対応）
    function calcVernalEquinox(year) {
      if (year <= 1979) return 0;
      if (year <= 2099) return Math.floor(20.8431 + 0.242194 * (year - 1980) - Math.floor((year - 1980) / 4));
      return 0;
    }
    function calcAutumnalEquinox(year) {
      if (year <= 1979) return 0;
      if (year <= 2099) return Math.floor(23.2488 + 0.242194 * (year - 1980) - Math.floor((year - 1980) / 4));
      return 0;
    }

    function isHoliday(date) {
      // 土日祝判定（毎年対応）
      const day = date.getDay();
      if (day === 0 || day === 6) return true; // 日曜または土曜
      const year = date.getFullYear();
      const mmdd = `${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
      // 固定祝日
      if (fixedHolidays.includes(mmdd)) return true;
      // 春分の日
      if (date.getMonth() + 1 === 3 && date.getDate() === calcVernalEquinox(year)) return true;
      // 秋分の日
      if (date.getMonth() + 1 === 9 && date.getDate() === calcAutumnalEquinox(year)) return true;
      // 海の日（7月第3月曜）
      if (date.getMonth() + 1 === 7 && date.getDate() === calcHappyMonday(year, 7, 3)) return true;
      // 敬老の日（9月第3月曜）
      if (date.getMonth() + 1 === 9 && date.getDate() === calcHappyMonday(year, 9, 3)) return true;
      // 体育の日（10月第2月曜、2020年以降はスポーツの日で7月に移動）
      if (year <= 2019 && date.getMonth() + 1 === 10 && date.getDate() === calcHappyMonday(year, 10, 2)) return true;
      // スポーツの日（2020年以降、7月第2月曜）
      if (year >= 2020 && date.getMonth() + 1 === 7 && date.getDate() === calcHappyMonday(year, 7, 2)) return true;
      return false;
    }

              type = legend_train[trainType].text;
