<!doctype html>
<html lang="ja">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1100,initial-scale=1" />
    <title>山手駅 発車標</title>
    <style>
        /* 元のCSSをすべて保持 */
        @font-face {
            font-family: "Frutiger";
            src: url("Frutiger.ttf") format("truetype");
        }

        @font-face {
            font-family: "Frutiger-B";
            src: url(Frutiger_bold.ttf) format("truetype");
        }

        @font-face {
            font-family: "ShinGo";
            src: url(AOTFShinGoProMedium.otf) format("opentype");
        }

        :root {
            --bg: #0b0b0b;
            --muted: #9aa3a8;
            --jk-blue: #00bae8;
            --jh-green: #80C342;
        }

        body {
            margin: 0;
            font-family: "Frutiger", "ShinGo", sans-serif;
            background: #ffffff;
            display: block;
            padding: 24px;
            color: #fff;
        }

        .atos {
            width: 1000px;
            background: #1a1a1a;
            border-radius: 8px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, .7);
            display: flex;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.03);
            margin: 24px auto;
        }

        .slot-number {
            font-family: "Frutiger-B";
            width: 140px;
            background: #1f1f1f;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .slot-number .num {
            font-size: 160px;
            color: #e8e8e8;
            text-shadow: 0 2px 0 rgba(0, 0, 0, .6);
        }

        .display {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 10px 16px;
            box-sizing: border-box;
        }

        .topbar {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0px 12px;
            background: #2b2b2b;
            border-radius: 4px;
            margin-bottom: 8px;
        }

        .jk-badge {
            font-family: "Frutiger-B";
            width: 40px;
            height: 40px;
            border: var(--jk-blue) 5px solid;
            border-radius: 4px;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #0b0b0b;
            font-size: 32px;
        }

        .jh-badge {
            font-family: "Frutiger-B";
            width: 40px;
            height: 40px;
            border: var(--jh-green) 5px solid;
            border-radius: 4px;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #0b0b0b;
            font-size: 32px;
            margin-left: 20px;
        }

        .station-badge {
            font-family: "Frutiger-B";
            width: 30px;
            height: 30px;
            aspect-ratio: 1/1;
            border: 5px solid var(--jk-blue);
            border-radius: 4px;
            background: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #0b0b0b;
            font-size: 16px;
            padding: 2px 4px 4px 4px;
            margin-right: 8px;
            line-height: 100%;
        }

        .station-prefix {
            font-size: 16px;
        }

        .station-number {
            font-size: 23px;
        }

        .line-name {
            color: #ffffff;
            font-size: 20px;
            line-height: 1.2;
        }

        .line-sub {
            color: #fff;
            font-size: 25px;
            line-height: 1.2;
            text-align: right;
        }

        .rows {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .type {
            font-family: "Helvetica", "ShinGo";
            font-size: 28px;
            width: 200px;
            color: #fff;
            text-align: center;
            border-radius: 7px;
            line-height: 100%;
            padding: 6px 0;
            justify-content: center;
            display: flex;
        }

        .route-label {
            font-family: "Helvetica", "ShinGo";
            width: 200px;
            font-size: 20px;
            margin: 0;
            line-height: 130%;
        }

        .time {
            font-size: 75px;
            text-align: right;
            margin-left: 20px;
        }

        .cars-badge {
            color: #fffd94;
            font-size: 55px;
            border-radius: 6px;
            padding: 2px 0px;
            margin-right: 10px;
            display: inline-block;
            width: 105px;
        }

        .dest-text {
            font-family: "Helvetica", "ShinGo";
            font-size: 52px;
            line-height: 100%;
            color: #fff;
            display: flex;
            align-items: center;
            width: 280px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        tr {
            height: 85px;
            border-top: #fff 1px solid;
            background: #0c0c0c;
        }

        td {
            padding: 0;
            margin: 0;
            line-height: 100%;
        }

        .delay-text {
            color: #ff0000;
            font-size: 40px;
            text-align: right;
            width: 201px;
            margin-left: 20px;
        }

        /* Debug panel */
        .debug-panel {
          position: fixed;
          right: 20px;
          top: 80px;
          background: rgba(30,30,30,0.95);
          color: #fff;
          padding: 10px;
          border-radius: 6px;
          font-size: 14px;
          z-index: 2000;
          width: 260px;
        }
        .debug-panel input, .debug-panel select { width: 100%; margin-bottom:6px; box-sizing:border-box; }
        .debug-toggle { position: fixed; right: 20px; top: 70px; z-index:2001; }

        /* 遅延表示用 */
    </style>
</head>

<body>

    <button id="enable-audio-btn" style="position:fixed;top:30px;right:30px;z-index:1000;">ATOS放送</button>

    <button class="debug-toggle" id="debug-toggle">Debug追加</button>
    <div class="debug-panel" id="debug-panel" style="display:none;">
      <label>ホーム</label>
      <select id="debug-platform"><option value="1">1番線</option><option value="2">2番線</option></select>
      <label>発車時刻 (HH:MM)</label>
      <input id="debug-time" type="text" value="00:00" />
      <label>行先</label>

      <label>両数</label>

      <label>列番 (任意)</label>
      <input id="debug-trainno" type="text" placeholder="例: DEBUG1" />
      <button id="debug-add">追加 (表示のみ)</button>
      <div style="margin-top:6px;font-size:12px;color:#ccc;">追加は一時的です。時刻表の再読込で消えます。</div>
    </div>

<script>
    const API_KEY = 'od5dwqe1ja91vjtdq6uij9tfgqhrce8wgzx20jt76z68tswjetzgxtfxqng09vwx';
    let stationNameMap = {};
    let realtimeTrainInfo = {}; // { trainNumber: { delay: sec, cars: num } }
    let trains1 = [];
    let trains2 = [];
    let debugTrains1 = [];
    let debugTrains2 = [];
    let lastAnnouncedTime1 = null;
    let lastAnnouncedTime2 = null;
    let audioEnabled = false;
    let audioPlaying = false;
    let audioPlaying2 = false;
    let showEnglish = false;
    let langTimer = 0;
    let lastDepartedTime1 = null;
    let lastDepartedTime2 = null;

    const stationNumbers = {
      '大船': 'JK01', '磯子': 'JK06', '桜木町': 'JK11', '横浜': 'JK12', '東神奈川': 'JK13', '鶴見': 'JK15', '蒲田': 'JK17', '品川': 'JK20', '上野': 'JK30', '東十条': 'JK37', '赤羽': 'JK38', '南浦和': 'JK42', '大宮': 'JK47',
      '八王子': 'JH32', '橋本': 'JH28', '町田': 'JH23', '中山': 'JH19', '逗子': 'JO06'
    };
    const lineColors = { JK: '#00bae8', JH: '#80C342', JO: '#0055a4' };
    const typeColors = { '快': 'red', '快　速': 'red', '各駅停車': '#383838', '普　通': '#383838', '通勤快速': 'purple', '特別快速': 'green', '特　急': 'red', 'はまかいじ': 'red' };
    const typeEn = { '各駅停車': 'Local', '快　速': 'Rapid', 'アクティー': 'Acty', '通勤快速': 'Commuters Rapid', '特別快速': 'Special Rapid', '普通': 'Local', '特　急': 'Limited Express', 'はまかいじ': 'Hamakaiji' };
    const destEn = { '逗子': 'Zushi', '大船': 'Ōfuna', '磯子': 'Isogo', '桜木町': 'Sakuragichō', '横浜': 'Yokohama', '鶴見': 'Tsurumi', '蒲田': 'Kamata', '品川': 'Shinagawa', '上野': 'Ueno', '赤羽': 'Akabane', '東十条': 'Higashi-Jūjō', '南浦和': 'Minami-Urawa', '大宮': 'Ōmiya', '東神奈川': 'Higashi-Kanagawa', '八王子': 'Hachiōji', '町田': 'Machida', '川越': 'Kawagoe', '橋本': 'Hashimoto', '中山': 'Nakayama' };
    const routeEn = { '京浜東北線': 'Keihin-Tōhoku Line', '横浜線': 'Yokohama Line', '横須賀線': 'Yokosuka Line' };
    const abbrevTypeMap = { '特': '特　急', 'は': 'はまかいじ', '快': '快　速', 'ア': 'アクティー', '通': '通勤快速', '別': '特別快速', '普': '普　通' };
    const abbrevDestMap = { '赤': '赤羽', '大': '大船', '磯': '磯子', '桜': '桜木町', '横': '横浜', '鶴': '鶴見', '蒲': '蒲田', '品': '品川', '東': '東十条', '浦': '南浦和', '宮': '大宮', '神': '東神奈川', '八': '八王子', '町': '町田', '川': '川越', '橋': '橋本', '中': '中山' };

    const audioCache = {};
    const destList = ['大船', '磯子', '桜木町', '横浜', '鶴見', '品川', '赤羽', '南浦和', '大宮', '東神奈川', '八王子', '町田', '河口湖', '逗子'];
    const typeList = ['各駅停車', '快速', '通勤快速', '特別快速', '普通', '特急', 'はまかいじ', 'アクティー'];
    const preloadFiles = [
      'atos/ATOS接近音.mp3', 'atos/w/まもなく1番線に.mp3', 'atos/w/まもなく2番線に.mp3', 'atos/w/危ないですから.mp3',
      'atos/m/まもなく1番線に.mp3', 'atos/m/まもなく2番線に.mp3', 'atos/m/危ないですから.mp3', 'atos/w/電車がまいります.mp3',
      'atos/m/この電車は.mp3', 'atos/m/行の最終です.mp3', 'atos/w/この電車は.mp3', 'atos/w/行の最終です.mp3', 'atos/w/行がまいります.mp3', 'atos/m/行がまいります.mp3',
      'atos/w/8両です.mp3', 'atos/m/8両です.mp3'
    ];
    destList.forEach(dest => {
      preloadFiles.push(`atos/w/${dest}行がまいります.mp3`, `atos/m/${dest}行がまいります.mp3`, `atos/m/${dest}.mp3`, `atos/w/${dest}.mp3`);
    });
    typeList.forEach(type => {
      preloadFiles.push(`atos/w/${type}.mp3`, `atos/m/${type}.mp3`);
    });
    // Preload departure announcement sounds
    preloadFiles.push('atos/sounds/JRE-IKST-007-02.mp3', 'atos/sounds/JRE-IKST-007-01.mp3', 'atos/sounds/w/1.mp3', 'atos/sounds/m/2.mp3');

    function preloadAudios() {
      preloadFiles.forEach(src => {
        const audio = new Audio(src);
        audio.preload = 'auto';
        audioCache[src] = audio;
      });
    }

    async function fetchMaster() {
      const url = `https://api-challenge.odpt.org/api/v4/odpt:Station?odpt:operator=odpt.Operator:JR-East&acl:consumerKey=${API_KEY}`;
      try {
        const res = await fetch(url);
        const data = await res.json();
        data.forEach(s => { stationNameMap[s['owl:sameAs']] = s['dc:title']; });
      } catch (e) {}
    }

    async function fetchRealtime() {
      const urls = [
        `https://api-challenge.odpt.org/api/v4/odpt:Train?odpt:operator=odpt.Operator:JR-East&odpt:railway=odpt.Railway:JR-East.KeihinTohokuNegishi&acl:consumerKey=${API_KEY}`,
        `https://api-challenge.odpt.org/api/v4/odpt:Train?odpt:operator=odpt.Operator:JR-East&odpt:railway=odpt.Railway:JR-East.Yokohama&acl:consumerKey=${API_KEY}`
      ];
      const newInfo = {};
      for (const url of urls) {
        try {
          const res = await fetch(url);
          const data = await res.json();
          data.forEach(t => {
            const tNo = t['odpt:trainNumber'];
            if (tNo) {
              newInfo[tNo] = {
                delay: t['odpt:delay'] || 0,
                cars: t['odpt:carComposition'] || null // 列番検索から取得
              };
            }
          });
        } catch (e) {}
      }
      realtimeTrainInfo = newInfo;
    }

    async function loadTimetables() {
      await fetchRealtime();
      const calendar = isHoliday(new Date()) ? 'odpt.Calendar:SaturdayHoliday' : 'odpt.Calendar:Weekday';
      const url = `https://api-challenge.odpt.org/api/v4/odpt:StationTimetable?odpt:operator=odpt.Operator:JR-East&odpt:station=odpt.Station:JR-East.KeihinTohokuNegishi.Yamate&acl:consumerKey=${API_KEY}`;
      try {
        const res = await fetch(url);
        const data = await res.json();
        const process = (dir) => {
          const entry = data.find(d => d['odpt:railDirection'].includes(dir) && d['odpt:calendar'] === calendar);
          if (!entry) return [];
          return entry['odpt:stationTimetableObject'].map((obj, index) => {
            const tNo = obj['odpt:trainNumber'];
            const info = realtimeTrainInfo[tNo] || { delay: 0, cars: null }; // 検索に引っかからなければnull
            const [h, m] = obj['odpt:departureTime'].split(':').map(Number);
            let baseSec = (h < 4 ? h + 24 : h) * 3600 + m * 60;
            return {
              time: obj['odpt:departureTime'],
              baseSec: baseSec,
              estimatedSec: baseSec + info.delay,
              delay: info.delay,
              dest: stationNameMap[obj['odpt:destinationStation'][0]] || "大宮",
              type: obj['odpt:trainType'].includes('Rapid') ? '快　速' : '各駅停車',
              cars: info.cars, // 列番検索結果をそのまま保持
              trainNo: tNo,
              origOrder: index
            };
          });
        };
        trains1 = process('Southbound');
        trains2 = process('Northbound');
      } catch (e) {}
    }

    function getAutoScaledSpan(text, maxWidth, fontSize, fontFamily, origin = 'left') {
      const span = document.createElement('span');
      span.textContent = text;
      span.style.fontSize = fontSize;
      span.style.fontFamily = fontFamily;
      span.style.whiteSpace = 'nowrap';
      // measure
      const test = document.createElement('span');
      test.style.visibility = 'hidden'; test.style.position = 'absolute'; test.style.whiteSpace = 'nowrap';
      test.style.fontSize = fontSize; test.style.fontFamily = fontFamily;
      test.textContent = text;
      document.body.appendChild(test);
      const width = test.offsetWidth;
      document.body.removeChild(test);
      if (width > maxWidth) {
        const scaleX = maxWidth / width;
        span.style.display = 'inline-block';
        // origin: 'left' -> 'left center', 'center' -> 'center center'
        const o = origin === 'center' ? 'center center' : 'left center';
        span.style.transformOrigin = o;
        span.style.whiteSpace = 'nowrap';
        span.style.transform = `scaleX(${scaleX})`;
      }
      return span;
    }

    function formatTypeForKey(type) {
      if (!type) return type;
      // If 2 characters (e.g. '快速'), insert IDEOGRAPHIC SPACE for key/lookup ('快　速')
      const t = String(type);
      if (t.length === 2 && !t.includes('　')) return `${t[0]}　${t[1]}`;
      return t;
    }

    function formatTypeForDisplay(type) {
      if (!type) return type;
      const t = String(type);
      if (t.length === 2 && !t.includes('　')) return `${t[0]}　${t[1]}`;
      return t;
    }

    // Debug helper: add custom train for testing
    function addDebugTrain(platform, obj) {
      const now = new Date();
      const [h, m] = (obj.time || `${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')}`).split(':').map(Number);
      const baseSec = (h < 4 ? h + 24 : h) * 3600 + (m) * 60;
      const t = {
        time: obj.time,
        baseSec: baseSec,
        estimatedSec: baseSec + (obj.delay || 0),
        delay: obj.delay || 0,
        dest: obj.dest || '大船',
        type: obj.type || '各駅停車',
        alias: obj.alias || null,
        cars: obj.cars || null,
        trainNo: obj.trainNo || `DBG${Math.floor(Math.random()*1000)}`,
        origOrder: 9999,
        __debug: true
      };
      if (platform === 1) debugTrains1.push(t); else debugTrains2.push(t);
      console.log('Debug train added', t);
    }

    function buildTable(data) {
      const table = document.createElement('table');
      data.forEach(datum => {
        const tr = document.createElement('tr');
        // 空行プレースホルダ: time が無ければレイアウトだけ作る
        if (!datum || !datum.time) {
          const td1 = document.createElement('td');
          td1.style.width = '120px';
          td1.innerHTML = '<div class="route-label">&nbsp;</div><div class="type" style="background:transparent">&nbsp;</div>';

          const td2 = document.createElement('td');
          td2.style.textAlign = 'right';
          td2.innerHTML = `<div class="time" style="width:201px;">&nbsp;</div>`;

          const td3 = document.createElement('td');
          td3.style.paddingLeft = '16px';
          const destWrap = document.createElement('div');
          destWrap.className = 'dest-text';
          destWrap.innerHTML = '&nbsp;';
          td3.appendChild(destWrap);

          const td4 = document.createElement('td');
          td4.style.textAlign = 'right';
          td4.style.width = '105px';
          td4.innerHTML = '&nbsp;';

          tr.append(td1, td2, td3, td4);
          table.appendChild(tr);
          return;
        }

        const sn = stationNumbers[datum.dest];
        const prefix = sn ? sn.match(/([A-Za-z]+)/)[1] : 'JK';
        let routeName;
        if (prefix === 'JH') {
          routeName = '横浜線';
        } else if (prefix === 'JK') {
          routeName = '京浜東北線';
        } else {
          routeName = '横須賀線';
        }
        const routeColor = lineColors[prefix] || '#fff';

        const typeTd = document.createElement('td');
        typeTd.style.width = '120px';
        const routeLabel = document.createElement('div');
        routeLabel.className = 'route-label';
        routeLabel.style.color = routeColor;
        routeLabel.textContent = showEnglish ? routeEn[routeName] : routeName;
        typeTd.appendChild(routeLabel);

        const typeDiv = document.createElement('div');
        typeDiv.className = 'type';
        // Display: alternate between official type and alias when both exist
        let displayTypeRaw = datum.type;
        if (datum.alias && datum.alias.length && datum.type && datum.alias !== datum.type) {
          const cycle = langTimer % 180;
          if (showEnglish) {
            // English phases: 120-179 show English labels when available; fall back to original strings
            if (cycle < 60) displayTypeRaw = datum.type;
            else if (cycle < 120) displayTypeRaw = datum.alias;
            else if (cycle < 150) displayTypeRaw = (typeEn[formatTypeForKey(datum.type)] || datum.type);
            else displayTypeRaw = (typeEn[datum.alias] || datum.alias);
          } else {
            displayTypeRaw = (cycle < 60) ? datum.type : datum.alias;
          }
        } else {
          displayTypeRaw = (datum.alias && datum.alias.length) ? datum.alias : datum.type;
        }
        const displayKey = formatTypeForKey(displayTypeRaw);
        typeDiv.style.background = typeColors[displayKey] || typeColors[datum.type] || '#383838';
        if (showEnglish) {
          const english = typeEn[displayKey] || typeEn[datum.type] || displayTypeRaw;
          typeDiv.appendChild(getAutoScaledSpan(english, 190, '28px', '"Helvetica","ShinGo"', 'center'));
        } else {
          typeDiv.textContent = formatTypeForDisplay(displayTypeRaw);
        }
        typeTd.appendChild(typeDiv);

        const timeTd = document.createElement('td');
        timeTd.style.textAlign = 'right';
        const delayMin = Math.floor(datum.delay / 60);
        const cycle = langTimer % 180;
        const shouldShowDelay = (delayMin > 0) && ((cycle >= 60 && cycle < 120) || (cycle >= 150 && cycle < 180));
        if (shouldShowDelay) {
          timeTd.innerHTML =  `<div class="delay-text" style="width:201px;">${delayMin}${showEnglish ? '<span style="font-size:0.9em;">min delay</span>' : '<span style="font-size:0.9em;">分遅れ</span>'}</div>`;
        } else {
          const [h, m] = datum.time.split(':');
          const displayH = Number(h);
          timeTd.innerHTML = `<div class="time" style="width:201px;">${displayH}:${m}</div>`;
        }

        const destTd = document.createElement('td');
        destTd.style.paddingLeft = '16px';
        const destWrap = document.createElement('div');
        destWrap.className = 'dest-text';
        if (sn) {
          const [p, n] = sn.match(/([A-Za-z]+)(\d+)/).slice(1);
          const badge = document.createElement('div');
          badge.className = 'station-badge';
          badge.style.borderColor = lineColors[p];
          badge.innerHTML = `<span class="station-prefix">${p}</span><span class="station-number">${n}</span>`;
          destWrap.appendChild(badge);
        }
        const destName = showEnglish ? (destEn[datum.dest] || datum.dest) : datum.dest;
        const maxWidth = sn ? 225 : 275;
        destWrap.appendChild(getAutoScaledSpan(destName, maxWidth, '52px', '"Helvetica","ShinGo"'));
        destTd.appendChild(destWrap);

        const carsTd = document.createElement('td');
        carsTd.style.textAlign = 'right';
        carsTd.style.width = '105px';
        if (datum.cars) {
          carsTd.innerHTML = `<span class="cars-badge">${datum.cars}<span style="font-size:0.7em;">${showEnglish ? 'cars' : '両'}</span></span>`;
        } else {
          carsTd.innerHTML = '&nbsp;';
        }

        tr.append(typeTd, timeTd, destTd, carsTd);
        table.appendChild(tr);
      });
      return table;
    }

    function render() {
      const now = new Date();
      const nowSec = (now.getHours() < 4 ? now.getHours() + 24 : now.getHours()) * 3600 + now.getMinutes() * 60 + now.getSeconds();
      const getUp = (list) => list.filter(t => t && t.estimatedSec >= (nowSec - 60))
                                  .sort((a, b) => a.estimatedSec - b.estimatedSec || a.origOrder - b.origOrder)
                                  .slice(0, 2);
      const r1 = document.getElementById('rows1'); r1.innerHTML = '';
      const up1 = getUp(trains1.concat(debugTrains1));
      while (up1.length < 2) up1.push({});
      r1.appendChild(buildTable(up1));

      const r2 = document.getElementById('rows2'); r2.innerHTML = '';
      const up2 = getUp(trains2.concat(debugTrains2));
      while (up2.length < 2) up2.push({});
      r2.appendChild(buildTable(up2));
    }

    function playAudioSequence1(train) {
      if (!audioEnabled || audioPlaying) return;
      // Prepare type phrases: play official type and alias consecutively when both exist
      const typePhrases = [];
      if (train.type) typePhrases.push(abbrevTypeMap[train.type] || train.type);
      if (train.alias && train.alias.length && train.alias !== (train.type || '')) typePhrases.push(train.alias);
      let destPhrase = abbrevDestMap[train.dest] || train.dest;
      let files = ['atos/ATOS接近音.mp3', 'atos/w/まもなく1番線に.mp3'];
      // Push available type/alias audio files in order
      typePhrases.forEach(tp => {
        const tFile = `atos/w/${String(tp).replace(/\s+/g, '')}.mp3`;
        if (audioCache[tFile]) files.push(tFile);
        else {
          // fallback: try individual words/parts (remove spaces)
          const tClean = String(tp).replace(/\s+/g, '').replace(/　/g, '');
          const tFile2 = `atos/w/${tClean}.mp3`;
          if (audioCache[tFile2]) files.push(tFile2);
        }
      });
      let dFile = `atos/w/${destPhrase}行がまいります.mp3`;
      if (audioCache[dFile]) files.push(dFile);
      else { files.push(`atos/w/${destPhrase}.mp3`, 'atos/w/行がまいります.mp3'); }
      files.push('atos/w/危ないですから.mp3');
      let isLast = isLastTrainToday(trains1.concat(debugTrains1 || []), train);
      const carsCount = parseInt(String(train.cars || '').replace(/\D/g, ''), 10) || null;
      let idx = 0; audioPlaying = true;
      function playNext() {
        if (idx === files.length) {
          // After approach + "危ないですから": play car-announcement only when car count is known.
          if (carsCount !== null) {
            setTimeout(() => { idx = -200; playNext(); }, 2000);
          } else {
            // If car count is unknown, skip car-announcement. If this is the last train, go to final announcement after 2s; otherwise stop.
            if (isLast) { setTimeout(() => { idx = -100; playNext(); }, 2000); }
            else { audioPlaying = false; }
          }
          return;
        }
        if (idx === -200) {
          const carNum = (carsCount !== null) ? String(carsCount) : String(train.cars || '').replace(/\D/g, '');
          const carFiles = ['atos/w/この電車は.mp3'];
          if (carNum) carFiles.push(`atos/w/${carNum}両です.mp3`);
          let cIdx = 0;
          function playCars() {
            if (cIdx >= carFiles.length) {
              if (isLast) { setTimeout(() => { idx = -100; playNext(); }, 2000); }
              else { audioPlaying = false; }
              return;
            }
            const src = carFiles[cIdx];
            let audio = audioCache[src] ? audioCache[src].cloneNode() : new Audio(src);
            audio.onended = () => { cIdx++; playCars(); };
            audio.play().catch(() => { cIdx++; playCars(); });
          }
          playCars(); return;
        }
        if (idx === -100) {
          let lastFiles = ['atos/w/この電車は.mp3', `atos/w/${destPhrase}.mp3`, 'atos/w/行の最終です.mp3'];
          let lIdx = 0;
          function playLast() {
            if (lIdx >= lastFiles.length) { audioPlaying = false; return; }
            let audio = new Audio(lastFiles[lIdx]);
            audio.onended = () => { lIdx++; playLast(); };
            audio.play();
          }
          playLast(); return;
        }
        if (idx >= files.length) { audioPlaying = false; return; }
        let audio = audioCache[files[idx]] ? audioCache[files[idx]].cloneNode() : new Audio(files[idx]);
        audio.onended = () => { idx++; playNext(); };
        audio.play().catch(() => { idx++; playNext(); });
      }
      playNext();
    }

    function playAudioSequence2(train) {

      // Prepare type phrases: play official type and alias consecutively when both exist
      const typePhrases = [];
      if (train.type) typePhrases.push(abbrevTypeMap[train.type] || train.type);
      if (train.alias && train.alias.length && train.alias !== (train.type || '')) typePhrases.push(train.alias);
      let destPhrase = abbrevDestMap[train.dest] || train.dest;

      typePhrases.forEach(tp => {

        else {
          const tClean = String(tp).replace(/\s+/g, '').replace(/　/g, '');
          const tFile2 = `atos/m/${tClean}.mp3`;
          if (audioCache[tFile2]) files.push(tFile2);
        }
      });
      let dFile = `atos/m/${destPhrase}行がまいります.mp3`;
      if (audioCache[dFile]) files.push(dFile);
      else { files.push(`atos/m/${destPhrase}.mp3`, 'atos/m/行がまいります.mp3'); }
      files.push('atos/m/危ないですから.mp3');
      let isLast = isLastTrainToday(trains2.concat(debugTrains2 || []), train);
      const carsCount = parseInt(String(train.cars || '').replace(/\D/g, ''), 10) || null;
      let idx = 0; audioPlaying2 = true;
      function playNext() {
        if (idx === files.length) {
          if (carsCount !== null) {
            setTimeout(() => { idx = -200; playNext(); }, 2000);
          } else {
            if (isLast) { setTimeout(() => { idx = -100; playNext(); }, 2000); }
            else { audioPlaying2 = false; }
          }
          return;
        }
        if (idx === -200) {
          const carNum = (carsCount !== null) ? String(carsCount) : String(train.cars || '').replace(/\D/g, '');
          const carFiles = ['atos/m/この電車は.mp3'];
          if (carNum) carFiles.push(`atos/m/${carNum}両です.mp3`);
          let cIdx = 0;
          function playCars() {
            if (cIdx >= carFiles.length) {
              if (isLast) { setTimeout(() => { idx = -100; playNext(); }, 2000); }
              else { audioPlaying2 = false; }
              return;
            }
            const src = carFiles[cIdx];
            let audio = audioCache[src] ? audioCache[src].cloneNode() : new Audio(src);
            audio.onended = () => { cIdx++; playCars(); };
            audio.play().catch(() => { cIdx++; playCars(); });
          }
          playCars(); return;
        }
        if (idx === -100) {
          let lastFiles = ['atos/m/この電車は.mp3', `atos/m/${destPhrase}.mp3`, 'atos/m/行の最終です.mp3'];
          let lIdx = 0;
          function playLast() {
            if (lIdx >= lastFiles.length) { audioPlaying2 = false; return; }
            let audio = new Audio(lastFiles[lIdx]);
            audio.onended = () => { lIdx++; playLast(); };
            audio.play();
          }
          playLast(); return;
        }
        if (idx >= files.length) { audioPlaying2 = false; return; }
        let audio = audioCache[files[idx]] ? audioCache[files[idx]].cloneNode() : new Audio(files[idx]);
        audio.onended = () => { idx++; playNext(); };
        audio.play().catch(() => { idx++; playNext(); });
      }
      playNext();
    }

    function checkAndAnnounce1() {
      if (!trains1.length) return;
      const now = new Date();
      const nowSec = (now.getHours() < 4 ? now.getHours() + 24 : now.getHours()) * 3600 + now.getMinutes() * 60 + now.getSeconds();
      const combined1 = trains1.concat(debugTrains1 || []);
      const next = combined1.filter(t => t && t.estimatedSec >= nowSec).sort((a,b)=>a.estimatedSec-b.estimatedSec)[0];
      if (next && next.estimatedSec - nowSec <= 60 && next.estimatedSec - nowSec > 0) {
        if (lastAnnouncedTime1 !== next.time + next.trainNo) {
          playAudioSequence1(next); lastAnnouncedTime1 = next.time + next.trainNo;
        }
      } else if (next && next.estimatedSec - nowSec > 60) { lastAnnouncedTime1 = null; }

      // Departure-time playback (considering delay). Play once when train is at its estimated departure time.
      if (next) {
        const diff = next.estimatedSec - nowSec;
        if (diff <= 0 && diff > -2) {
          const key = next.time + next.trainNo;
          if (lastDepartedTime1 !== key) {
            playDepartureSequence1(next);
            lastDepartedTime1 = key;
          }
        }
      }
    }

    function checkAndAnnounce2() {
      if (!trains2.length) return;
      const now = new Date();
      const nowSec = (now.getHours() < 4 ? now.getHours() + 24 : now.getHours()) * 3600 + now.getMinutes() * 60 + now.getSeconds();
      const combined2 = trains2.concat(debugTrains2 || []);
      const next = combined2.filter(t => t && t.estimatedSec >= nowSec).sort((a,b)=>a.estimatedSec-b.estimatedSec)[0];
      if (next && next.estimatedSec - nowSec <= 30 && next.estimatedSec - nowSec > 0) {
        if (lastAnnouncedTime2 !== next.time + next.trainNo) {
          playAudioSequence2(next); lastAnnouncedTime2 = next.time + next.trainNo;
        }
      } else if (next && next.estimatedSec - nowSec > 30) { lastAnnouncedTime2 = null; }

      // Departure-time playback (considering delay). Play once when train is at its estimated departure time.
      if (next) {
        const diff = next.estimatedSec - nowSec;
        if (diff <= 0 && diff > -2) {
          const key = next.time + next.trainNo;
          if (lastDepartedTime2 !== key) {
            playDepartureSequence2(next);
            lastDepartedTime2 = key;
          }
        }
      }
    }

    // Play additional departure audio for 1番線: JRE file, 2s silence, then atos/sounds/w/1.mp3
    function playDepartureSequence1(train) {
      if (!audioEnabled) return;
      const first = 'atos/sounds/Verde Rayo.mp3';
      const second = 'atos/sounds/w/1.mp3';
      const a1 = audioCache[first] ? audioCache[first].cloneNode() : new Audio(first);
      a1.onended = () => {
        setTimeout(() => {
          const a2 = audioCache[second] ? audioCache[second].cloneNode() : new Audio(second);
          a2.play().catch(() => {});
        }, 1500);
      };
      a1.play().catch(() => {});
    }

    // Play additional departure audio for 2番線: JRE file, 2s silence, then atos/sounds/m/2.mp3
    function playDepartureSequence2(train) {
      if (!audioEnabled) return;
      const first = 'atos/sounds/Water Crown.mp3';
      const second = 'atos/sounds/m/2.mp3';
      const a1 = audioCache[first] ? audioCache[first].cloneNode() : new Audio(first);
      a1.onended = () => {
        setTimeout(() => {
          const a2 = audioCache[second] ? audioCache[second].cloneNode() : new Audio(second);
          a2.play().catch(() => {});
        }, 1200);
      };
      a1.play().catch(() => {});
    }

    function isLastTrainToday(trains, train) {
      if (!train.time || !train.dest) return false;
      const sameDest = trains.filter(t => t.dest === train.dest).map(t => {
        const [h, m] = t.time.split(':').map(Number);
        return { ...t, min: (h < 4 ? h + 24 : h) * 60 + m };
      });
      const max = sameDest.reduce((a, b) => (a.min > b.min ? a : b), { min: 0 });
      return max.time === train.time;
    }

    // Wire up debug panel after load
    function populateDebugOptions() {
      const destSelect = document.getElementById('debug-dest');
      destSelect.innerHTML = '';
      destList.forEach(d => { const o = document.createElement('option'); o.value = d; o.textContent = d; destSelect.appendChild(o); });
      const typeSelect = document.getElementById('debug-type');
      typeSelect.innerHTML = '';
      typeList.forEach(t => { const o = document.createElement('option'); o.value = t; o.textContent = t; typeSelect.appendChild(o); });
      document.getElementById('debug-toggle').onclick = () => {
        const panel = document.getElementById('debug-panel');
        panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
      };
      document.getElementById('debug-add').onclick = () => {
        const platform = Number(document.getElementById('debug-platform').value);
        const time = document.getElementById('debug-time').value;
        const dest = document.getElementById('debug-dest').value;
          const type = document.getElementById('debug-type').value;
          const alias = document.getElementById('debug-alias').value || undefined;
          const cars = document.getElementById('debug-cars').value;
          const trainNo = document.getElementById('debug-trainno').value || undefined;
          addDebugTrain(platform, { time, dest, type, alias, cars, trainNo, delay:0 });
      };
    }

    function isHoliday(d) {
      const day = d.getDay(); if (day === 0 || day === 6) return true;
      const mmdd = `${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      return ['01-01', '02-11', '02-23', '04-29', '05-03', '05-04', '05-05', '08-11', '11-03', '11-23'].includes(mmdd);
    }

    document.getElementById('enable-audio-btn').onclick = function() { audioEnabled = true; this.style.display = 'none'; };
    setInterval(() => { langTimer++; showEnglish = (langTimer % 180 >= 120); }, 100);
    
    window.onload = async () => {
      preloadAudios();
      await fetchMaster();
      await loadTimetables();
      populateDebugOptions();
      setInterval(loadTimetables, 1000);
      setInterval(render, 100);
      setInterval(checkAndAnnounce1, 100);
      setInterval(checkAndAnnounce2, 100);
    };
  </script>
