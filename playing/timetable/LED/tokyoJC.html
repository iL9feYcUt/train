<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1000" />
  <title>ATOS発車標</title>
  <style>
    :root {
      --bg: #171717;
      --panel: #222;
      --panel2: #111;
      --text: #e6e6e6;
      --muted: #a9a9a9;
      --line: #444;
      --green: #00ff15;
      --orange: #ff8400;
      --board: #0b0b0b;
      --board2: #030303;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      font-family: sans-serif;
    }

    :root {
      --bg: #171717;
      --panel: #222;
      --panel2: #111;
      --text: #e6e6e6;
      --muted: #a9a9a9;
      --line: #444;
      --orange: #ff9e33;
      --board: #0b0b0b;
      --board2: #030303;
      --dot-size: 3.7px;
      /* dot cell size: square */
    }

    .titlebar {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .titlebar .left {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    .chip {
      background: #2a2a2a;
      border: 1px solid #3f3f3f;
      border-radius: 8px;
      padding: 8px 10px;
      color: var(--text);
      display: inline-flex;
      gap: 8px;
      align-items: center;
    }

    .chip input {
      width: 10em;
      border: 0;
      outline: none;
      background: transparent;
      color: var(--text);
      font: inherit;
    }

    .grid {
      display: block;
      width: 950px;
      gap: 16px;
      margin: 25px;
    }

    .panel {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 14px 0;
    }

    .board-shell {
      background: linear-gradient(180deg, #2c2c2c 0%, #171717 100%);
      border: 1px solid #4a4a4a;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
      width: 950px;
    }

    canvas {
      width: 100%;
      height: auto;
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background: var(--board);
      border-radius: 10px;
    }

    /* Table-based LED matrix */
    .led-board {
      display: inline-block;
      overflow: hidden;
      background: var(--board);
      margin: 20px 0px 20px 55px;
      /* no extra gap around LED area */
      padding: 0;
    }

    /* grid-based LED matrix: divs for perfect square cells */
    #boardTable.board-grid {
      display: grid;
      grid-template-columns: repeat(208, var(--dot-size));
      /* updated via JS if needed */
      grid-auto-rows: var(--dot-size);
      gap: 0;
    }

    #boardTable .dot {
      width: var(--dot-size);
      height: var(--dot-size);
      padding: 0;
      margin: 0;
      background: var(--board2);
      box-sizing: border-box;
      outline: 1px solid #3a3a3a;
      /* uniform gray grid lines without affecting layout */
    }

    .form {
      display: flex;
      gap: 12px;
    }

    .rowcard {
      background: #1d1d1d;
      border: 1px solid #363636;
      border-radius: 12px;
      padding: 12px;
      display: grid;
      gap: 8px;
    }

    .rowcard h3 {
      margin: 0;
      font-size: 14px;
      color: #d0d0d0;
      font-weight: 600;
    }

    .field {
      display: flex;
      gap: 8px;
      align-items: center;
      font-size: 13px;
    }

    .field label {
      color: var(--muted);
      width: 15%;
    }

    .field input,
    .field textarea {
      width: 100%;
      border-radius: 8px;
      border: 1px solid #404040;
      background: #0f0f0f;
      color: var(--text);
      padding: 8px 10px;
      outline: none;
      font: inherit;
    }

    .field textarea {
      resize: vertical;
      min-height: 64px;
    }

    .note {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    button {
      border: 1px solid #4c4c4c;
      background: #2a2a2a;
      color: var(--text);
      border-radius: 8px;
      padding: 8px 12px;
      cursor: pointer;
      font: inherit;
    }

    button:hover {
      background: #333;
    }

    .warn {
      color: #ffcc66;
      font-size: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="grid">
      <div
        style="background-color: #4a4a4a; display: flex; color: white; line-height: 100%; height: 100px; align-items: center;">
        <p style="font-size: 90px; font-weight: bold; margin: 5px 30px 10px 30px;">2</p>
        <div>
          <p style="font-size: 40px; font-weight: bold;"></p>
          <p></p>
        </div>
      </div>
      <div class="board-shell">
        <div class="led-board" id="ledShell">
          <div id="boardTable" aria-hidden="true" class="board-grid"></div>
        </div>
      </div>

      <div class="panel">
        <div>
          <div class="form">
            <div class="rowcard">
              <h3>時刻表にない列車を追加</h3>
              <div class="field"><label>路線</label><input id="cLine" placeholder="例: 京浜東北線"></div>
              <div class="field"><label>種別</label><input id="cType" placeholder="例: 快速"></div>
              <div class="field"><label>時刻</label><input id="cTime" placeholder="HH:MM"><label style="display:inline-flex;align-items:center;gap:8px;"><input type="checkbox" id="cShowTime" checked></label></div>
              <div class="field"><label>行先</label><input id="cDest" placeholder="例: 東十条"></div>
              <div class="field"><label>両数</label><input id="cCars" placeholder="例: 10両"></div>
              <div style="display:flex;gap:8px;margin-top:8px;align-items:center;">
                <button id="addCustom">列車を追加</button>
                <button id="clearCustom">追加リストをクリア</button>
                <div class="note" style="font-size:12px;">追加された列車は一時的に表示に反映されます（リロードで消えます）。</div>
              </div>
              <div style="margin-top:8px;">
                <div style="color:var(--muted);font-size:13px;margin-bottom:6px;">追加一覧</div>
                <ul id="customList" style="list-style:none;padding-left:0;margin:0;color:var(--text);"></ul>
              </div>
            </div>
          </div>
          <div class="toolbar form">
            <button id="redraw">再描画</button>
            <button id="openEditor" onclick="location.href='editor.html'">font エディタを開く</button>
            <button id="enableSound">サウンドを有効化</button>
            <div class="note" id="status" style="margin-top:10px;">読み込み待ち</div>
          </div>
          <div class="warn" id="fontWarn"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="font.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    let boardTable = $('boardTable');
    let ledShell = $('ledShell');

    const stateFields = [
      'r1Line', 'r1Type', 'r1Time', 'r1Dest', 'r1Cars',
      'r2Line', 'r2Type', 'r2Time', 'r2Dest', 'r2Cars'
    ];

    function getFont() {
      return window.ATOS_FONT || { glyphs: {}, defaults: { w: 16, h: 16 } };
    }

    function glyphMap() {
      const font = getFont();
      return font.glyphs || font.fonts || {};
    }

    function sortedKeys() {
      return Object.keys(glyphMap()).sort((a, b) => b.length - a.length);
    }

    function normalizeGlyph(g) {
      if (!g) return null;
      const w = Number(g.w ?? g.width ?? 16);
      const h = Number(g.h ?? g.height ?? 16);
      const data = Array.isArray(g.data) ? g.data : Array.isArray(g.bitmap) ? g.bitmap : null;
      if (!data || !data.length) return null;
      return { w, h, data };
    }

    function matchGlyph(text, start) {
      const keys = sortedKeys();
      for (const key of keys) {
        if (text.startsWith(key, start)) {
          return { key, glyph: normalizeGlyph(glyphMap()[key]) };
        }
      }
      return null;
    }

    function measureText(text) {
      let x = 0;
      let i = 0;
      while (i < text.length) {
        const found = matchGlyph(text, i);
        if (found && found.glyph) {
          x += found.glyph.w;
          i += found.key.length;
        } else {
          x += 16;
          i += 1;
        }
      }
      return x;
    }

    // TABLE-BASED RENDERER for 208x32 pixels (no gap between dots)
    const MATRIX_W = 208;
    const MATRIX_H = 32;

    // --- Translation pairs (日本語 ↔ English)
    // Edit these arrays to add mappings. Each entry is [jp, en].
    const typePairs = [
      ['普通', 'LOCAL'],
      ['各駅停車', 'LOCAL'],
      ['回送', 'OUT OF SERVICE'],
      ['快速', 'RAPID'],
      ['通勤快速', 'COMMUTER RAPID'],
      ['中央特快', 'CHŪŌ SPECIAL RAPID'],
      ['青梅特快', 'ŌME SPECIAL RAPID'],
      ['特別快速', 'SPECIAL RAPID'],
      ['特急', 'LIMITED EXPRESS']
    ];
    const destPairs = [
      ['大　宮', 'ŌMIYA'],
      ['南浦和', 'MINAMI-URAWA'],
      ['赤　羽', 'AKABANE'],
      ['東十条', 'HIGASHI-JŪJŌ'],
      ['上　野', 'UENO'],
      ['東　京', 'TOKYO'],
      ['田　町', 'TAMACHI'],
      ['品　川', 'SHINAGAWA'],
      ['蒲　田', 'KAMATA'],
      ['鶴　見', 'TSURUMI'],
      ['横　浜', 'YOKOHAMA'],
      ['東神奈川', 'HIGASHI-KANAGAWA'],
      ['桜木町', 'SAKURAGICHŌ'],
      ['磯　子', 'ISOGO'],
      ['大　船', 'ŌFUNA'],
      ['橋　本', 'HASHIMOTO'],
      ['八王子', 'HACHIŌJI'],
      ['立　川', 'TACHIKAWA'],
      ['拝　島', 'HAIJIMA'],
      ['青　梅', 'ŌME'],
      ['高　尾', 'TAKAO']
    ];
    const linePairs = [
      ['京浜東北線', 'KEIHIN-TŌHOKU LINE'],
      ['横浜線', 'YOKOHAMA LINE'],
      ['中央線', 'CHŪŌ LINE'],
      ['青梅線', 'ŌME LINE']
    ];

    const carsPairs = [
      ['10両', '10Cars'],
      ['8両', '8Cars']
    ];

    function translatePair(text, pairs) {
      if (!text) return text;
      for (const p of pairs) {
        if (!p) continue;
        if (!Array.isArray(p) || p.length < 1) continue;
        if (p[0] === text) return p[1];
      }
      return text;
    }

    function translateCars(carsStr) {
      if (!carsStr) return carsStr;
      // exact mapping first
      for (const p of carsPairs) {
        if (!p || !Array.isArray(p)) continue;
        if (p[0] === carsStr) return p[1];
      }
      // fallback: convert numeric 両 -> "N cars"
      const m = String(carsStr).trim().match(/^(\d+)\s*両$/);
      if (m) return `${m[1]}Cars`;
      return carsStr;
    }

    // language cycle: 12s 日本語 -> 6s English -> repeat
    let displayLang = 'ja';
    // regexes derived from legend_train (populated when timetable is loaded)
    let typeRegexSpecial = null;
    let typeRegexRapid = null;
    let typeRegexNormal = null;
    // next departure datetime (set when timetable is loaded)
    let nextDepartureDt = null;
    // custom (manual) entries added via the form
    let customEntries = [];
    // display rows state used when DOM inputs are absent
    let displayRows = [{}, {}];

    function setDisplayRow(idx, obj) {
      displayRows[idx] = Object.assign({}, displayRows[idx] || {}, obj || {});
      // also update DOM inputs if they exist (backwards compatible)
      const map = [['r1Line','r1Type','r1Time','r1Dest','r1Cars'], ['r2Line','r2Type','r2Time','r2Dest','r2Cars']];
      const keys = ['line_jp','type_jp','time','dest_jp','cars_jp'];
      if (map[idx]) {
        for (let i=0;i<map[idx].length;i++) {
          const id = map[idx][i];
          const key = keys[i];
          const el = $(id);
          if (el && typeof displayRows[idx][key] !== 'undefined') el.value = displayRows[idx][key];
        }
      }
    }

    function getRowField(idx, field) {
      // prefer DOM input if present, otherwise use displayRows
      const idMap = {
        line_jp: ['r1Line','r2Line'],
        type_jp: ['r1Type','r2Type'],
        time: ['r1Time','r2Time'],
        dest_jp: ['r1Dest','r2Dest'],
        cars_jp: ['r1Cars','r2Cars']
      };
      const ids = idMap[field];
      if (ids && ids[idx]) {
        const el = $(ids[idx]);
        if (el) return el.value || '';
      }
      return (displayRows[idx] && displayRows[idx][field]) || '';
    }
    function startLangCycle() {
      displayLang = 'ja';
      drawFrame();
      setTimeout(() => {
        displayLang = 'en';
        drawFrame();
        setTimeout(startLangCycle, 6000);
      }, 12000);
    }

    // Load timetable HTML (yamate/2h.html) and populate r1/r2 inputs
    async function loadTimetableFromFile() {
      try {
        // choose file using a day-boundary at 04:00.
        // Treat times from 04:00 (D) through 03:59 (D+1) as the same service day D.
        const nowLocal = new Date();
        // effectiveDate is the calendar date representing the service day.
        const effectiveDate = new Date(nowLocal);
        if (nowLocal.getHours() < 4) {
          // before 4:00 -> still part of previous service day
          effectiveDate.setDate(effectiveDate.getDate() - 1);
        }
        const dow = effectiveDate.getDay(); // 0=Sun,6=Sat based on service day
        const useWeekend = (dow === 0 || dow === 6);
        const filePath = useWeekend ? 'tokyo/1h.html' : 'tokyo/1.html';
        const res = await fetch(filePath);
        if (!res.ok) throw new Error('fetch failed');
        const text = await res.text();
        $('status').textContent = `時刻表読み込み元: ${filePath}`;
        const doc = new DOMParser().parseFromString(text, 'text/html');

        // parse legend_dest and legend_train mappings from source JS
        const destScript = text.match(/var\s+legend_dest\s*=\s*\{[\s\S]*?\};/);
        const trainScript = text.match(/var\s+legend_train\s*=\s*\{[\s\S]*?\};/);
        const destMap = {};
        const trainMap = {};
        if (destScript && destScript[0]) {
          const body = destScript[0];
          const re = /'([^']+)'\s*:\s*\{[^}]*?text\s*:\s*'([^']+)'/g;
          let m;
          while ((m = re.exec(body))) {
            destMap[m[1]] = m[2];
          }
        }
        if (trainScript && trainScript[0]) {
          const body = trainScript[0];
          const re = /'([^']+)'\s*:\s*\{[^}]*?text\s*:\s*'([^']+)'/g;
          let m;
          while ((m = re.exec(body))) {
            trainMap[m[1]] = m[2];
          }
          // normalize: prefer '各駅停車' over '普通'
          for (const k in trainMap) {
            if (trainMap[k] === '普通') trainMap[k] = '各駅停車';
          }
          // build category regexes from parsed legend_train values
          function escapeRegExp(s) { return String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
          const typeValues = Array.from(new Set(Object.values(trainMap).map(v => String(v))));
          const specialList = typeValues.filter(v => v.indexOf('特急') !== -1 || v.indexOf('寝台特急') !== -1 || v.indexOf('踊り子') !== -1);
          const rapidList = typeValues.filter(v => v.indexOf('快速') !== -1 || v.indexOf('特別快速') !== -1 || v.indexOf('通勤快速') !== -1);
          const normalList = typeValues.filter(v => v.indexOf('普通') !== -1 || v.indexOf('各駅停車') !== -1 || v.indexOf('回送') !== -1);
          typeRegexSpecial = specialList.length ? new RegExp(specialList.map(escapeRegExp).join('|')) : null;
          typeRegexRapid = rapidList.length ? new RegExp(rapidList.map(escapeRegExp).join('|')) : null;
          typeRegexNormal = normalList.length ? new RegExp(normalList.map(escapeRegExp).join('|')) : null;
        }

        // collect timetable entries with Date objects
        const rows = Array.from(doc.querySelectorAll('.result_03 tr'));
        const entries = [];
        const now = new Date();
        const cutoff = new Date(now.getTime() - 60 * 1000); // now -1 minute
        rows.forEach(tr => {
          const hourText = (tr.querySelector('td') && tr.querySelector('td').textContent) || '';
          const mh = hourText.match(/(\d{1,2})/);
          const hour = mh ? Number(mh[1]) : null;
          const times = tr.querySelectorAll('.timetable_time');
          times.forEach(t => {
            const minuteEl = t.querySelector('.minute');
            if (!minuteEl) return;
            const minute = minuteEl.textContent.trim();
            const destCode = t.getAttribute('data-dest') || '';
            const destText = destMap[destCode] || destCode || (t.getAttribute('title') || '').trim();
            const trainType = (t.getAttribute('data-train') || '').trim();
            if (hour !== null) {
              // Build datetime relative to the effective service day.
              const dt = new Date(effectiveDate.getFullYear(), effectiveDate.getMonth(), effectiveDate.getDate(), hour, Number(minute));
              // Entries with hour < 4 belong to the next calendar day relative to effectiveDate
              if (hour < 4) dt.setDate(dt.getDate() + 1);
              entries.push({ hour, minute, dest: destText, type: trainType, dt });
            }
          });
        });

        // sort by datetime
        entries.sort((a, b) => a.dt - b.dt);

        // filter out trains before (now -1min)
        let future = entries.filter(e => e.dt.getTime() >= cutoff.getTime());
        // include any custom entries added by the user (keep those >= cutoff)
        if (Array.isArray(customEntries) && customEntries.length) {
          const validCustom = customEntries.filter(c => c.dt && c.dt.getTime() >= cutoff.getTime());
          future = future.concat(validCustom);
          future.sort((a, b) => a.dt - b.dt);
        }

        // take first two upcoming entries
        const pick = future.slice(0, 2);
        // store next departure datetime for special alerts
        nextDepartureDt = pick.length >= 1 ? pick[0].dt : null;
        if (pick.length >= 1) {
          const e = pick[0];
          let dest = (e.dest || '').replace(/\s/g, '');
          // if destination is exactly 2 full-width chars, insert full-width space
          if ((/^[^\x00-\x7F]{2}$/).test(dest)) dest = dest[0] + '　' + dest[1];
          const hasShowTime = (typeof e.showTime === 'undefined') ? true : !!e.showTime;
          const timeStr = hasShowTime ? (e.time ? e.time : (typeof e.hour !== 'undefined' ? `${String(e.hour)}:${String(e.minute).padStart(2, '0')}` : '')) : '';
          // set internal display row 0 (and update DOM if inputs exist)
          // map possibly-composite train codes (e.g. "特快,ホお") to their legend text
          function mapTrainCode(code) {
            if (!code) return '';
            const parts = String(code).split(/[\s,、\/]+/).filter(Boolean);
            const mapped = parts.map(p => {
              return trainMap[p] || p;
            });
            return mapped.join('　'); // join with full-width space
          }
          const trainCode = (e.type || '').trim();
          const typeJp = mapTrainCode(trainCode) || (trainCode ? trainCode : '各駅停車');
          const lineVal = e.line || ((dest.indexOf('青　梅') !== -1 || dest.indexOf('拝島') !== -1) ? '青梅線' : '中央線');
          const carsVal = e.cars || ((lineVal === '横浜線') ? '8両' : '10両');
          setDisplayRow(0, { line_jp: lineVal, type_jp: typeJp, time: timeStr, dest_jp: dest, cars_jp: carsVal });
        }
        if (pick.length >= 2) {
          const e = pick[1];
          let dest = (e.dest || '').replace(/\s/g, '');
          if ((/^[^\x00-\x7F]{2}$/).test(dest)) dest = dest[0] + '　' + dest[1];
          const hasShowTime2 = (typeof e.showTime === 'undefined') ? true : !!e.showTime;
          const timeStr = hasShowTime2 ? (e.time ? e.time : (typeof e.hour !== 'undefined' ? `${String(e.hour)}:${String(e.minute).padStart(2, '0')}` : '')) : '';
          const trainCode2 = (e.type || '').trim();
          const typeJp2 = mapTrainCode(trainCode2) || (trainCode2 ? trainCode2 : '各駅停車');
          const lineVal2 = e.line || ((dest.indexOf('青　梅') !== -1 || dest.indexOf('拝島') !== -1) ? '青梅線' : '中央線');
          const carsVal2 = e.cars || ((lineVal2 === '横浜線') ? '8両' : '10両');
          setDisplayRow(1, { line_jp: lineVal2, type_jp: typeJp2, time: timeStr, dest_jp: dest, cars_jp: carsVal2 });
        }

        $('status').textContent = `時刻表読み込み: ${entries.length} 件`;
        drawFrame();
      } catch (err) {
        console.warn('timetable load failed', err);
        $('status').textContent = '時刻表読み込み失敗';
      }
    }
    // create fast access grid
    let cellGrid = [];

    function createGrid() {
      boardTable = boardTable || $('boardTable');
      if (!boardTable) return;
      boardTable.innerHTML = '';
      // ensure CSS grid columns match MATRIX_W
      boardTable.style.gridTemplateColumns = `repeat(${MATRIX_W}, var(--dot-size))`;
      cellGrid = new Array(MATRIX_H);
      for (let r = 0; r < MATRIX_H; r++) {
        const row = new Array(MATRIX_W);
        for (let c = 0; c < MATRIX_W; c++) {
          const div = document.createElement('div');
          div.className = 'dot';
          div.dataset.r = r;
          div.dataset.c = c;
          boardTable.appendChild(div);
          row[c] = div;
        }
        cellGrid[r] = row;
      }
    }

    function clearGrid() {
      for (let r = 0; r < MATRIX_H; r++) {
        for (let c = 0; c < MATRIX_W; c++) {
          const td = cellGrid[r] && cellGrid[r][c];
          if (td) td.style.background = 'var(--board2)';
        }
      }
    }

    function drawGlyphToGrid(glyph, col, row, color) {
      if (!glyph) return;
      const { w, h, data } = glyph;
      for (let ry = 0; ry < h; ry++) {
        const line = String(data[ry] ?? '').padEnd(w, '0');
        for (let cx = 0; cx < w; cx++) {
          const px = col + cx;
          const py = row + ry;
          if (px < 0 || py < 0 || px >= MATRIX_W || py >= MATRIX_H) continue;
          if (line[cx] === '1') {
            cellGrid[py][px].style.background = color;
          }
        }
      }
    }

    function drawTextToGrid(text, startCol, startRow, color) {
      let col = startCol;
      let i = 0;
      while (i < text.length) {
        const found = matchGlyph(text, i);
        if (found && found.glyph) {
          drawGlyphToGrid(found.glyph, col, startRow, color);
          col += found.glyph.w;
          i += found.key.length;
        } else {
          col += 16; // unknown char advance
          i += 1;
        }
      }
      return col - startCol;
    }

    // Parse time string into special glyph keys per user's scheme.
    // Returns array of keys like ['a1','b2','c0','d5'] or null if cannot parse.
    function timeToGlyphKeys(timeStr) {
      if (typeof timeStr !== 'string') return null;
      const m = timeStr.trim().match(/^(\d{1,2})[:：]?(\d{2})$/);
      if (!m) return null;
      const hour = Number(m[1]);
      const minute = Number(m[2]);
      if (Number.isNaN(hour) || Number.isNaN(minute)) return null;
      // hour tens: a1 / a2 / an (for 0-9)
      const tens = Math.floor(hour / 10);
      let aKey = 'an';
      if (tens === 1) aKey = 'a1';
      else if (tens === 2) aKey = 'a2';
      // hour ones: b0..b9
      const ones = hour % 10;
      const bKey = 'b' + String(ones);
      // minute tens c0..c5 (but allow 0..9)
      const mTens = Math.floor(minute / 10);
      const cKey = 'c' + String(mTens);
      const mOnes = minute % 10;
      const dKey = 'd' + String(mOnes);
      return [aKey, bKey, cKey, dKey];
    }

    // Draw an array of glyph keys to the grid sequentially.
    function drawGlyphKeysToGrid(keys, startCol, startRow, color) {
      let col = startCol;
      for (const key of keys) {
        const g = normalizeGlyph(glyphMap()[key]);
        if (g) {
          drawGlyphToGrid(g, col, startRow, color);
          col += g.w;
        } else {
          col += 16; // fallback advance
        }
      }
      return col - startCol;
    }

    function roundedRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function drawFrame() {
      try {
        // Ensure grid exists
        if (!cellGrid.length) createGrid();
        clearGrid();

        function cssVar(name, fallback) {
          const v = getComputedStyle(document.documentElement).getPropertyValue(name);
          return (v || '').trim() || fallback;
        }
        const textColorOrange = cssVar('--orange', '#ff9f3d');
        const textColorGreen = cssVar('--green', '#1fbf3a');

        const rowSpecs = [
          {
            row: 0, // top line starts at row 0
            line_jp: getRowField(0, 'line_jp'),
            type_jp: getRowField(0, 'type_jp'),
            time: getRowField(0, 'time'),
            dest_jp: getRowField(0, 'dest_jp'),
            cars_jp: getRowField(0, 'cars_jp'),
          },
          {
            row: 16, // bottom line starts at row 16 (no overlap)
            line_jp: getRowField(1, 'line_jp'),
            type_jp: getRowField(1, 'type_jp'),
            time: getRowField(1, 'time'),
            dest_jp: getRowField(1, 'dest_jp'),
            cars_jp: getRowField(1, 'cars_jp'),
          }
        ];

        // column positions (in matrix columns)
        // Allocate exact slots to total 208 columns:
        // line: 3 chars = 48, type: 3 chars = 48, time: 3 chars = 48, dest: 4 chars = 64
        // layout: [line:0-47][type:48-95][time:96-143][dest:144-207]
        const xLine = 0;
        const xType = 48;
        const xTime = 96;
        const xDest = 144;

        // helper to choose color based on `種別`
        function typeToColor(typeStr) {
          const t = String(typeStr || '');
          // prefer CSS vars with sensible fallbacks
          const cRed = cssVar('--red', '#fc0000');
          const cOrange = cssVar('--orange', '#ff9e33');
          const cGreen = cssVar('--green', '#1fbf3a');
          // use regexes derived from legend_train when available
          const transitPhrases = /電車がまいります|電車が通過します|列車がまいります|列車が通過します/;
          if ((typeRegexSpecial && typeRegexSpecial.test(t)) || transitPhrases.test(t)) return cRed;
          if (typeRegexRapid && typeRegexRapid.test(t)) return cOrange;
          if (typeRegexNormal && typeRegexNormal.test(t)) return cGreen;
          // fallback
          return cGreen;
        }

        rowSpecs.forEach(row => {
          // check special alert window: 90s -> 45s before next departure
          const nowMs = Date.now();
          let specialAlert = false;
          if (nextDepartureDt instanceof Date) {
            const diffSec = (nextDepartureDt.getTime() - nowMs) / 1000;
            if (diffSec <= 90 && diffSec >= 45) specialAlert = true;
          }
          // blink pattern: 1s on, 0.5s off
          const blinkVisible = (Date.now() % 1500) < 1000;
          // always use Japanese name for color/ classification
          const typeColor = typeToColor(row.type_jp);
          // translate display strings according to displayLang (except type uses its own cycle)
          const dispLine = (displayLang === 'ja') ? row.line_jp : translatePair(row.line_jp, linePairs);
          // type column cycles specially when it contains two parts (e.g. "特急　かいじ"): 
          // sequence: 特急 (6s) -> かいじ (6s) -> LIMITED EXPRESS (3s) -> KAIJI (3s)
          function getTypeCycleText(typeJp) {
            const raw = String(typeJp || '').trim();
            if (!raw) return '';
            const parts = raw.split(/[\s　,、\/・]+/).filter(Boolean);
            if (parts.length >= 2) {
              const enParts = parts.map(p => translatePair(p, typePairs));
              const phase = Date.now() % 18000; // 18s cycle
              if (phase < 6000) return parts[0];
              if (phase < 12000) return parts[1];
              if (phase < 15000) return enParts[0] || parts[0];
              return enParts[1] || parts[1] || parts[0];
            }
            // fallback: respect global displayLang for single-part types
            return (displayLang === 'ja') ? raw : translatePair(raw, typePairs);
          }
          const dispType = getTypeCycleText(row.type_jp);
          // If this is second row and special alert active, override display
          if (row.row === 16 && specialAlert) {
            if (blinkVisible) {
              const cRed = cssVar('--red', '#fc0000');
              drawTextToGrid('電車がまいります', xLine, row.row, cRed);
            }
            return; // skip normal rendering for this row
          }
          // draw route (路線) then type
          drawTextToGrid(dispLine || '', xLine, row.row, textColorOrange);
          // determine rendered width for `dispType` using font glyphs
          const typeWidth = measureText(dispType || '');
          // if wide enough (>=48) place at xType; if small (<=32) and Japanese, offset by 8 cols
          if (typeWidth >= 48) {
            drawTextToGrid(dispType, xType, row.row, typeColor);
          } else if (typeWidth > 0 && typeWidth <= 32) {
            drawTextToGrid(dispType, xType + 8, row.row, typeColor);
          } else {
            // fallback: draw at standard xType
            drawTextToGrid(dispType, xType, row.row, typeColor);
          }
          // special time rendering: try to build keys a/b/c/d per spec, otherwise fallback
          const timeKeys = timeToGlyphKeys(String(row.time || ''));
          if (timeKeys) {
            drawGlyphKeysToGrid(timeKeys, xTime, row.row, textColorGreen);
          } else {
            drawTextToGrid(row.time, xTime, row.row, textColorGreen);
          }
          // 行先表示（4文字分の領域: 64 cols）
          const destJp = String(row.dest_jp || '');
          // full-width 1〜3文字の場合は左8列空けて表示（日本語のみ）
          const isZenkakuShort = (/^[^\x00-\x7F]{1,3}$/).test(destJp);
          const dispDest = (displayLang === 'ja') ? destJp : translatePair(destJp, destPairs);
          const destStart = (displayLang === 'ja' && isZenkakuShort) ? (xDest + 8) : xDest;
          drawTextToGrid(dispDest, destStart, row.row, textColorOrange);
        });

        const count = Object.keys(glyphMap()).length;
        $('status').textContent = `font.js 読み込み: ${count} 字形`;
        $('fontWarn').textContent = count ? '' : 'font.js に字形がありません。editor.html で作成してから再読み込みしてください。';
      } catch (err) {
        console.error(err);
        $('status').textContent = '描画エラー: ' + (err && err.message);
      }
    }

    // save/load removed per request

    function bind() {
      [...stateFields].forEach(id => {
        const el = $(id);
        if (el) el.addEventListener('input', drawFrame);
      });
      const btnRedraw = $('redraw'); if (btnRedraw) btnRedraw.addEventListener('click', drawFrame);
      const btnAdd = $('addCustom'); if (btnAdd) btnAdd.addEventListener('click', () => { addCustomTrain(); });
      const btnClear = $('clearCustom'); if (btnClear) btnClear.addEventListener('click', () => { customEntries = []; refreshCustomList(); drawFrame(); });
      const btnEnable = $('enableSound'); if (btnEnable) btnEnable.addEventListener('click', () => { unlockAudio(); });
      window.addEventListener('resize', drawFrame);
    }

    function refreshCustomList() {
      const ul = $('customList');
      if (!ul) return;
      ul.innerHTML = '';
      customEntries.forEach((c, i) => {
        const li = document.createElement('li');
        const t = c.dt instanceof Date ? `${String(c.dt.getHours()).padStart(2,'0')}:${String(c.dt.getMinutes()).padStart(2,'0')}` : c.time || '';
        const show = (typeof c.showTime === 'undefined' || c.showTime) ? '表示' : '非表示';
        li.textContent = `${t} ${c.line||''} ${c.type||''} → ${c.dest||''} ${c.cars||''} （時刻: ${show}）`;
        li.style.padding = '2px 0';
        ul.appendChild(li);
      });
    }

    function parseTimeToDt(timeStr) {
      const nowLocal = new Date();
      const effectiveDate = new Date(nowLocal);
      if (nowLocal.getHours() < 4) effectiveDate.setDate(effectiveDate.getDate() - 1);
      const m = String(timeStr||'').trim().match(/^(\d{1,2})[:：]?(\d{2})$/);
      if (!m) return null;
      const hour = Number(m[1]);
      const minute = Number(m[2]);
      const dt = new Date(effectiveDate.getFullYear(), effectiveDate.getMonth(), effectiveDate.getDate(), hour, minute);
      if (hour < 4) dt.setDate(dt.getDate() + 1);
      return dt;
    }

    function addCustomTrain() {
      const line = ($('cLine')||{}).value || '';
      const type = ($('cType')||{}).value || '';
      const time = ($('cTime')||{}).value || '';
      const dest = ($('cDest')||{}).value || '';
      const cars = ($('cCars')||{}).value || '';
      const showTime = !!(($('cShowTime')||{}).checked);
      const dt = parseTimeToDt(time);
      if (!dt) { alert('時刻は HH:MM の形式で入力してください'); return; }
      // normalize to timetable entry shape: include hour/minute and preserve original line/cars
      const hour = dt.getHours();
      const minute = dt.getMinutes();
      customEntries.push({ hour, minute, dest, type, dt, time, line, cars, showTime });
      customEntries.sort((a,b)=>a.dt-b.dt);
      refreshCustomList();
      // reload timetable merge
      loadTimetableFromFile().then(()=>{ drawFrame(); });
    }

    bind();
    // load timetable from local copy and then draw
    loadTimetableFromFile().then(() => { drawFrame(); });
    startLangCycle();
    // ensure drawFrame is called frequently so blinking works (every 100ms)
    setInterval(drawFrame, 100);
    // periodically refresh timetable so display updates automatically
    // (refresh every second)
    const TIMETABLE_REFRESH_MS = 1000;
    setInterval(() => {
      loadTimetableFromFile().then(() => { drawFrame(); }).catch(() => { /* ignore load errors */ });
    }, TIMETABLE_REFRESH_MS);

    // --- audio alert for departure (start at T-20s)
    const soundMain = new Audio('../atos/sounds/JRE-IKST-016-01.mp3');
    soundMain.preload = 'auto';
    const soundAfter = new Audio('../atos/sounds/w/2.mp3');
    soundAfter.preload = 'auto';

    let playingAlertForDt = null; // Date value for which alert is currently/was played
    const playedAlertTimes = new Set(); // ms timestamps of departures already played
    let audioUnlocked = false;

    function chooseMultiplier() {
      const r = Math.random();
      if (r < 0.6) return 0.9;
      if (r < 0.8) return 1.0;
      if (r < 0.9) return (Math.random() * (0.6 - 0.1) + 0.1); // 0.1..0.6
      return (Math.random() * (2.1 - 1.1) + 1.1); // 1.1..2.1
    }

    function ensureMainDuration() {
      return new Promise((resolve) => {
        if (soundMain.duration && !isNaN(soundMain.duration) && soundMain.duration > 0) {
          resolve(soundMain.duration);
        } else {
          const onLoaded = () => {
            soundMain.removeEventListener('loadedmetadata', onLoaded);
            resolve(soundMain.duration || 0);
          };
          soundMain.addEventListener('loadedmetadata', onLoaded);
          // trigger load
          try { soundMain.load(); } catch (_) { }
        }
      });
    }

    async function triggerPlaySequence(targetDt) {
      try {
        // mark as playing for this targetDt to avoid duplication
        const tMs = targetDt.getTime();
        if (playedAlertTimes.has(tMs)) return; // already played
        playingAlertForDt = tMs;
        playedAlertTimes.add(tMs);
        const baseDur = await ensureMainDuration();
        if (!baseDur || baseDur <= 0) {
          console.warn('main sound has no duration, aborting alert');
          playingAlertForDt = null;
          return;
        }
        const mult = chooseMultiplier();
        const targetMs = mult * baseDur * 1000;
        console.log('alert: multiplier=', mult.toFixed(3), 'targetMs=', targetMs);

        // play main sound. If mult > 1 -> loop until targetMs elapsed
        soundMain.loop = mult > 1.0;
        soundMain.currentTime = 0;
        await soundMain.play().catch(e => { console.warn('play failed', e); });

        // stop after targetMs
          setTimeout(async () => {
          try {
            soundMain.loop = false;
            soundMain.pause();
            soundMain.currentTime = 0;
          } catch (e) { }
          // wait 2 seconds then play after-sound fully
          setTimeout(async () => {
            try {
              soundAfter.currentTime = 0;
              await soundAfter.play().catch(e => { console.warn('after play failed', e); });
            } catch (e) { }
            // clear playing flag after after-sound ends
            const clearPlaying = () => { playingAlertForDt = null; soundAfter.removeEventListener('ended', clearPlaying); };
            soundAfter.addEventListener('ended', clearPlaying);
          }, 1500);
        }, Math.max(0, Math.floor(targetMs)));
      } catch (err) {
        console.error('triggerPlaySequence error', err);
        playingAlertForDt = null;
      }
    }

    function scheduleDepartureAlert() {
      if (!(nextDepartureDt instanceof Date)) return;
      const now = Date.now();
      const diff = (nextDepartureDt.getTime() - now) / 1000; // seconds
      // trigger when entering <=20s window and not already triggered for this departure
      const tMs = nextDepartureDt.getTime();
      if (diff <= 20 && diff > 0) {
        if (playingAlertForDt !== tMs && !playedAlertTimes.has(tMs)) {
          if (audioUnlocked) {
            triggerPlaySequence(nextDepartureDt);
          } else {
            const st = $('status'); if (st) st.textContent = 'サウンド無効: 画面をクリックしてサウンドを有効化してください';
            console.warn('audio locked by browser policy; user interaction required');
          }
        }
      }
    }

    // cleanup old played entries periodically (remove entries older than 5 minutes)
    setInterval(() => {
      const cutoff = Date.now() - 5 * 60 * 1000;
      for (const t of Array.from(playedAlertTimes)) {
        if (t < cutoff) playedAlertTimes.delete(t);
      }
    }, 60 * 1000);

    // check frequently for scheduling alert
    setInterval(scheduleDepartureAlert, 200);

    // attempt to unlock audio on first user interaction (one-time)
    async function unlockAudio() {
      if (audioUnlocked) return;
      try {
        // try a short play/pause to satisfy autoplay policies
        await soundMain.play().catch(()=>{});
        soundMain.pause(); soundMain.currentTime = 0;
        await soundAfter.play().catch(()=>{});
        soundAfter.pause(); soundAfter.currentTime = 0;
        audioUnlocked = true;
        const st = $('status'); if (st) st.textContent = 'サウンド有効';
        console.log('audio unlocked');
      } catch (e) {
        console.warn('unlock failed', e);
        const st = $('status'); if (st) st.textContent = 'サウンドを有効にしてください（クリック）';
      }
    }

    const oneClickUnlock = () => { unlockAudio(); document.removeEventListener('click', oneClickUnlock); };
    document.addEventListener('click', oneClickUnlock);
  </script>
