<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1100,initial-scale=1" />
  <title>横浜駅5~8番線 発車標</title>
  <style>
    @font-face {
      font-family: "Frutiger";
      src: url("Frutiger.ttf") format("truetype");
    }

    @font-face {
      font-family: "Frutiger-B";
      src: url(Frutiger_bold.ttf) format("truetype");
    }

    @font-face {
      font-family: "ShinGo";
      src: url(AOTFShinGoProMedium.otf) format("opentype");
    }

    :root {
      --bg: #0b0b0b;
      --muted: #9aa3a8;
      --jt-orange: #f68b1e;
    }

    body {
      margin: 0;
      font-family: "Frutiger", "ShinGo", sans-serif;
      background: #ffffff;
      display: block;
      padding: 24px;
      color: #fff;
    }

    .atos {
      width: 1000px;
      background: #1a1a1a;
      border-radius: 8px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, .7);
      display: flex;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.03);
      margin: 24px auto;
    }

    .slot-number {
      font-family: "Frutiger-B";
      width: 140px;
      background: #1f1f1f;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .slot-number .num {
      font-size: 160px;
      color: #e8e8e8;
      text-shadow: 0 2px 0 rgba(0, 0, 0, .6);
    }

    .display {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 10px 16px;
      box-sizing: border-box;
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0px 12px;
      background: #2b2b2b;
      border-radius: 4px;
      margin-bottom: 8px;
    }

    .jt-badge {
      font-family: "Frutiger-B";
      width: 40px;
      height: 40px;
      border: var(--jt-orange) 5px solid;
      border-radius: 4px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #0b0b0b;
      font-size: 32px;
    }

    .jh-badge {
      font-family: "Frutiger-B";
      width: 40px;
      height: 40px;
      border: var(--jh-green) 5px solid;
      border-radius: 4px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #0b0b0b;
      font-size: 32px;
      margin-left: 20px;
    }

    .station-badge {
      font-family: "Frutiger-B";
      width: 30px;
      height: 30px;
      aspect-ratio: 1/1;
      border: 5px solid var(--jt-orange);
      border-radius: 4px;
      background: #fff;
      display: flex;
      flex-direction: column;
      /* 縦方向に配置 */
      align-items: center;
      justify-content: center;
      color: #0b0b0b;
      font-size: 16px;
      padding: 2px 4px 4px 4px;
      margin-right: 8px;
      line-height: 100%;
    }

    .station-prefix {
      font-size: 16px;
      /* 駅ナンバリングの接頭辞のサイズ */
    }

    .station-number {
      font-size: 23px;
      /* 駅ナンバリングの数字のサイズ */
    }

    .line-name {
      color: #ffffff;
      font-size: 20px;
      line-height: 1.2;
    }

    .line-sub {
      color: #fff;
      font-size: 25px;
      line-height: 1.2;
      text-align: right;
    }

    .rows {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .row {
      display: grid;
      grid-template-columns: 200px 220px 1fr;
      align-items: center;
      background: #0c0c0c;
      border-radius: 4px;
      padding: 4px 8px;
      min-height: 80px;
      border-top: #fff 1px solid;
    }

    .type {
      font-family: "Helvetica", "ShinGo";
      font-size: 28px;
      width: 200px;
      color: #fff;
      text-align: center;
      background-color: #ff0000;
      border-radius: 7px;
      line-height: 100%;
      padding: 6px 0;
      justify-content: center;
      display: flex;
    }

    .route-label {
      font-family: "Helvetica", "ShinGo";
      width: 200px;
      font-size: 20px;
      margin: 0;
      line-height: 130%;
    }

    .time {
      font-size: 75px;
      text-align: right;
    }

    .delay-text {
      color: #ff0000;
      font-size: 40px;
      text-align: right;
      width: 190px;
      margin-left: 0px;
    }

    .platform {
      font-size: 52px;
      text-align: left;
      color: #fff;
      display: flex;
      gap: 8px;
      justify-content: flex-start;
      align-items: center;
    }

    .badge-circle {
      width: 38px;
      height: 26px;
      border-radius: 4px;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    .cars-badge {
      color: #fffd94;
      font-size: 55px;
      border-radius: 6px;
      padding: 2px 0px;
      margin-right: 10px;
      display: inline-block;
      width: 105px;
    }

    .dest-text {
      font-family: "Helvetica", "ShinGo";
      font-size: 52px;
      line-height: 100%;
      color: #fff;
      display: flex;
      align-items: center;
      width: 280px;
    }

    .dest-text .sx-shrink {
      display: inline-block;
      transform-origin: left center;
      vertical-align: middle;
      white-space: nowrap;
    }

    td {
      padding: 0;
      margin: 0;
      line-height: 100%;
    }

    tr {
      height: 85px;
    }
  </style>
</head>

<body>
  <!-- 1番線表示 -->
  <div class="atos">
    <div class="slot-number">
      <div class="num">6</div>
    </div>
    <div class="display">
      <div class="topbar">
        <div class="jt-badge"><span>JT</span></div>
        <div>
          <div class="line-name">東海道線</div>
          <div class="line-sub">大船・平塚・国府津・小田原・熱海方面</div>
        </div>
      </div>
      <div class="rows" id="rows1"></div>
    </div>
  </div>
  <!-- 2番線表示 -->
  <div class="atos">
    <div class="slot-number">
      <div class="num">7</div>
    </div>
    <div class="display">
      <div class="topbar">
        <div class="jt-badge"><span>JT</span></div>
        <div>
          <div class="line-name">上野東京ライン</div>
          <div class="line-sub">東京・上野・大宮・高崎・宇都宮方面</div>
        </div>
      </div>
      <div class="rows" id="rows2"></div>
    </div>
  </div>
  <button id="enable-audio-btn"
    style="position:fixed;top:30px;right:30px;z-index:1000;font-size:15px;padding:6px 12px;">ATOS放送</button>
  <button id="debug-toggle" type="button" aria-controls="debug-panel" aria-expanded="false"
    style="position:fixed;right:30px;bottom:30px;z-index:1000;padding:6px 10px;">Debug</button>
  <section id="debug-panel" hidden aria-label="Debug controls"
    style="position:fixed;right:30px;bottom:72px;z-index:1000;width:280px;padding:12px;background:#fff;color:#111;border:1px solid #555;font:14px sans-serif;">
    <div style="display:grid;gap:8px;">
      <label>番線 <select id="debug-direction"><option value="1">6番線</option><option value="2">7番線</option></select></label>
      <label>発車時刻 <input id="debug-departure" type="time" required></label>
      <label>種別 <input id="debug-type" value="&#26222;&#36890;" required></label>
      <label>行先 <input id="debug-destination" value="&#26481;&#20140;" required></label>
      <label>両数 <input id="debug-cars" type="number" min="1" max="20" value="10"></label>
      <button id="debug-add-train" type="button">テスト列車を追加</button>
      <button id="debug-play-announcement" type="button">放送を試聴</button>
      <button id="debug-clear-trains" type="button">テスト列車を削除</button>
    </div>
  </section>
  <script>
    let debugTime = null; // 例: "23:58" など。nullなら通常の現在時刻
    function getNowDate() {
      return new Date();
    }

    const stationNumbers = {
      '東京': 'JT01', '上野': 'JU02', '東京': 'JT01', '品川': 'JT03', '平塚': 'JT11', '国府津': 'JT14', '小田原': 'JT16', '熱海': 'JT21', '伊東': 'JT26'
    };
    const lineColors = { JT: '--jt-orange', JU: '--jt-orange', JO: '#0055a4' };
    const typeColors = { '快': 'red', '快　速': '#ff9900', '各駅停車': '#383838', '普　通': '#383838', 'アクティー': '#ff9900', 'アーバン': '#ff9900', 'ラビット': '#ff9900', '通勤快速': 'purple', '特別快速': 'green', '特　急': 'red', '寝台特急': 'red', '踊り子': 'red', 'サフィール踊り子': 'red', 'サンライズ出雲': 'red', 'サンライズ瀬戸': 'red' };
    const rowsEl1 = document.getElementById('rows1');
    const rowsEl2 = document.getElementById('rows2');
    let trains1 = [];
    let trains2 = [];
    const debugTrains1 = [];
    const debugTrains2 = [];
    const realtimeTrainInfo = new Map();

    const debugPanel = document.getElementById('debug-panel');
    const debugToggle = document.getElementById('debug-toggle');
    debugToggle.addEventListener('click', () => {
      const isOpen = !debugPanel.hidden;
      debugPanel.hidden = isOpen;
      debugToggle.setAttribute('aria-expanded', String(!isOpen));
    });
    document.getElementById('debug-add-train').addEventListener('click', () => {
      const time = document.getElementById('debug-departure').value;
      const type = document.getElementById('debug-type').value.trim();
      const dest = document.getElementById('debug-destination').value.trim();
      const cars = Number(document.getElementById('debug-cars').value);
      const direction = document.getElementById('debug-direction').value;
      if (!time || !type || !dest || !Number.isFinite(cars)) return;
      const train = { type, time, dest, cars, delay: 0, isDebug: true };
      (direction === '1' ? debugTrains1 : debugTrains2).push(train);
      render();
    });
    document.getElementById('debug-play-announcement').addEventListener('click', () => {
      const time = document.getElementById('debug-departure').value || getCurrentTimeStr();
      const type = document.getElementById('debug-type').value.trim();
      const dest = document.getElementById('debug-destination').value.trim();
      const cars = Number(document.getElementById('debug-cars').value);
      const direction = document.getElementById('debug-direction').value;
      if (!type || !dest || !Number.isFinite(cars)) return;
      audioEnabled = true;
      unlockAudioPlayback();
      document.getElementById('enable-audio-btn').style.display = 'none';
      const train = { type, time, dest, cars, delay: 0, isDebug: true };
      if (direction === '1') {
        playAudioSequence1(train);
      } else {
        playAudioSequence2(train);
      }
    });
    document.getElementById('debug-clear-trains').addEventListener('click', () => {
      debugTrains1.length = 0;
      debugTrains2.length = 0;
      lastAnnouncedTime1 = null;
      lastAnnouncedTime2 = null;
      render();
    });

    const odptConsumerKey = 'dys5jrrro1p7kk9096v1sg6ej43xfpghhqtag9dspl3lhxlyhu11y5y12ogoov9w';
    const odptApiBase = 'https://api-challenge.odpt.org/api/v4';
    const stationTimetableUrl = `${odptApiBase}/odpt:StationTimetable?odpt:operator=odpt.Operator:JR-East&odpt:station=odpt.Station:JR-East.Tokaido.Yokohama&acl:consumerKey=${odptConsumerKey}`;
    const trainInfoUrl = `${odptApiBase}/odpt:Train?odpt:operator=odpt.Operator:JR-East&odpt:railway=odpt.Railway:JR-East.Tokaido&acl:consumerKey=${odptConsumerKey}`;
    const trainTypeName = {
      'odpt.TrainType:JR-East.Local': '普　通',
      'odpt.TrainType:JR-East.Rapid': '快　速',
      'odpt.TrainType:JR-East.CommutersRapid': '通勤快速',
      'odpt.TrainType:JR-East.SpecialRapid': '特別快速',
      'odpt.TrainType:JR-East.LimitedExpress': '特　急',
      'odpt.TrainType:JR-East.Odoriko': '踊り子',
      'odpt.TrainType:JR-East.SaphirOdoriko': 'サフィール踊り子',
      'odpt.TrainType:JR-East.SunriseIzumo': 'サンライズ出雲',
      'odpt.TrainType:JR-East.SunriseSeto': 'サンライズ瀬戸',
      'odpt.TrainType:JR-East.Acty': 'アクティー',
      'odpt.TrainType:JR-East.Urban': 'アーバン',
      'odpt.TrainType:JR-East.Rabbit': 'ラビット',
      'odpt.TrainType:JR-East.Express': '快速'
    };
    const stationNameMap = {
      'Tokyo': '東京',
      'Ueno': '上野',
      'Omiya': '大宮',
      'Takasaki': '高崎',
      'Utsunomiya': '宇都宮',
      'Odawara': '小田原',
      'Atami': '熱海',
      'Numazu': '沼津',
      'Ito': '伊東',
      'Shuzenji': '修善寺',
      'IzuKyuShimoda': '伊豆急下田',
      'Kozu': '国府津',
      'Hiratsuka': '平塚',
      'Fujisawa': '藤沢',
      'Ofuna': '大船',
      'Totsuka': '戸塚',
      'Chigasaki': '茅ヶ崎',
      'Ninomiya': '二宮',
      'Kawasaki': '川崎',
      'Kamonomiya': '鴨宮',
      'Kagohara': '籠原',
      'ShinMaebashi': '新前橋',
      'Maebashi': '前橋',
      'Koga': '古河',
      'Koganei': '小金井',
      'Shinagawa': '品川',
      'Matsumoto': '松本',
      'Kobuchizawa': '小淵沢',
      'Nagano': '長野',
      'Yokohama': '横浜',
      'Takamatsu': '高松',
      'Kotohira': '琴平',
      'Izumoshi': '出雲市'
    };
    const trainCarMap = new Map();

    async function fetchOdptJson(url) {
      const res = await fetch(url);
      if (!res.ok) throw new Error(`ODPT API ${res.status}: ${res.statusText}`);
      return await res.json();
    }

    function normalizeOdptTerm(value) {
      if (!value || typeof value !== 'string') return value;
      const idx = value.lastIndexOf('.');
      return idx >= 0 ? value.slice(idx + 1) : value;
    }

    async function loadTrainCarComposition() {
      if (trainCarMap.size > 0) return trainCarMap;
      await loadRealtimeTrainInfo();
      realtimeTrainInfo.forEach((info, number) => {
        if (Number.isFinite(info.cars)) {
          trainCarMap.set(number, info.cars);
        }
      });
      return trainCarMap;
    }

    async function loadRealtimeTrainInfo() {
      if (realtimeTrainInfo.size > 0) return realtimeTrainInfo;
      const data = await fetchOdptJson(trainInfoUrl);
      if (!Array.isArray(data)) return realtimeTrainInfo;
      data.forEach(item => {
        const number = item['odpt:trainNumber'] || normalizeOdptTerm(item['odpt:train']) || normalizeOdptTerm(item['owl:sameAs']);
        if (!number) return;
        const delay = Number(item['odpt:delay'] || 0);
        const cars = Number.isFinite(Number(item['odpt:carComposition'])) ? Number(item['odpt:carComposition']) : null;
        realtimeTrainInfo.set(number, { delay: Number.isFinite(delay) ? delay : 0, cars });
        if (item['odpt:train']) {
          realtimeTrainInfo.set(normalizeOdptTerm(item['odpt:train']), { delay: Number.isFinite(delay) ? delay : 0, cars });
        }
        if (item['owl:sameAs']) {
          realtimeTrainInfo.set(normalizeOdptTerm(item['owl:sameAs']), { delay: Number.isFinite(delay) ? delay : 0, cars });
        }
      });
      return realtimeTrainInfo;
    }

    function getTrainTypeName(typeUri) {
      if (!typeUri) return '普　通';
      return trainTypeName[typeUri] || normalizeOdptTerm(typeUri).replace(/([A-Z])/g, ' $1').trim();
    }

    function getStationName(uri) {
      const code = normalizeOdptTerm(uri);
      return stationNameMap[code] || code;
    }

    function getDestinationText(destStations) {
      if (!Array.isArray(destStations)) return '';
      return destStations
        .map(getStationName)
        .filter(Boolean)
        .join(',');
    }

    function selectTimetableObjects(data, direction) {
      const now = getNowDate();
      const calendar = isHoliday(now) ? 'odpt.Calendar:SaturdayHoliday' : 'odpt.Calendar:Weekday';
      let candidates = data.filter(item => item['odpt:calendar'] === calendar && item['odpt:railDirection'] === direction);
      if (!candidates.length) {
        candidates = data.filter(item => item['odpt:railDirection'] === direction);
      }
      if (!candidates.length) {
        candidates = data;
      }
      return candidates.flatMap(item => item['odpt:stationTimetableObject'] || []);
    }

    function buildTimetableEntries(objects, carMap) {
      return objects
        .map(item => {
          const trainNumber = item['odpt:trainNumber'] || normalizeOdptTerm(item['odpt:train']);
          const type = getTrainTypeName(item['odpt:trainType']);
          const dest = getDestinationText(item['odpt:destinationStation']);
          const cars = trainNumber ? (carMap.get(trainNumber) ?? null) : null;
          const info = trainNumber ? (realtimeTrainInfo.get(trainNumber) || realtimeTrainInfo.get(normalizeOdptTerm(item['odpt:train'])) || null) : null;
          const delay = info ? info.delay : 0;
          const [h, m] = String(item['odpt:departureTime'] || '00:00').split(':').map(Number);
          const baseSec = (h < 4 ? h + 24 : h) * 3600 + (m || 0) * 60;
          const estimatedSec = baseSec + delay;
          return { type, time: item['odpt:departureTime'] || '', dest, cars, delay, baseSec, estimatedSec, trainNo: trainNumber };
        })
        .sort((a, b) => {
          if (!a.time) return 1;
          if (!b.time) return -1;
          return a.time.localeCompare(b.time);
        });
    }

    async function loadStationTimetable(direction) {
      const stationData = await fetchOdptJson(stationTimetableUrl);
      if (!Array.isArray(stationData)) return [];
      const objects = selectTimetableObjects(stationData, direction);
      const carMap = await loadTrainCarComposition();
      return buildTimetableEntries(objects, carMap);
    }

    function buildTable(data) {
      const table = document.createElement('table');
      table.style.width = '100%';
      table.style.borderCollapse = 'collapse';

      // 交互表示用タイマー（グローバルaltIndexは使わず、各行ごとに）
      // 0-59:日本語1, 60-119:日本語2, 120-149:英語1, 150-179:英語2
      const langTimerLocal = langTimer % 180;
      let localAltIndex = 0;
      let localShowEnglish = false;
      if (langTimerLocal < 60) {
        localShowEnglish = false;
        localAltIndex = 0;
      } else if (langTimerLocal < 120) {
        localShowEnglish = false;
        localAltIndex = 1;
      } else if (langTimerLocal < 150) {
        localShowEnglish = true;
        localAltIndex = 0;
      } else {
        localShowEnglish = true;
        localAltIndex = 1;
      }

      data.forEach(datum => {
        const tr = document.createElement('tr');
        tr.style.background = '#0c0c0c';
        tr.style.borderRadius = '4px';
        tr.style.minHeight = '80px';
        tr.style.borderTop = '#fff 1px solid';

        // 路線名ラベル
        const typeTd = document.createElement('td');
        typeTd.style.textAlign = 'left';
        typeTd.style.width = '120px';
        typeTd.style.verticalAlign = 'center';
        let routeName = '';
        let routeColor = '';
        let destArr = datum.dest ? datum.dest.split(',') : [''];
        // 行ごとに交互表示判定
        let rowAltMode = (destArr.length > 1) || ((datum.type ? datum.type.split(',').length : 0) > 1);
        // 交互表示インデックス
        let rowAltIndex = rowAltMode ? localAltIndex : 0;
        let rowShowEnglish = rowAltMode ? localShowEnglish : showEnglish;
        const routeDestToShow = destArr[rowAltIndex % destArr.length];
        // 行先による路線名分岐
        if (routeDestToShow === '上野') {
          routeName = '上野東京ライン直通';
          routeColor = 'var(--jt-orange)';
        } else if (["上尾", "桶川", "鴻巣", "籠原", "深谷", "神保原", "高崎", "新前橋", "前橋"].includes(routeDestToShow)) {
          routeName = '高崎線直通';
          routeColor = 'var(--jt-orange)';
        } else if (["古河", "小金井", "宇都宮"].includes(routeDestToShow)) {
          routeName = '宇都宮線直通';
          routeColor = 'var(--jt-orange)';
        } else if (["下,修", "伊豆急下田", "修善寺", "沼津"].includes(routeDestToShow)) {
          routeName = '東海道線';
          routeColor = 'var(--jt-orange)';
        } else {
          const stationNumber = stationNumbers[routeDestToShow];
          if (stationNumber) {
            const prefix = stationNumber.match(/([A-Za-z]+)/)[1];
            if (prefix === 'JT') {
              routeName = '東海道線';
              routeColor = 'var(--jt-orange)';
            } else if (prefix === 'JK') {
              routeName = '京浜東北線';
              routeColor = 'var(--jk-blue)';
            } else if (prefix === 'JO') {
              routeName = '横須賀線';
              routeColor = '#0055a4';
            } else {
              routeName = '';
              routeColor = '#fff';
            }
          } else {
            routeName = '';
            routeColor = 'var(--jt-orange)';
          }
        }
        const routeLabel = document.createElement('div');
        routeLabel.className = 'route-label';
        if (rowShowEnglish && routeEn[routeName]) {
          routeLabel.textContent = routeEn[routeName];
        } else {
          routeLabel.textContent = routeName;
        }
        routeLabel.style.color = routeColor;
        routeLabel.style.background = 'none';
        routeLabel.style.marginBottom = '0px';
        routeLabel.style.justifyContent = 'flex-start';
        typeTd.appendChild(routeLabel);

        // 種別
        let typeArr = datum.type ? datum.type.split(',') : [''];
        typeArr = typeArr.map(t => abbrevTypeMap[t] || t);
        let typeToShow = typeArr[rowAltIndex % typeArr.length] || '';
        const typeBg = typeColors[typeToShow] || '#0c0c0c';
        const typeDiv = document.createElement('div');
        typeDiv.className = 'type';
        typeDiv.style.backgroundColor = typeBg;
        typeDiv.style.justifyContent = 'center';
        if (rowShowEnglish && typeEn[typeToShow]) {
          typeDiv.innerHTML = '';
          const typeTextSpan = document.createElement('span');
          typeTextSpan.textContent = typeEn[typeToShow];
          if (!routeName) {
            typeTextSpan.style.fontSize = '2.5rem';
          } else {

    function getCurrentTimeStr() {
      const now = new Date();

    function getUpcomingTrains(data, count = 5) {
      const now = getNowDate();
      const nowSeconds = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
      const nowNormalizedSeconds = now.getHours() < 4 ? nowSeconds + 24 * 3600 : nowSeconds;

      // 各列車の秒数を計算
      let trainsWithSeconds = data.map(d => {
        if (!d.time) return { ...d, estimatedSec: null };
        const [h, m] = d.time.split(':').map(Number);
        let baseSec = (h < 4 ? h + 24 : h) * 3600 + (m || 0) * 60;
        let estimatedSec = baseSec + (d.delay || 0);
        return { ...d, baseSec, estimatedSec };
      });

      // 時刻順にソート
      const sorted = trainsWithSeconds
        .filter(d => d.estimatedSec !== null)
        .sort((a, b) => a.estimatedSec - b.estimatedSec);

      // 現在時刻以降の電車を抽出
      const upcoming = sorted.filter(d => d.estimatedSec >= nowNormalizedSeconds - 60);

      // 必要数だけ取得
      const result = upcoming.slice(0, count).map(d => ({ type: d.type, time: d.time, dest: d.dest, cars: d.cars, delay: d.delay, delay: d.delay }));

      // 足りない場合は空行で埋める
      while (result.length < count) {
        result.push({ type: '', time: '', dest: '', cars: '', delay: 0 });
      }
      return result;
    }

    // 変動祝日計算
    function calcHappyMonday(year, month, nth) {
      // month: 1-12, nth: 第何月曜
      let count = 0;
      for (let d = 1; d <= 31; d++) {
        const date = new Date(year, month - 1, d);
        if (date.getMonth() + 1 !== month) break;
        if (date.getDay() === 1) {
          count++;
          if (count === nth) return d;
        }
      }
      return null;
    }

    // 春分・秋分の日（国立天文台方式、2099年まで対応）
    function calcVernalEquinox(year) {
      if (year <= 1979) return 0;
      if (year <= 2099) return Math.floor(20.8431 + 0.242194 * (year - 1980) - Math.floor((year - 1980) / 4));
      return 0;
    }
    function calcAutumnalEquinox(year) {
      if (year <= 1979) return 0;
      if (year <= 2099) return Math.floor(23.2488 + 0.242194 * (year - 1980) - Math.floor((year - 1980) / 4));
      return 0;
    }

    function isHoliday(date) {
      // 土日祝判定（毎年対応）
      const day = date.getDay();
      if (day === 0 || day === 6) return true; // 日曜または土曜
      const year = date.getFullYear();
      const mmdd = `${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
      // 固定祝日
      if (fixedHolidays.includes(mmdd)) return true;
      // 春分の日
      if (date.getMonth() + 1 === 3 && date.getDate() === calcVernalEquinox(year)) return true;
      // 秋分の日
      if (date.getMonth() + 1 === 9 && date.getDate() === calcAutumnalEquinox(year)) return true;
      // 海の日（7月第3月曜）
      if (date.getMonth() + 1 === 7 && date.getDate() === calcHappyMonday(year, 7, 3)) return true;
      // 敬老の日（9月第3月曜）
      if (date.getMonth() + 1 === 9 && date.getDate() === calcHappyMonday(year, 9, 3)) return true;
      // 体育の日（10月第2月曜、2020年以降はスポーツの日で7月に移動）
      if (year <= 2019 && date.getMonth() + 1 === 10 && date.getDate() === calcHappyMonday(year, 10, 2)) return true;
      // スポーツの日（2020年以降、7月第2月曜）
      if (year >= 2020 && date.getMonth() + 1 === 7 && date.getDate() === calcHappyMonday(year, 7, 2)) return true;
      return false;
    }

    function normalizeAnnouncementTrain(train) {
      if (!train || !train.time) return train;
      const [h, m] = String(train.time).split(':').map(Number);
      const baseSec = (h < 4 ? h + 24 : h) * 3600 + (m || 0) * 60;
      const estimatedSec = Number.isFinite(train.estimatedSec) ? train.estimatedSec : baseSec + (Number(train.delay) || 0);
      return { ...train, baseSec, estimatedSec };
    }

      const next = combined1.filter(t => t && t.estimatedSec >= nowSec).sort((a, b) => a.estimatedSec - b.estimatedSec)[0];
      if (next && next.estimatedSec - nowSec <= 60 && next.estimatedSec - nowSec > 0) {
        const key = `${next.time || ''}${next.trainNo || ''}`;
        if (lastAnnouncedTime1 !== key) {
          playAudioSequence1(next);
          lastAnnouncedTime1 = key;
        }
      } else if (next && next.estimatedSec - nowSec > 60) {
        lastAnnouncedTime1 = null;
      }
    }

    // --- 音声案内機能 2番線 ---
    let lastAnnouncedTime2 = null;
    let audioPlaying2 = false;

    function checkAndAnnounce2() {
      if (!audioEnabled) return;
      const combined2 = getAllTrains2().map(normalizeAnnouncementTrain);
      if (!combined2.length) return;
      const now = new Date();
      const nowSec = (now.getHours() < 4 ? now.getHours() + 24 : now.getHours()) * 3600 + now.getMinutes() * 60 + now.getSeconds();
      const next = combined2.filter(t => t && t.estimatedSec >= nowSec).sort((a, b) => a.estimatedSec - b.estimatedSec)[0];
      if (next && next.estimatedSec - nowSec <= 30 && next.estimatedSec - nowSec > 0) {
        const key = `${next.time || ''}${next.trainNo || ''}`;
        if (lastAnnouncedTime2 !== key) {
          playAudioSequence2(next);
          lastAnnouncedTime2 = key;
        }
      } else if (next && next.estimatedSec - nowSec > 30) {
        lastAnnouncedTime2 = null;
      }
    }

    function isLastTrainToday(trains, train) {
      // その日の4:00～翌4:00までの同じ行先の列車のうち、最も遅いものか判定
      if (!train.time || !train.dest) return false;
      // その日の始まり（4:00）と終わり（翌4:00）の分数
      const [h, m] = train.time.split(':').map(Number);
      let trainMin = h * 60 + m;
      if (h < 4) trainMin += 1440;

      // 同じ行先の列車を抽出
      const sameDestTrains = trains.filter(t => t.dest === train.dest && t.time).map(t => {
        const [hh, mm] = t.time.split(':').map(Number);
        let min = hh * 60 + mm;
        if (hh < 4) min += 1440;
        return { ...t, min };
      });
      if (sameDestTrains.length === 0) return false;
      // 最大時刻を持つ列車が自分自身なら最終
      const maxTrain = sameDestTrains.reduce((a, b) => (a.min > b.min ? a : b));
      return maxTrain.time === train.time;
    }

    // 初回ロード
    loadTimetable1();
    loadTimetable2();
    // 30秒ごとに自動更新
    setInterval(() => {
      loadTimetable1();
      loadTimetable2();
    }, 30000);
    // 画面表示も0.1秒ごとに更新（時刻切替用）
    setInterval(render, 100);
    // 1番線音声案内チェック（0.1秒ごと）
    setInterval(checkAndAnnounce1, 100);
    setInterval(checkAndAnnounce2, 100);

  </script>
