<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1100,initial-scale=1" />
  <title>横浜駅5~8番線 発車標</title>
  <style>
    @font-face {
      font-family: "Frutiger";
      src: url("Frutiger.ttf") format("truetype");
    }

    @font-face {
      font-family: "Frutiger-B";
      src: url(Frutiger_bold.ttf) format("truetype");
    }

    @font-face {
      font-family: "ShinGo";
      src: url(AOTFShinGoProMedium.otf) format("opentype");
    }

    :root {
      --bg: #0b0b0b;
      --muted: #9aa3a8;
      --jt-orange: #f68b1e;
    }

    body {
      margin: 0;
      font-family: "Frutiger", "ShinGo", sans-serif;
      background: #ffffff;
      display: block;
      padding: 24px;
      color: #fff;
    }

    .atos {
      width: 1000px;
      background: #1a1a1a;
      border-radius: 8px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, .7);
      display: flex;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.03);
      margin: 24px auto;
    }

    .slot-number {
      font-family: "Frutiger-B";
      width: 140px;
      background: #1f1f1f;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .slot-number .num {
      font-size: 160px;
      color: #e8e8e8;
      text-shadow: 0 2px 0 rgba(0, 0, 0, .6);
    }

    .display {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 10px 16px;
      box-sizing: border-box;
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0px 12px;
      background: #2b2b2b;
      border-radius: 4px;
      margin-bottom: 8px;
    }

    .jt-badge {
      font-family: "Frutiger-B";
      width: 40px;
      height: 40px;
      border: var(--jt-orange) 5px solid;
      border-radius: 4px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #0b0b0b;
      font-size: 32px;
    }

    .jh-badge {
      font-family: "Frutiger-B";
      width: 40px;
      height: 40px;
      border: var(--jh-green) 5px solid;
      border-radius: 4px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #0b0b0b;
      font-size: 32px;
      margin-left: 20px;
    }

    .station-badge {
      font-family: "Frutiger-B";
      width: 30px;
      height: 30px;
      aspect-ratio: 1/1;
      border: 5px solid var(--jt-orange);
      border-radius: 4px;
      background: #fff;
      display: flex;
      flex-direction: column;
      /* 縦方向に配置 */
      align-items: center;
      justify-content: center;
      color: #0b0b0b;
      font-size: 16px;
      padding: 2px 4px 4px 4px;
      margin-right: 8px;
      line-height: 100%;
    }

    .station-prefix {
      font-size: 16px;
      /* 駅ナンバリングの接頭辞のサイズ */
    }

    .station-number {
      font-size: 23px;
      /* 駅ナンバリングの数字のサイズ */
    }

    .line-name {
      color: #ffffff;
      font-size: 20px;
      line-height: 1.2;
    }

    .line-sub {
      color: #fff;
      font-size: 25px;
      line-height: 1.2;
      text-align: right;
    }

    .rows {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .row {
      display: grid;
      grid-template-columns: 200px 220px 1fr;
      align-items: center;
      background: #0c0c0c;
      border-radius: 4px;
      padding: 4px 8px;
      min-height: 80px;
      border-top: #fff 1px solid;
    }

    .type {
      font-family: "Helvetica", "ShinGo";
      font-size: 28px;
      width: 200px;
      color: #fff;
      text-align: center;
      background-color: #ff0000;
      border-radius: 7px;
      line-height: 100%;
      padding: 6px 0;
      justify-content: center;
      display: flex;
    }

    .route-label {
      font-family: "Helvetica", "ShinGo";
      width: 200px;
      font-size: 20px;
      margin: 0;
      line-height: 130%;
    }

    .time {
      font-size: 75px;
      text-align: right;
    }

    .platform {
      font-size: 52px;
      text-align: left;
      color: #fff;
      display: flex;
      gap: 8px;
      justify-content: flex-start;
      align-items: center;
    }

    .badge-circle {
      width: 38px;
      height: 26px;
      border-radius: 4px;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    .cars-badge {
      color: #fffd94;
      font-size: 55px;
      border-radius: 6px;
      padding: 2px 0px;
      margin-right: 10px;
      display: inline-block;
      width: 105px;
    }

    .dest-text {
      font-family: "Helvetica", "ShinGo";
      font-size: 52px;
      line-height: 100%;
      color: #fff;
      display: flex;
      align-items: center;
      width: 280px;
    }

    .dest-text .sx-shrink {
      display: inline-block;
      transform-origin: left center;
      vertical-align: middle;
      white-space: nowrap;
    }

    td {
      padding: 0;
      margin: 0;
      line-height: 100%;
    }

    tr {
      height: 85px;
    }
  </style>
</head>

<body>
  <!-- 1番線表示 -->
  <div class="atos">
    <div class="slot-number">
      <div class="num">6</div>
    </div>
    <div class="display">
      <div class="topbar">
        <div class="jt-badge"><span>JT</span></div>
        <div>
          <div class="line-name">東海道線</div>
          <div class="line-sub">大船・平塚・国府津・小田原・熱海方面</div>
        </div>
      </div>
      <div class="rows" id="rows1"></div>
    </div>
  </div>
  <!-- 2番線表示 -->
  <div class="atos">
    <div class="slot-number">
      <div class="num">7</div>
    </div>
    <div class="display">
      <div class="topbar">
        <div class="jt-badge"><span>JT</span></div>
        <div>
          <div class="line-name">上野東京ライン</div>
          <div class="line-sub">東京・上野・大宮・高崎・宇都宮方面</div>
        </div>
      </div>
      <div class="rows" id="rows2"></div>
    </div>
  </div>
  <button id="enable-audio-btn"
    style="position:fixed;top:30px;right:30px;z-index:1000;font-size:15px;padding:6px 12px;">ATOS放送</button>
  <script>
    let debugTime = null; // 例: "23:58" など。nullなら通常の現在時刻
    function getNowDate() {
      if (debugTime) {
        const now = new Date();
        const [h, m] = debugTime.split(':').map(Number);
        now.setHours(h);
        now.setMinutes(m);
        now.setSeconds(0);
        now.setMilliseconds(0);
        return now;
      } else {
        return new Date();
      }
    }

    const stationNumbers = {
      '東京': 'JT01', '上野': 'JU02', '東京': 'JT01', '品川': 'JT03', '平塚': 'JT11', '国府津': 'JT14', '小田原': 'JT16', '熱海': 'JT21', '伊東': 'JT26'
    };
    const lineColors = { JT: '--jt-orange', JU: '--jt-orange', JO: '#0055a4' };
    const typeColors = { '快': 'red', '快　速': '#ff9900', '各駅停車': '#383838', '普　通': '#383838', 'アクティー': '#ff9900', 'アーバン': '#ff9900', 'ラビット': '#ff9900', '通勤快速': 'purple', '特別快速': 'green', '特　急': 'red', '寝台特急': 'red', '踊り子': 'red', 'サフィール踊り子': 'red', 'サンライズ出雲': 'red', 'サンライズ瀬戸': 'red' };
    const rowsEl1 = document.getElementById('rows1');
    const rowsEl2 = document.getElementById('rows2');
    let trains1 = [];
    let trains2 = [];

    function buildTable(data) {
      const table = document.createElement('table');
      table.style.width = '100%';
      table.style.borderCollapse = 'collapse';

      // 交互表示用タイマー（グローバルaltIndexは使わず、各行ごとに）
      // 0-59:日本語1, 60-119:日本語2, 120-149:英語1, 150-179:英語2
      const langTimerLocal = langTimer % 180;
      let localAltIndex = 0;
      let localShowEnglish = false;
      if (langTimerLocal < 60) {
        localShowEnglish = false;
        localAltIndex = 0;
      } else if (langTimerLocal < 120) {
        localShowEnglish = false;
        localAltIndex = 1;
      } else if (langTimerLocal < 150) {
        localShowEnglish = true;
        localAltIndex = 0;
      } else {
        localShowEnglish = true;
        localAltIndex = 1;
      }

      data.forEach(datum => {
        const tr = document.createElement('tr');
        tr.style.background = '#0c0c0c';
        tr.style.borderRadius = '4px';
        tr.style.minHeight = '80px';
        tr.style.borderTop = '#fff 1px solid';

        // 路線名ラベル
        const typeTd = document.createElement('td');
        typeTd.style.textAlign = 'left';
        typeTd.style.width = '120px';
        typeTd.style.verticalAlign = 'center';
        let routeName = '';
        let routeColor = '';
        let destArr = datum.dest ? datum.dest.split(',') : [''];
        // 行ごとに交互表示判定
        let rowAltMode = (destArr.length > 1) || ((datum.type ? datum.type.split(',').length : 0) > 1);
        // 交互表示インデックス
        let rowAltIndex = rowAltMode ? localAltIndex : 0;
        let rowShowEnglish = rowAltMode ? localShowEnglish : showEnglish;
        const routeDestToShow = destArr[rowAltIndex % destArr.length];
        // 行先による路線名分岐
        if (routeDestToShow === '上野') {
          routeName = '上野東京ライン直通';
          routeColor = 'var(--jt-orange)';
        } else if (["上尾", "桶川", "鴻巣", "籠原", "深谷", "神保原", "高崎", "新前橋", "前橋"].includes(routeDestToShow)) {
          routeName = '高崎線直通';
          routeColor = 'var(--jt-orange)';
        } else if (["古河", "小金井", "宇都宮"].includes(routeDestToShow)) {
          routeName = '宇都宮線直通';
          routeColor = 'var(--jt-orange)';
        } else if (["下,修", "伊豆急下田", "修善寺", "沼津"].includes(routeDestToShow)) {
          routeName = '東海道線';
          routeColor = 'var(--jt-orange)';
        } else {
          const stationNumber = stationNumbers[routeDestToShow];
          if (stationNumber) {
            const prefix = stationNumber.match(/([A-Za-z]+)/)[1];
            if (prefix === 'JT') {
              routeName = '東海道線';
              routeColor = 'var(--jt-orange)';
            } else if (prefix === 'JK') {
              routeName = '京浜東北線';
              routeColor = 'var(--jk-blue)';
            } else if (prefix === 'JO') {
              routeName = '横須賀線';
              routeColor = '#0055a4';
            } else {
              routeName = '';
              routeColor = '#fff';
            }
          } else {
            routeName = '';
            routeColor = 'var(--jt-orange)';
          }
        }
        const routeLabel = document.createElement('div');
        routeLabel.className = 'route-label';
        if (rowShowEnglish && routeEn[routeName]) {
          routeLabel.textContent = routeEn[routeName];
        } else {
          routeLabel.textContent = routeName;
        }
        routeLabel.style.color = routeColor;
        routeLabel.style.background = 'none';
        routeLabel.style.marginBottom = '0px';
        routeLabel.style.justifyContent = 'flex-start';
        typeTd.appendChild(routeLabel);

        // 種別
        let typeArr = datum.type ? datum.type.split(',') : [''];
        typeArr = typeArr.map(t => abbrevTypeMap[t] || t);
        let typeToShow = typeArr[rowAltIndex % typeArr.length] || '';
        const typeBg = typeColors[typeToShow] || '#0c0c0c';
        const typeDiv = document.createElement('div');
        typeDiv.className = 'type';
        typeDiv.style.backgroundColor = typeBg;
        typeDiv.style.justifyContent = 'center';
        if (rowShowEnglish && typeEn[typeToShow]) {
          typeDiv.innerHTML = '';
          const typeTextSpan = document.createElement('span');
          typeTextSpan.textContent = typeEn[typeToShow];
          if (!routeName) {
            typeTextSpan.style.fontSize = '2.5rem';
          } else {
            typeTextSpan.style.fontSize = '28px';
          }
          const testSpanType = document.createElement('span');
          testSpanType.style.visibility = 'hidden';
          testSpanType.style.position = 'absolute';
          testSpanType.style.fontFamily = '"Helvetica","ShinGo"';
          testSpanType.style.whiteSpace = 'nowrap';
          testSpanType.textContent = typeEn[typeToShow];
          testSpanType.style.fontSize = typeTextSpan.style.fontSize;
          document.body.appendChild(testSpanType);
          const widthType = testSpanType.offsetWidth;
          document.body.removeChild(testSpanType);
          const maxWidthType = 190;
          if (widthType > maxWidthType) {
            const scaleXType = maxWidthType / widthType;
            typeTextSpan.style.display = 'inline-block';
            typeTextSpan.style.whiteSpace = 'nowrap';
            typeTextSpan.style.transform = `scaleX(${scaleXType})`;
          }
          typeDiv.appendChild(typeTextSpan);
        } else {
          // 日本語表記でも幅がはみ出す場合は自動縮小
          typeDiv.innerHTML = '';
          const typeTextSpan = document.createElement('span');
          typeTextSpan.textContent = typeToShow || '\u00A0';
          typeTextSpan.style.fontSize = '28px';
          const testSpanType = document.createElement('span');
          testSpanType.style.visibility = 'hidden';
          testSpanType.style.position = 'absolute';
          testSpanType.style.fontFamily = '"Helvetica","ShinGo"';
          testSpanType.style.whiteSpace = 'nowrap';
          testSpanType.textContent = typeToShow || '\u00A0';
          if (!routeName) {
            typeTextSpan.style.fontSize = '2.5rem';
          } else {
            typeTextSpan.style.fontSize = '28px';
          }
          document.body.appendChild(testSpanType);
          const widthType = testSpanType.offsetWidth;
          document.body.removeChild(testSpanType);
          const maxWidthType = 190;
          if (widthType > maxWidthType) {
            const scaleXType = maxWidthType / widthType;
            typeTextSpan.style.display = 'inline-block';
            typeTextSpan.style.whiteSpace = 'nowrap';
            typeTextSpan.style.transform = `scaleX(${scaleXType})`;
          }
          typeDiv.appendChild(typeTextSpan);
        }
        if (!routeName) {
          typeDiv.style.height = '50px';
          typeDiv.style.fontSize = '2.5em';
          typeDiv.style.display = 'flex';
          typeDiv.style.alignItems = 'center';
          typeDiv.style.justifyContent = 'center';
        }
        typeTd.appendChild(typeDiv);

        // 時刻
        const timeTd = document.createElement('td');
        timeTd.style.textAlign = 'right';
        if (datum.time) {
          const [h, m] = datum.time.split(':');
          const hour = String(Number(h));
          const minute = String(m).padStart(2, '0');
          timeTd.innerHTML = `<div class="time" style="min-width:110px;">${hour}:${minute}</div>`;
        } else {
          timeTd.innerHTML = '<div class="time" style="min-width:110px;">&nbsp;</div>';
        }

        // 行先＋駅ナンバリング
        const destTd = document.createElement('td');
        destTd.style.textAlign = 'left';
        destTd.style.paddingLeft = '16px';
        destTd.style.width = '240px';
        const destWrap = document.createElement('div');
        destWrap.className = 'dest-text';
        destArr = destArr.map(d => abbrevDestMap[d] || d);
        let destToShow = destArr[rowAltIndex % destArr.length] || '';
        if (destToShow) {
          const stationNumber = stationNumbers[destToShow];
          if (stationNumber) {
            const badge = document.createElement('div');
            badge.className = 'station-badge';
            const [prefix, number] = stationNumber.match(/([A-Za-z]+)(\d+)/).slice(1);
            badge.innerHTML = `<span class="station-prefix">${prefix}</span><span class="station-number">${number}</span>`;
            const borderColor = lineColors[prefix] || '#000';
            badge.style.border = `5px solid ${borderColor}`;
            badge.style.marginLeft = '0px';
            destWrap.appendChild(badge);
          }
          const destName = document.createElement('span');
          destName.style.marginLeft = '0px';
          if (rowShowEnglish && destEn[destToShow]) {
            destName.textContent = destEn[destToShow];
            const testSpan = document.createElement('span');
            testSpan.style.visibility = 'hidden';
            testSpan.style.position = 'absolute';
            testSpan.style.fontSize = '52px';
            testSpan.style.fontFamily = '"Helvetica","ShinGo"';
            testSpan.style.whiteSpace = 'nowrap';
            testSpan.textContent = destEn[destToShow];
            document.body.appendChild(testSpan);
            const width = testSpan.offsetWidth;
            document.body.removeChild(testSpan);
            let maxWidth = 225;
            if (!stationNumber) {
              maxWidth = 275;
            }
            if (width > maxWidth) {
              const scaleX = maxWidth / width;
              destName.style.display = 'inline-block';
              destName.style.transformOrigin = 'left center';
              destName.style.whiteSpace = 'nowrap';
              destName.style.transform = `scaleX(${scaleX})`;
            }
          } else {
            destName.textContent = destToShow;
          }
          destWrap.appendChild(destName);
        } else {
          destWrap.innerHTML = '&nbsp;';
        }
        destTd.appendChild(destWrap);

        // 両数バッジ
        const carsTd = document.createElement('td');
        carsTd.style.textAlign = 'right';
        carsTd.style.width = '100px';
        if (datum.cars) {
          const carsBadge = document.createElement('span');
          carsBadge.className = 'cars-badge';
          if (rowShowEnglish) {
            carsBadge.innerHTML = carsEn(datum.cars);
          } else {
            carsBadge.innerHTML = `${datum.cars}<span style="font-size:0.7em;padding-left:5px;">両</span>`;
          }
          carsTd.appendChild(carsBadge);
        } else {
          carsTd.innerHTML = '&nbsp;';
        }

        tr.appendChild(typeTd);
        tr.appendChild(timeTd);
        tr.appendChild(destTd);
        tr.appendChild(carsTd);

        table.appendChild(tr);
      });
      return table;
    }

    function getCurrentTimeStr() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      return `${h}:${m}`;
    }

    function getUpcomingTrains(data, count = 5) {
      const now = getNowDate();
      let nowMinutes = now.getHours() * 60 + now.getMinutes();
      if (now.getHours() < 4) nowMinutes += 1440;

      // 各列車の分数を計算
      let trainsWithMinutes = data.map(d => {
        if (!d.time) return { ...d, minutes: null };
        const [h, m] = d.time.split(':').map(Number);
        let minutes = h * 60 + m;
        // 4:00未満は+1440分（翌日分）
        if (h < 4) minutes += 1440;
        return { ...d, minutes };
      });

      // 時刻順にソート
      const sorted = trainsWithMinutes
        .filter(d => d.minutes !== null)
        .sort((a, b) => a.minutes - b.minutes);

      // 現在時刻以降の電車を抽出
      const upcoming = sorted.filter(d => d.minutes >= nowMinutes);

      // 必要数だけ取得
      const result = upcoming.slice(0, count).map(d => ({ type: d.type, time: d.time, dest: d.dest, cars: d.cars }));

      // 足りない場合は空行で埋める
      while (result.length < count) {
        result.push({ type: '', time: '', dest: '', cars: '' });
      }
      return result;
    }

    function render() {
      // 1番線
      rowsEl1.innerHTML = '';
      const trainsToShow1 = getUpcomingTrains(trains1, 2);
      rowsEl1.appendChild(buildTable(trainsToShow1));
      // 2番線
      rowsEl2.innerHTML = '';
      const trainsToShow2 = getUpcomingTrains(trains2, 2);
      rowsEl2.appendChild(buildTable(trainsToShow2));
    }

    // --- 英語表記辞書 ---
    const typeEn = {
      '普　通': 'Local',
      '快　速': 'Rapid',
      'アクティー': 'Acty',
      'アーバン': 'Urban',
      'ラビット': 'Rabbit',
      '通勤快速': 'Commuters Rapid',
      '特別快速': 'Special Rapid',
      '普通': 'Local',
      '特　急': 'Limited Express',
      '踊り子': 'Odoriko',
      'サフィール踊り子': 'Saphir Odoriko',
      '寝台特急': 'Sleeper Limited Express',
      'サンライズ出雲': 'Sunrise Izumo',
      'サンライズ瀬戸': 'Sunrise Seto'
    };
    const destEn = {
      '沼津': 'Numazu',
      '伊東': 'Itō',
      '熱海': 'Atami',
      '小田原': 'Odawara',
      '国府津': 'Kōzu',
      '平塚': 'Hiratsuka',
      '品川': 'Shinagawa',
      '東京': 'Tōkyō',
      '上野': 'Ueno',
      '籠原': 'Kagohara',
      '高崎': 'Takasaki',
      '新前橋': 'Shin-Maebashi',
      '前橋': 'Maebashi',
      '古河': 'Koga',
      '小金井': 'Koganei',
      '宇都宮': 'Utsunomiya',
      '伊豆急下田': 'IzuKyū-Shimoda',
      '修善寺': 'Shuzenji',
      '高松': 'Takamatsu',
      '琴平': 'Kotohira',
      '出雲市': 'Izumo-shi',
      '大宮': 'Ōmiya',
      '松本': 'Matsumoto',
      '南小谷': 'Minami-Otari',
      '信濃大町': 'Shinano-Ōmachi',
      '長野': 'Nagano',
      '富士山': 'Mt.Fuji',
      '河口湖': 'Kawaguchiko'
    };
    const routeEn = {
      '東海道線': 'Tōkaidō Line',
      '高崎線直通': 'Takasaki Line',
      '宇都宮線直通': 'Utsunomiya Line',
      '上野東京ライン直通': 'Ueno-Tokyo Line'
    };
    const carsEn = n => `${n}<span style="font-size:0.7em;padding-left:0px;">cars</span>`;
    const abbrevTypeMap = {
      '特': '特　急',
      '寝特': '寝台特急',
      '踊': '踊り子',
      'S踊': 'サフィール踊り子',

    // 変動祝日計算
    function calcHappyMonday(year, month, nth) {
      // month: 1-12, nth: 第何月曜
      let count = 0;
      for (let d = 1; d <= 31; d++) {
        const date = new Date(year, month - 1, d);
        if (date.getMonth() + 1 !== month) break;
        if (date.getDay() === 1) {
          count++;
          if (count === nth) return d;
        }
      }
      return null;
    }

    // 春分・秋分の日（国立天文台方式、2099年まで対応）
    function calcVernalEquinox(year) {
      if (year <= 1979) return 0;
      if (year <= 2099) return Math.floor(20.8431 + 0.242194 * (year - 1980) - Math.floor((year - 1980) / 4));
      return 0;
    }
    function calcAutumnalEquinox(year) {
      if (year <= 1979) return 0;
      if (year <= 2099) return Math.floor(23.2488 + 0.242194 * (year - 1980) - Math.floor((year - 1980) / 4));
      return 0;
    }

    function isHoliday(date) {
      // 土日祝判定（毎年対応）
      const day = date.getDay();
      if (day === 0 || day === 6) return true; // 日曜または土曜
      const year = date.getFullYear();
      const mmdd = `${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
      // 固定祝日
      if (fixedHolidays.includes(mmdd)) return true;
      // 春分の日
      if (date.getMonth() + 1 === 3 && date.getDate() === calcVernalEquinox(year)) return true;
      // 秋分の日
      if (date.getMonth() + 1 === 9 && date.getDate() === calcAutumnalEquinox(year)) return true;
      // 海の日（7月第3月曜）
      if (date.getMonth() + 1 === 7 && date.getDate() === calcHappyMonday(year, 7, 3)) return true;
      // 敬老の日（9月第3月曜）
      if (date.getMonth() + 1 === 9 && date.getDate() === calcHappyMonday(year, 9, 3)) return true;
      // 体育の日（10月第2月曜、2020年以降はスポーツの日で7月に移動）
      if (year <= 2019 && date.getMonth() + 1 === 10 && date.getDate() === calcHappyMonday(year, 10, 2)) return true;
      // スポーツの日（2020年以降、7月第2月曜）
      if (year >= 2020 && date.getMonth() + 1 === 7 && date.getDate() === calcHappyMonday(year, 7, 2)) return true;
      return false;
    }

        } else if (["上尾", "桶川", "鴻巣", "籠原", "深谷", "神保原", "高崎", "新前橋", "前橋"].includes(routeDestToShow)) {
          routeName = '高崎線直通';
        } else if (["古河", "小金井", "宇都宮"].includes(routeDestToShow)) {
          routeName = '宇都宮線直通';
        }
      }

      let files = ['atos/ATOS接近音.mp3', 'atos/w/まもなく2番線に.mp3'];
      if (routeName === '上野東京ライン直通') {
        files.push('atos/w/上野東京ライン.mp3');
        // 種別
        if (audioCache[typeFile]) {
          files.push(typeFile);
        } else {
          typeArr.forEach(t => {
            let tFull = t.replace(/\s/g, '').replace(/　/g, '');
            let tFile = `atos/w/${tFull}.mp3`;
            if (audioCache[tFile]) files.push(tFile);
          });
        }
        // 行先
        if (audioCache[destFile]) {
          files.push(destFile);
        } else if (destArr.length === 2) {
          destArr.forEach((d, i) => {
            let dFull = d.replace(/\s/g, '').replace(/　/g, '');
            if (i === 0) {
              let f = `atos/m/${dFull}.mp3`;
              if (audioCache[f]) files.push(f);
            } else {
              let f = `atos/m/${dFull}行がまいります.mp3`;
              if (audioCache[f]) files.push(f);
            }
          });
        } else {
          // 「〇〇行がまいります」パーツがない場合は「〇〇.mp3」＋「行がまいります.mp3」
          if (audioCache[destSingleFile]) files.push(destSingleFile);
          if (!audioCache[destFile] && audioCache[goFile]) files.push(goFile);
        }
      } else if (routeName === '高崎線直通') {
        files.push('atos/w/上野東京ライン.mp3');
        files.push('atos/w/高崎線直通.mp3');
        // 種別
        if (audioCache[typeFile]) {
          files.push(typeFile);
        } else {
          typeArr.forEach(t => {
            let tFull = t.replace(/\s/g, '').replace(/　/g, '');
            let tFile = `atos/m/${tFull}.mp3`;
            if (audioCache[tFile]) files.push(tFile);
          });
        }
        // 行先
        if (audioCache[destFile]) {
          files.push(destFile);
        } else if (destArr.length === 2) {
          destArr.forEach((d, i) => {
            let dFull = d.replace(/\s/g, '').replace(/　/g, '');
            if (i === 0) {
              let f = `atos/w/${dFull}.mp3`;
              if (audioCache[f]) files.push(f);
            } else {
              let f = `atos/w/${dFull}行がまいります.mp3`;
              if (audioCache[f]) files.push(f);
            }
          });
        } else {
          if (audioCache[destSingleFile]) files.push(destSingleFile);
          if (audioCache[goFile]) files.push(goFile);
        }
      } else if (routeName === '宇都宮線直通') {
        files.push('atos/w/上野東京ライン.mp3');
        files.push('atos/w/宇都宮線直通.mp3');
        // 種別
        if (audioCache[typeFile]) {
          files.push(typeFile);
        } else {
          typeArr.forEach(t => {
            let tFull = t.replace(/\s/g, '').replace(/　/g, '');
            let tFile = `atos/w/${tFull}.mp3`;
            if (audioCache[tFile]) files.push(tFile);
          });
        }
        // 行先
        if (audioCache[destFile]) {
          files.push(destFile);
        } else if (destArr.length === 2) {
          destArr.forEach((d, i) => {
            let dFull = d.replace(/\s/g, '').replace(/　/g, '');
            if (i === 0) {
              let f = `atos/w/${dFull}.mp3`;
              if (audioCache[f]) files.push(f);
            } else {
              let f = `atos/w/${dFull}行がまいります.mp3`;
              if (audioCache[f]) files.push(f);
            }
          });
        } else {
          if (audioCache[destSingleFile]) files.push(destSingleFile);
          if (audioCache[goFile]) files.push(goFile);
        }
      } else {
        // それ以外は従来通り
        if (audioCache[typeFile]) {
          files.push(typeFile);
        } else {
          typeArr.forEach(t => {
            let tFull = t.replace(/\s/g, '').replace(/　/g, '');
            let tFile = `atos/w/${tFull}.mp3`;
            if (audioCache[tFile]) files.push(tFile);
          });
        }
        if (destArr.length === 2) {
          // 必ず「駅名A.mp3」＋「駅名B行がまいります.mp3」を再生
          let dFullA = destArr[0].replace(/\s/g, '').replace(/　/g, '');
          let dFullB = destArr[1].replace(/\s/g, '').replace(/　/g, '');
          files.push(`atos/w/${dFullA}.mp3`);
          files.push(`atos/w/${dFullB}行がまいります.mp3`);
        } else if (audioCache[destFile]) {
          files.push(destFile);
        }
        if (destArr.length !== 2 && !audioCache[destFile]) {
          files.push(destSingleFile);
          files.push(goFile);
        }
      }

      files.push('atos/w/危ないですから.mp3');

      // --- 最終電車放送を追加（2秒ラグ後に） ---
      let isLast = isLastTrainToday(trains2, train);
      let lastTrainFiles = [];
      if (isLast) {
        lastTrainFiles = [
          'atos/m/この電車は.mp3',
          destSingleFile,
          'atos/m/行の最終です.mp3'
        ];
      }

      let idx = 0;
      audioPlaying2 = true;
      function playCarsInfo2() {
        // 両数案内音声を再生
        const cars = train.cars || 15;
        const files = [
          'atos/w/この列車は.mp3',
          `atos/w/${cars}両です.mp3`
        ];
        let i = 0;
        function playNextCars() {
          if (i >= files.length) {
            audioPlaying2 = false;
            return;
          }
          let src = files[i];
          let audio = audioCache[src] ? audioCache[src].cloneNode() : new Audio(src);
          let advanced = false;
          audio.addEventListener('ended', () => {
            if (!advanced) {
              advanced = true;
              i++;
              playNextCars();
            }
          });
          audio.addEventListener('error', () => {
            if (!advanced) {
              advanced = true;
              i++;
              playNextCars();
            }
          });
          audio.play().catch(() => {
            if (!advanced) {
              advanced = true;
              i++;
              playNextCars();
            }
          });
        }
        playNextCars();
      }
      function playNext() {
        // 通常放送が終わったら2秒ラグ→最終放送
        if (idx === files.length && isLast && lastTrainFiles.length > 0) {
          setTimeout(() => {
            idx = -100; // 特別な値で分岐
            playNext();
          }, 2000);
          return;
        }
        // 最終放送パート
        if (idx === -100) {
          let lastIdx = 0;
          function playLast() {
            if (lastIdx >= lastTrainFiles.length) {
              // 最終放送後に2秒後両数案内
              setTimeout(playCarsInfo2, 2000);
              return;
            }
            let src = lastTrainFiles[lastIdx];
            let audio = audioCache[src] ? audioCache[src].cloneNode() : new Audio(src);
            let advanced = false;
            audio.addEventListener('ended', () => {
              if (!advanced) {
                advanced = true;
                lastIdx++;
                playLast();
              }
            });
            audio.addEventListener('error', () => {
              if (!advanced) {
                advanced = true;
                lastIdx++;
                playLast();
              }
            });
            audio.play().catch(() => {
              if (!advanced) {
                advanced = true;
                lastIdx++;
                playLast();
              }
            });
          }
          playLast();
          return;
        }
        // 通常放送パート
        if (idx >= files.length) {
          // 通常放送のみの場合も2秒後両数案内
          setTimeout(playCarsInfo2, 2000);
          return;
        }
        let src = files[idx];
        let audio = audioCache[src] ? audioCache[src].cloneNode() : new Audio(src);
        let advanced = false;
        audio.addEventListener('ended', () => {
          if (!advanced) {
            advanced = true;
            idx++;
            playNext();
          }
        });
        audio.addEventListener('error', () => {
          if (!advanced) {
            advanced = true;
            idx++;
            playNext();
          }
        });
        audio.play().catch(() => {
          if (!advanced) {
            advanced = true;
            idx++;
            playNext();
          }
        });
      }
      playNext();
    }

    function checkAndAnnounce1() {
      if (!trains1 || trains1.length === 0) return;
      const now = getNowDate();
      let nowMinutes = now.getHours() * 60 + now.getMinutes();
      if (now.getHours() < 4) nowMinutes += 1440; // ← 追加
      const nextTrain = trains1.find(t => t.time && (() => {
        const [h, m] = t.time.split(':').map(Number);
        let min = h * 60 + m;
        if (h < 4) min += 1440;
        return min >= nowMinutes;
      })());
      if (!nextTrain || !nextTrain.time) return;
      const [h, m] = nextTrain.time.split(':').map(Number);
      let trainMin = h * 60 + m;
      if (h < 4) trainMin += 1440;
      // 1分前
      if (trainMin - nowMinutes === 1) {
        if (lastAnnouncedTime1 !== nextTrain.time) {
          playAudioSequence1(nextTrain);
          lastAnnouncedTime1 = nextTrain.time;
        }
      } else if (trainMin - nowMinutes > 1) {
        lastAnnouncedTime1 = null;
      }
    }

    // --- 音声案内機能 2番線 ---
    let lastAnnouncedTime2 = null;
    let audioPlaying2 = false;


    function checkAndAnnounce2() {
      if (!trains2 || trains2.length === 0) return;
      const now = getNowDate();
      let nowMinutes = now.getHours() * 60 + now.getMinutes();
      if (now.getHours() < 4) nowMinutes += 1440; // ← 追加
      const nowSeconds = now.getSeconds();
      const nextTrain = trains2.find(t => t.time && (() => {
        const [h, m] = t.time.split(':').map(Number);
        let min = h * 60 + m;
        if (h < 4) min += 1440;
        return min >= nowMinutes;
      })());
      if (!nextTrain || !nextTrain.time) return;
      const [h, m] = nextTrain.time.split(':').map(Number);
      let trainMin = h * 60 + m;
      if (h < 4) trainMin += 1440;
      const trainTimeSec = trainMin * 60;
      const nowTimeSec = nowMinutes * 60 + nowSeconds;
      // 30秒前
      if (trainTimeSec - nowTimeSec <= 30 && trainTimeSec - nowTimeSec > 0) {
        if (lastAnnouncedTime2 !== nextTrain.time) {
          playAudioSequence2(nextTrain);
          lastAnnouncedTime2 = nextTrain.time;
        }
      } else if (trainTimeSec - nowTimeSec > 30) {
        lastAnnouncedTime2 = null;
      }
    }

    function isLastTrainToday(trains, train) {
      // その日の4:00～翌4:00までの同じ行先の列車のうち、最も遅いものか判定
      if (!train.time || !train.dest) return false;
      // その日の始まり（4:00）と終わり（翌4:00）の分数
      const [h, m] = train.time.split(':').map(Number);
      let trainMin = h * 60 + m;
      if (h < 4) trainMin += 1440;

      // 同じ行先の列車を抽出
      const sameDestTrains = trains.filter(t => t.dest === train.dest && t.time).map(t => {
        const [hh, mm] = t.time.split(':').map(Number);
        let min = hh * 60 + mm;
        if (hh < 4) min += 1440;
        return { ...t, min };
      });
      if (sameDestTrains.length === 0) return false;
      // 最大時刻を持つ列車が自分自身なら最終
      const maxTrain = sameDestTrains.reduce((a, b) => (a.min > b.min ? a : b));
      return maxTrain.time === train.time;
    }

    // 初回ロード
    loadTimetable1();
    loadTimetable2();
    // 30秒ごとに自動更新
    setInterval(() => {
      loadTimetable1();
      loadTimetable2();
    }, 30000);
    // 画面表示も0.1秒ごとに更新（時刻切替用）
    setInterval(render, 100);
    // 1番線音声案内チェック（0.1秒ごと）
    setInterval(checkAndAnnounce1, 100);
    setInterval(checkAndAnnounce2, 100);

  </script>
