<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>JR東日本 ATOS風 発車標（再現）</title>
  <style>
    :root{
      --bg:#0b0b0b;
      --muted:#9aa3a8;
      --jb-yellow:#ffd34d;
    }
    body{
      margin:0; font-family: "Yu Gothic UI", sans-serif; background:#081018; display:flex; align-items:center; justify-content:center; padding:24px; color:#fff;
    }
    .atos{
      width:920px; background:#1a1a1a; border-radius:8px; box-shadow:0 8px 30px rgba(0,0,0,.7); display:flex; overflow:hidden; border:1px solid rgba(255,255,255,0.03);
    }
    .slot-number{
      width:140px; background:#1f1f1f; display:flex; align-items:center; justify-content:center;
    }
    .slot-number .num{
      font-size:160px; font-weight:700; color:#e8e8e8; text-shadow:0 2px 0 rgba(0,0,0,.6);
    }
    .display{
      flex:1; display:flex; flex-direction:column; padding:10px 16px; box-sizing:border-box;
    }
    .topbar{
      display:flex; align-items:center; gap:10px; padding:6px 12px; background:#2b2b2b; border-radius:4px; margin-bottom:8px;
    }
    .jb-badge{
      width:40px; height:32px; border-radius:4px; background:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; color:#0b0b0b; font-size:18px;
    }
    .line-name{color:#fff; font-weight:700; font-size:20px; line-height:1.2;}
    .line-sub{color:var(--muted); font-size:16px; line-height:1.2;}
    .rows{flex:1; display:flex; flex-direction:column; gap:4px;}
    .row{
      display:grid; grid-template-columns: 160px 140px 1fr; align-items:center; background:#0c0c0c; border-radius:4px; padding:4px 8px; min-height:80px;
    }
    .type{font-size:48px; font-weight:700; color:#fff; text-align:left;}
    .time{font-size:64px; font-weight:700; text-align:center;}
    .platform{font-size:52px; text-align:left; color:#fff; display:flex; gap:8px; justify-content:flex-start; align-items:center;}
    .badge-circle{width:38px; height:26px; border-radius:4px; display:none; align-items:center; justify-content:center; font-weight:700; font-size:14px;}
    .badge-jb{background:var(--jb-yellow); color:#111;}
  </style>
</head>
<body>
  <div class="atos">
    <div class="slot-number">
      <div class="num">2</div>
    </div>
    <div class="display">
      <div class="topbar">
        <div class="jb-badge"><span>JB</span></div>
        <div>
          <div class="line-name">総武線</div>
          <div class="line-sub">小岩・市川・西船橋・船橋・千葉方面</div>
        </div>
      </div>
      <div class="rows" id="rows"></div>
    </div>
  </div>
  <script>
    const data = [
      {type:'各駅停車', time:'13:50', dest:'千葉'},
      {type:'各駅停車', time:'13:55', dest:'津田沼'}
    ];
    const rowsEl = document.getElementById('rows');
    function buildRow(datum){
      const r = document.createElement('div');
      r.className = 'row';
      const type = document.createElement('div'); type.className='type'; type.textContent = datum.type;
      const tm = document.createElement('div'); tm.className='time'; tm.textContent = datum.time;
      const pl = document.createElement('div'); pl.className='platform';
      const dst = document.createElement('div'); dst.textContent = datum.dest; dst.style.fontWeight='700';
      pl.appendChild(dst);
      r.appendChild(type); r.appendChild(tm); r.appendChild(pl);
      return r;
    }
    function render(){
      rowsEl.innerHTML = '';
      data.forEach(d=>rowsEl.appendChild(buildRow(d)));
    }
    render();
  </script>
</body>
</html>
