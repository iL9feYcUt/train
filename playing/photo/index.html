<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoJSON Map Overlay</title>

    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            background: #ffffff;
            color: rgb(0, 0, 0);
            font-family: 'Frutiger', 'Noto Sans JP', sans-serif;
        }

        .controls {
            padding: 12px;
        }

        /* UI panel */
        .panel {
            position: fixed;
            right: 16px;
            bottom: 16px;
            background: rgba(16,16,16,0.6);
            color: #fff;
            padding: 12px;
            border-radius: 10px;
            backdrop-filter: blur(6px);
            box-shadow: 0 6px 18px rgba(0,0,0,0.35);
            font-size: 12px;
            max-width: 320px;
            z-index: 1000;
        }

        /* テキスト系フォームにのみフォントサイズを適用 */
        .panel input[type="text"], .panel input[type="range"], .panel select, .panel textarea { font-size: 16px; }

        /* 折りたたみ用クラス */
        .panel.closed {
            transform: translateX(120%);
            opacity: 0;
            pointer-events: none;
            transition: transform 240ms ease, opacity 240ms ease;
        }

        /* パネル開閉ボタン */
        #panelToggleBtn {
            position: fixed;
            right: 16px;
            bottom: 16px;
            width: 44px;
            height: 44px;
            border-radius: 10px;
            background: rgba(0,0,0,0.7);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1100;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(0,0,0,0.35);
            border: none;
        }

        #panelToggleBtn.small { width:36px; height:36px; border-radius:8px; }

        .panel label { display: block; margin: 6px 0 4px; font-weight: 600; }
        /* フォーム要素は iOS Safari での重複レンダリングを回避するためシステムフォントを使用 */
        .panel input[type="text"], .panel select, .panel textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 6px;
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.12);
            background: rgba(255,255,255,0.03);
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial;
            -webkit-font-smoothing: antialiased;
        }
        /* チェックボックスは幅を自動にして行内表示にする */
        .panel input[type="checkbox"] { width: auto; display: inline-block; margin-right:6px; }
        .panel .row { display:flex; gap:8px; align-items:center; }
        .panel input[type="range"] { width: 100%; }
        .panel .small { font-size: 12px; color: rgba(255,255,255,0.8); }
        .panel select, .panel input[type="file"] {
            font-size: 12px;
        }

        canvas {
            width: 100%;
            display: block;
        }
    </style>
</head>

<body>

    <div class="panel" role="region" aria-label="生成パネル">
        <label>写真ファイル</label>
        <input type="file" id="file" accept="image/*">

        <label>路線</label>
        <input type="text" id="line" placeholder="例: 我孫子支線">

        <label>出発 / 到着</label>
        <div class="row">
            <input type="text" id="from" placeholder="出発">
            <input type="text" id="to" placeholder="到着">
        </div>

        <label class="row"><input type="checkbox" id="mapToggle" checked> <span class="small">地図表示</span></label>

        <label>ズーム（撮影地中心） <span id="zoomLabel" class="small">1.0</span></label>
        <input type="range" id="zoomScale" min="0.4" max="2" step="0.1" value="1">

        <label>地図不透明度 <span id="opacityLabel" class="small">0.9</span></label>
        <input type="range" id="watermarkOpacity" min="0.1" max="1" step="0.05" value="0.9">

        <label>文字縮小（バランス） <span id="textShrinkLabel" class="small">0.90</span></label>
        <input type="range" id="textShrink" min="0.70" max="1.05" step="0.01" value="0.9">
        <label>地図表示倍率 <span id="mapScaleLabel" class="small">1.00</span></label>
        <input type="range" id="mapScale" min="0.5" max="2.0" step="0.01" value="1.0">
        <label>保存品質 <span id="qualityLabel" class="small">0.92</span></label>
        <input type="range" id="saveQuality" min="0.5" max="1.0" step="0.01" value="0.92">

        <label>テキスト位置</label>
        <select id="textPosition">
            <option value="bottom-right" selected>右下</option>
            <option value="top-right">右上</option>
            <option value="top-left">左上</option>
            <option value="bottom-left">左下</option>
        </select>

        <label>地図位置</label>
        <select id="mapPosition">
            <option value="bottom-left" selected>左下</option>
            <option value="bottom-right">右下</option>
            <option value="top-right">右上</option>
            <option value="top-left">左上</option>
        </select>

        

        <div style="margin-top:8px; display:flex; gap:8px;">
            <button onclick="generate()">生成</button>
            <button onclick="save()">保存</button>
        </div>
    </div>

    <canvas id="canvas"></canvas>

    <button id="panelToggleBtn" aria-expanded="true" title="表示/非表示切替">◀</button>

    <!-- ローディングオーバーレイ -->
    <div id="loaderOverlay" style="display:flex;position:fixed;inset:0;background:#ffffff;color:#000000;align-items:center;justify-content:center;z-index:2000;">
        <div style="text-align:center;">
            <svg id="loaderSvg" width="140" height="140" viewBox="0 0 100 100" style="transform:rotate(-90deg);">
                <circle cx="50" cy="50" r="45" stroke="rgba(255,255,255,0.15)" stroke-width="8" fill="none"></circle>
                <circle id="loaderProgress" cx="50" cy="50" r="45" stroke="#4ee" stroke-width="8" fill="none" stroke-linecap="round" stroke-dasharray="283" stroke-dashoffset="283"></circle>
            </svg>
            <div id="loaderPercent" style="margin-top:12px;font-size:18px;">0%</div>
            <div id="loaderMsg" style="margin-top:6px;font-size:12px;opacity:0.9;">読み込み中…</div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/exif-js"></script>

    <script>
        // ===== ローダー（フォント + GeoJSON をストリーム読み込みして進捗を表示） =====
        async function loadWithProgress(url, onProgress, asText = false) {
            const res = await fetch(url);
            if (!res.ok) throw new Error('Failed to fetch ' + url);

            const contentLength = res.headers.get('Content-Length') ? parseInt(res.headers.get('Content-Length')) : null;
            const reader = res.body.getReader();
            const chunks = [];
            let received = 0;

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                chunks.push(value);
                received += value.length;
                if (contentLength) onProgress(received / contentLength);
                else onProgress(Math.min(0.99, (received / (received + 10000)))); // おおよその進捗
            }

            const blob = new Blob(chunks);
            if (asText) {
                const txt = await blob.text();
                return txt;
            }
            return blob;
        }

        async function loadFontTtfWithProgress(url, onProgress) {
            const blob = await loadWithProgress(url, onProgress, false);
            const blobUrl = URL.createObjectURL(blob);
            const ff = new FontFace('Frutiger', `url(${blobUrl})`);
            await ff.load();
            document.fonts.add(ff);
            URL.revokeObjectURL(blobUrl);
            onProgress(1);
            return ff;
        }

        async function loadGeojsonWithProgress(url, onProgress) {
            const txt = await loadWithProgress(url, onProgress, true);
            try { return JSON.parse(txt); } catch (e) { throw e; }
        }

        function updateLoader(percent, message) {
            const circle = document.getElementById('loaderProgress');
            const pct = Math.max(0, Math.min(100, Math.round(percent * 100)));
            const circumference = 2 * Math.PI * 45; // r=45
            const offset = Math.round(circumference * (1 - pct / 100));
            if (circle) circle.style.strokeDashoffset = String(offset);
            const pctEl = document.getElementById('loaderPercent');
            if (pctEl) pctEl.textContent = pct + '%';
            const msgEl = document.getElementById('loaderMsg');
            if (msgEl && message) msgEl.textContent = message;
        }

        async function startupLoader() {
            const totalWeight = 2; // font + geojson
            let fontProgress = 0, geoProgress = 0;

            const updateAll = () => {
                const combined = (fontProgress + geoProgress) / totalWeight;
                updateLoader(combined, 'リソースを読み込んでいます…');
            };

            try {
                const fontPromise = loadFontTtfWithProgress('Frutiger.ttf', p => { fontProgress = p; updateAll(); });
                const geoPromise = loadGeojsonWithProgress('map.geojson', p => { geoProgress = p; updateAll(); });

                const [ff, gj] = await Promise.all([fontPromise, geoPromise]);
                geojson = gj;
                updateLoader(1, '読み込み完了');
            } catch (e) {
                updateLoader(1, '読み込み完了（エラーが発生しました）');
                console.error('Loader error', e);
            } finally {
                // 少し待ってからフェードアウトし、初回描画を実行
                const overlay = document.getElementById('loaderOverlay');
                if (overlay) {
                    overlay.style.transition = 'opacity 300ms ease';
                    overlay.style.opacity = '0';
                    setTimeout(() => { overlay.style.display = 'none'; try { generate(); } catch (e) {} }, 350);
                } else {
                    try { generate(); } catch (e) {}
                }
            }
        }

        // 起動時にローダーを開始
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', startupLoader);
        } else {
            startupLoader();
        }

        // UI 更新ラベル
        (function setupUiLabels(){
            const zoom = document.getElementById('zoomScale');
            const zoomLabel = document.getElementById('zoomLabel');
            const op = document.getElementById('watermarkOpacity');
            const opLabel = document.getElementById('opacityLabel');
                if (zoom && zoomLabel) {
                    zoom.addEventListener('input', () => { zoomLabel.textContent = zoom.value; });
                    zoomLabel.textContent = zoom.value;
                }
                if (op && opLabel) {
                    op.addEventListener('input', () => { opLabel.textContent = op.value; });
                    opLabel.textContent = op.value;
                }

                // textShrink スライダーの初期化
                const textShrinkEl = document.getElementById('textShrink');
                const textShrinkLabel = document.getElementById('textShrinkLabel');
                if (textShrinkEl && textShrinkLabel) {
                    textShrinkEl.addEventListener('input', () => { textShrinkLabel.textContent = parseFloat(textShrinkEl.value).toFixed(2); });
                    textShrinkLabel.textContent = parseFloat(textShrinkEl.value).toFixed(2);
                }

                // mapScale スライダー
                const mapScaleEl = document.getElementById('mapScale');
                const mapScaleLabel = document.getElementById('mapScaleLabel');
                if (mapScaleEl && mapScaleLabel) {
                    mapScaleEl.addEventListener('input', () => { mapScaleLabel.textContent = parseFloat(mapScaleEl.value).toFixed(2); });
                    mapScaleLabel.textContent = parseFloat(mapScaleEl.value).toFixed(2);
                }

                        // 保存品質スライダー
                        const saveQualityEl = document.getElementById('saveQuality');
                        const qualityLabel = document.getElementById('qualityLabel');
                        if (saveQualityEl && qualityLabel) {
                            saveQualityEl.addEventListener('input', () => { qualityLabel.textContent = parseFloat(saveQualityEl.value).toFixed(2); });
                            qualityLabel.textContent = parseFloat(saveQualityEl.value).toFixed(2);
                        }

                        // パネル開閉ボタンの初期化
                        const panelBtn = document.getElementById('panelToggleBtn');
                        const panelEl = document.querySelector('.panel');
                        if (panelBtn && panelEl) {
                            panelBtn.addEventListener('click', () => {
                                const closed = panelEl.classList.toggle('closed');
                                panelBtn.setAttribute('aria-expanded', String(!closed));
                                panelBtn.textContent = closed ? '▶' : '◀';
                            });
                        }
        })();

        let img = new Image();
        let lat, lon, date;
        let place = "";
        let geojson;
        let origImageArrayBuffer = null; // 元画像の ArrayBuffer（EXIF 抽出用）
        let shareInProgress = false; // navigator.share の多重呼び出し防止フラグ

        // GeoJSON / フォントは起動時にローダーで読み込む

        // ===== 画像読み込み =====
        document.getElementById("file").onchange = e => {
            const file = e.target.files[0];
            if (!file) return;

            // 元画像の ArrayBuffer を保持（EXIF を後で再注入するため）
            file.arrayBuffer().then(buf => { origImageArrayBuffer = buf; }).catch(() => { origImageArrayBuffer = null; });

            const reader = new FileReader();

            reader.onload = ev => {
                img.src = ev.target.result;

                EXIF.getData(file, function () {
                    const latRaw = EXIF.getTag(this, "GPSLatitude");
                    const lonRaw = EXIF.getTag(this, "GPSLongitude");
                    date = EXIF.getTag(this, "DateTimeOriginal");

                    function conv(d) { return d[0] + d[1] / 60 + d[2] / 3600; }

                    if (latRaw && lonRaw) {
                        lat = conv(latRaw);
                        lon = conv(lonRaw);

                        // 位置情報が取れたら逆ジオコーディングして地名を取得
                        reverseGeocode(lat, lon).then(name => {
                            place = name || "";
                        }).catch(() => { place = ""; });
                    }
                });
            };

            reader.readAsDataURL(file);
        };

        // === EXIF 抽出/挿入ユーティリティ ===
        function extractApp1Segment(arrayBuffer) {
            if (!arrayBuffer) return null;
            const view = new DataView(arrayBuffer);
            // 必要最少長チェック
            if (view.byteLength < 4) return null;
            // SOI
            if (view.getUint8(0) !== 0xFF || view.getUint8(1) !== 0xD8) return null;

            let offset = 2;
            while (offset + 4 < view.byteLength) {
                if (view.getUint8(offset) !== 0xFF) return null;
                const marker = view.getUint8(offset + 1);
                // Start of Scan -> no more APP segments
                if (marker === 0xDA) break;
                const len = view.getUint16(offset + 2, false); // big-endian
                if (marker === 0xE1) {
                    // return the APP1 segment including marker and length
                    const segStart = offset;
                    const segEnd = offset + 2 + len;
                    return new Uint8Array(arrayBuffer.slice(segStart, segEnd));
                }
                offset += 2 + len;
            }
            return null;
        }

        async function insertApp1ToJpeg(app1Uint8, jpegArrayBuffer) {
            if (!app1Uint8) return new Blob([jpegArrayBuffer], { type: 'image/jpeg' });
            const jpeg = new Uint8Array(jpegArrayBuffer);
            if (jpeg.length < 2 || jpeg[0] !== 0xFF || jpeg[1] !== 0xD8) return new Blob([jpegArrayBuffer], { type: 'image/jpeg' });

            const soi = jpeg.subarray(0, 2);
            const rest = jpeg.subarray(2);
            const out = new Uint8Array(soi.length + app1Uint8.length + rest.length);
            out.set(soi, 0);
            out.set(app1Uint8, soi.length);
            out.set(rest, soi.length + app1Uint8.length);
            return new Blob([out], { type: 'image/jpeg' });
        }

        // ===== 緯度経度 → 座標変換 (矩形幅/高さに対応) =====
        function project(lon, lat, bounds, width, height) {
            const lonSpan = (bounds.maxLon - bounds.minLon) || 0.0001;
            const latSpan = (bounds.maxLat - bounds.minLat) || 0.0001;

            const x = (lon - bounds.minLon) / lonSpan;
            const y = (lat - bounds.minLat) / latSpan;

            return [
                x * width,
                height - (y * height) // 上下反転
            ];
        }

        // ===== 範囲計算 =====
        function getBounds(geo) {
            let minLat = Infinity, maxLat = -Infinity, minLon = Infinity, maxLon = -Infinity;

            geo.features.forEach(f => {
                forEachCoordinate(f.geometry, (pt) => {
                    const lon = pt[0], lat = pt[1];
                    minLat = Math.min(minLat, lat);
                    maxLat = Math.max(maxLat, lat);
                    minLon = Math.min(minLon, lon);
                    maxLon = Math.max(maxLon, lon);
                });
            });

            // フォールバック: GeoJSON に座標が無い場合は現在地周辺を返す
            if (minLat === Infinity) {
                if (typeof lat === 'number' && typeof lon === 'number') {
                    return { minLat: lat - 0.01, maxLat: lat + 0.01, minLon: lon - 0.01, maxLon: lon + 0.01 };
                }
                return { minLat: 0, maxLat: 1, minLon: 0, maxLon: 1 };
            }

            return { minLat, maxLat, minLon, maxLon };
        }

        // ビュー用の境界を計算（撮影地点があればそれを中心に拡大率を調整）
        function computeViewBounds(bounds, opts = {}) {
            const { centerLon: cLon, centerLat: cLat, zoomScale = 1 } = opts;

            const lonSpan = Math.max(0.0001, bounds.maxLon - bounds.minLon);
            const latSpan = Math.max(0.0001, bounds.maxLat - bounds.minLat);

            // 撮影地点があればそれを中心に、なければ geojson 中心を使う
            const centerLon = (typeof cLon === 'number') ? cLon : (bounds.minLon + bounds.maxLon) / 2;
            const centerLat = (typeof cLat === 'number') ? cLat : (bounds.minLat + bounds.maxLat) / 2;

            // ズーム係数: zoomScale が大きいほどズーム（表示幅が小さい）
            const autoFactor = 0.005; // 基準倍率
            const minSpan = 0.0015; // 最小表示幅 (~150m)

            const targetLonSpan = Math.max(lonSpan * autoFactor / zoomScale, minSpan);
            const targetLatSpan = Math.max(latSpan * autoFactor / zoomScale, minSpan);

            return {
                minLon: centerLon - targetLonSpan / 2,
                maxLon: centerLon + targetLonSpan / 2,
                minLat: centerLat - targetLatSpan / 2,
                maxLat: centerLat + targetLatSpan / 2
            };
        }

        // ===== 地図描画 =====
        // 汎用的な座標イテレータ（どんなジオメトリ構造でも各 [lon, lat] をコールバックに渡す）
        function forEachCoordinate(geometry, cb) {
            const type = geometry.type;
            const c = geometry.coordinates;

            function visit(arr) {
                if (!Array.isArray(arr)) return;
                if (typeof arr[0] === 'number' && typeof arr[1] === 'number') {
                    cb(arr);
                    return;
                }
                for (let i = 0; i < arr.length; i++) visit(arr[i]);
            }

            if (type === 'Point') cb(c);
            else visit(c);
        }

        // ジオメトリから描画用の連続線（配列の配列）を抽出する
        function getLinesFromGeometry(geometry) {
            const type = geometry.type;
            const c = geometry.coordinates;
            const lines = [];

            function pushLine(arr) {
                if (!Array.isArray(arr)) return;
                // arr が [lon, lat] の配列か、配列の配列か判定
                if (typeof arr[0] === 'number' && typeof arr[1] === 'number') {
                    // 単一点
                    lines.push([arr]);
                    return;
                }
                // arr は配列の配列（線列またはリング）
                for (let i = 0; i < arr.length; i++) {
                    const item = arr[i];
                    if (typeof item[0] === 'number') {
                        // これは座標列
                        lines.push(arr);
                        break;
                    } else {
                        // ネストが深い（MultiPolygon 等）
                        pushLine(item);
                    }
                }
            }

            if (type === 'Point') lines.push([c]);
            else if (type === 'LineString') lines.push(c);
            else if (type === 'Polygon') pushLine(c);
            else if (type === 'MultiLineString') pushLine(c);
            else if (type === 'MultiPolygon') pushLine(c);
            else pushLine(c);

            return lines;
        }

        // drawGeoJSON: viewBounds を受け取り、描画時に座標簡略化をする
        function drawGeoJSON(ctx, geo, width, height, viewBounds) {
            const bounds = viewBounds || getBounds(geo);

            ctx.strokeStyle = "rgba(255,255,255,0.95)";
            // 線を少し太めにする
            ctx.lineWidth = Math.max(1, Math.round(Math.min(width, height) / 160));
            ctx.globalAlpha = 0.95;

            const simplifyPx = Math.max(1, Math.round(Math.min(width, height) / 220));

            // 陸地を薄い白で塗りつぶす（Polygon / MultiPolygon）
            ctx.save();
            ctx.fillStyle = "rgba(255,255,255,0.10)"; // 薄い白
            geo.features.forEach(f => {
                const type = f.geometry.type;
                const c = f.geometry.coordinates;

                function drawRing(ring) {
                    if (!Array.isArray(ring) || ring.length === 0) return;
                    ctx.beginPath();
                    for (let i = 0; i < ring.length; i++) {
                        const pt = ring[i];
                        const lon = pt[0], latPt = pt[1];
                        const [x, y] = project(lon, latPt, bounds, width, height);
                        if (i === 0) ctx.moveTo(x, y);
                        else ctx.lineTo(x, y);
                    }
                    ctx.closePath();
                    ctx.fill();
                }

                if (type === 'Polygon') {
                    // polygon: array of linear rings
                    for (let ri = 0; ri < c.length; ri++) drawRing(c[ri]);
                } else if (type === 'MultiPolygon') {
                    for (let pi = 0; pi < c.length; pi++) {
                        const poly = c[pi];
                        for (let ri = 0; ri < poly.length; ri++) drawRing(poly[ri]);
                    }
                }
            });
            ctx.restore();

            geo.features.forEach(f => {
                const lines = getLinesFromGeometry(f.geometry);
                lines.forEach(line => {
                    if (!Array.isArray(line) || line.length === 0) return;
                    ctx.beginPath();
                    let first = true;
                    let lastX = null, lastY = null;

                    for (let i = 0; i < line.length; i++) {
                        const pt = line[i];
                        const lon = pt[0], latPt = pt[1];
                        const [x, y] = project(lon, latPt, bounds, width, height);

                        if (first) {
                            ctx.moveTo(x, y);
                            first = false;
                            lastX = x; lastY = y;
                        } else {
                            if (Math.hypot(x - lastX, y - lastY) < simplifyPx) continue;
                            ctx.lineTo(x, y);
                            lastX = x; lastY = y;
                        }
                    }

                    ctx.stroke();
                });
            });

            // 現在地ポイント（viewBounds 座標系での投影） — スタイリッシュ表示
            if (typeof lat === 'number' && typeof lon === 'number') {
                const [x, y] = project(lon, lat, bounds, width, height);

                // マーカーを大きめに調整
                const baseR = Math.max(14, Math.round(Math.min(width, height) / 60));

                // ハロー（外側の薄いリング）
                ctx.save();
                ctx.beginPath();
                ctx.fillStyle = 'rgba(0,191,255,0.12)';
                ctx.arc(x, y, Math.round(baseR * 2.2), 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                // 中央の主要円（ラジアルグラデーション）
                const g = ctx.createRadialGradient(x, y, Math.max(1, Math.round(baseR * 0.2)), x, y, baseR);
                g.addColorStop(0, '#bff6ff');
                g.addColorStop(0.5, '#00bfff');
                g.addColorStop(1, '#0077aa');

                ctx.beginPath();
                ctx.fillStyle = g;
                ctx.arc(x, y, baseR, 0, Math.PI * 2);
                ctx.fill();

                // 白い縁取り
                ctx.lineWidth = Math.max(2, Math.round(baseR / 6));
                ctx.strokeStyle = 'rgba(255,255,255,0.95)';
                ctx.stroke();

                // 中心のハイライト点
                ctx.beginPath();
                ctx.fillStyle = 'rgba(255,255,255,0.95)';
                ctx.arc(x, y, Math.max(2, Math.round(baseR / 4)), 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.globalAlpha = 1.0;
        }

        // ===== メイン生成 =====
        async function generate() {
            // 画像が未選択なら描画しない
            if (!img.src) return;
            try {
                await img.decode();
            } catch (e) {
                return;
            }

            const canvas = document.getElementById("canvas");
            const ctx = canvas.getContext("2d");

            canvas.width = img.width;
            canvas.height = img.height;

            ctx.drawImage(img, 0, 0);

            const padding = Math.round(Math.max(40, canvas.width * 0.05));
            const size = Math.round(260 * 2); // specified: 表示領域を2倍

            // ===== 地図 =====
            if (document.getElementById("mapToggle").checked && geojson) {
                const mapCanvas = document.createElement("canvas");

                // 拡大: さらに2倍（前は260*2=520 を想定していたため、ここではさらに2倍）
                const mapBase = 520 * 2; // 1040

                // 境界から縦横比を決めて矩形にする
                const bounds = getBounds(geojson);
                const lonSpan = Math.max(0.0001, bounds.maxLon - bounds.minLon);
                const latSpan = Math.max(0.0001, bounds.maxLat - bounds.minLat);

                // 中心は撮影地点があればそこを使う
                const usePhotoCenter = (typeof lat === 'number' && typeof lon === 'number');
                const centerLon = usePhotoCenter ? lon : (bounds.minLon + bounds.maxLon) / 2;
                const centerLat = usePhotoCenter ? lat : (bounds.minLat + bounds.maxLat) / 2;

                // UIからズームスケールとウォーターマーク不透明度を取得
                    const zoomScale = parseFloat(document.getElementById('zoomScale')?.value || 1);
                    const watermarkOpacity = parseFloat(document.getElementById('watermarkOpacity')?.value || 0.9);
                        const mapScaleUi = parseFloat(document.getElementById('mapScale')?.value || 1.0);

                // ビュー枠を撮影地点中心で小さめに取る
                // 常に撮影地点が存在すれば中心に使い、なければ自動中心を使う
                const viewBounds = computeViewBounds(bounds, { centerLon: centerLon, centerLat: centerLat, zoomScale });

                // ユーザ指定: 横幅を2倍、縦幅を3倍に拡大
                // base width (kept proportional) then apply UI scale
                let mapWidth = Math.round(mapBase * 2 * mapScaleUi);

                // 縦だけ表示領域を拡張（地図を縦長に『伸ばす』のではなく、表示する緯度範囲を広げる）
                const verticalDisplayScale = 1.3; // 表示上の縦伸長率（要求: 縦だけ約1.3倍）

                // 経度は緯度によって地球上の距離が変わるため、中心緯度で補正して縦横比を正しく計算する
                const vbLatSpanRaw = Math.max(0.0001, viewBounds.maxLat - viewBounds.minLat);
                const vbLonSpan = Math.max(0.0001, viewBounds.maxLon - viewBounds.minLon);
                const centerLatForCorrection = (viewBounds.minLat + viewBounds.maxLat) / 2;
                const latCorrection = Math.cos(centerLatForCorrection * Math.PI / 180) || 1; // 緯度で経度の実距離を補正
                const adjustedLonSpan = Math.max(0.0001, vbLonSpan * latCorrection);

                // 表示用の緯度スパンを拡張して、描画時に縦により広い範囲を表示する
                const vbLatSpan = vbLatSpanRaw * verticalDisplayScale;

                // mapHeight を mapWidth に対する実アスペクト比で算出（幅に合わせ、高さはアスペクト比を保つ）
                const aspect = vbLatSpan / adjustedLonSpan;
                let mapHeight = Math.max(1, Math.round(mapWidth * aspect));

                // 調整した viewBounds を作成して、地図描画に渡す（縦表示領域拡張分を含む）
                const viewCenterLat = (viewBounds.minLat + viewBounds.maxLat) / 2;
                const adjustedViewBounds = {
                    minLon: viewBounds.minLon,
                    maxLon: viewBounds.maxLon,
                    minLat: viewCenterLat - vbLatSpan / 2,
                    maxLat: viewCenterLat + vbLatSpan / 2
                };

                // 極端な比率を抑える
                const minRatio = 0.5, maxRatio = 2.5;
                const ratio = mapHeight / mapWidth;
                if (ratio < minRatio) mapHeight = Math.round(mapWidth * minRatio);
                if (ratio > maxRatio) mapHeight = Math.round(mapWidth * maxRatio);

                mapCanvas.width = mapWidth;
                mapCanvas.height = mapHeight;

                const mctx = mapCanvas.getContext("2d");

                // 透明背景で白線のウォーターマーク風
                mctx.clearRect(0, 0, mapWidth, mapHeight);
                mctx.globalCompositeOperation = 'source-over';

                drawGeoJSON(mctx, geojson, mapWidth, mapHeight, adjustedViewBounds);

                // 矩形表示（直接描画） — main canvas 側で半透明で表示してウォーターマーク化
                const mapPos = document.getElementById('mapPosition')?.value || 'bottom-left';
                const destX = mapPos.endsWith('right') ? (canvas.width - padding - mapWidth) : padding;
                const destY = mapPos.startsWith('top') ? padding : (canvas.height - padding - mapHeight);

                ctx.save();
                ctx.globalAlpha = watermarkOpacity;
                ctx.drawImage(mapCanvas, destX, destY, mapWidth, mapHeight);
                ctx.globalAlpha = 1.0;
                ctx.restore();

                // 枠（矩形）
                ctx.beginPath();
                ctx.rect(destX, destY, mapWidth, mapHeight);
                ctx.strokeStyle = "rgba(255,255,255,0.95)";
                ctx.lineWidth = Math.max(2, Math.round(Math.min(mapWidth, mapHeight) / 120));
                ctx.stroke();
            }

            // ===== テキスト =====
            // テキスト位置の取得
            const textPos = document.getElementById('textPosition')?.value || 'bottom-right';
            // 初期 baseX / baseY を位置に応じて決定（あとで高さ調整）
            const baseXRight = canvas.width - Math.round(Math.max(60, canvas.width * 0.06));
            const baseXLeft = Math.round(Math.max(60, canvas.width * 0.06));
            let baseX = textPos.endsWith('right') ? baseXRight : baseXLeft;
            let baseY = textPos.startsWith('bottom') ? (canvas.height - Math.round(Math.max(160, canvas.height * 0.18))) : Math.round(Math.max(60, canvas.height * 0.06));

            ctx.shadowColor = "rgba(0,0,0,0.7)";
            ctx.shadowBlur = Math.max(6, Math.round(canvas.width / 300));

            // フォント読み込みを待ってからテキスト描画（英数字に Frutiger を適用するため）
            try {
                await document.fonts.load('16px "Frutiger"');
                await document.fonts.ready;
            } catch (e) {
                // フォールバック: 無視して描画を続ける
            }

            // フォントサイズを画像サイズに依存しない比率で設定（1回だけ計算）
            const refWidth = 1200; // 基準幅
            const scale = canvas.width / refWidth;
            // 全テキストを均一に少し小さくしてバランスを保つ（0.0-1.0、1.0 が元サイズ）
            const textShrink = parseFloat(document.getElementById('textShrink')?.value || 0.9);

            // titleSize と routeSize を入れ替える（行間のバランスは既存の余白で保つ）
            const titleSize = Math.max(18, Math.round(60 * scale * textShrink));
            const routeSize = Math.max(14, Math.round(72 * scale * textShrink));
            const placeSize = Math.max(12, Math.round(36 * scale * textShrink));
            const dateSize = Math.max(10, Math.round(32 * scale * textShrink));

            // テキストブロックの高さを計算して下にはみ出さないように上にずらす
            const totalHeight = titleSize + routeSize + placeSize + dateSize + 40; // 総余白

            if (baseY + totalHeight > canvas.height - Math.round(Math.max(20, canvas.height * 0.02))) {
                baseY = canvas.height - Math.round(Math.max(20, canvas.height * 0.02)) - totalHeight;
            }

            // 行間のバランス維持: 各行間は隣接するフォントサイズの大きい方に基づいて計算
            const gapTitleRoute = Math.round(20 + Math.max(titleSize, routeSize) * 1.0);
            // route と place の間隔を狭く調整
            const gapRoutePlace = Math.round(8 + Math.max(routeSize, placeSize) * 0.7);
            const gapPlaceDate = Math.round(12 + Math.max(placeSize, dateSize) * 1.0);

            // 文字色（常に白寄りで見やすく）
            ctx.fillStyle = "rgba(255,255,255,0.95)";

            // テキスト揃え（左/右）を選択に応じて設定
            ctx.textAlign = textPos.endsWith('right') ? 'right' : 'left';

            ctx.font = `bold ${titleSize}px 'Frutiger', 'Noto Sans JP', sans-serif`;
            ctx.fillText(document.getElementById("line").value || "", baseX, baseY);

            baseY += gapTitleRoute;
            ctx.font = `600 ${routeSize}px 'Frutiger', 'Noto Sans JP', sans-serif`;
            const fromVal = document.getElementById("from").value || "";
            const toVal = document.getElementById("to").value || "";
            ctx.fillText(`${fromVal} → ${toVal}`, baseX, baseY);

            baseY += gapRoutePlace;
            ctx.font = `${placeSize}px 'Frutiger', 'Noto Sans JP', sans-serif`;
            ctx.fillStyle = "rgba(255,255,255,0.85)";
            ctx.fillText(place, baseX, baseY);

            baseY += gapPlaceDate;
            if (date) {
                ctx.font = `${dateSize}px 'Frutiger', 'Noto Sans JP', sans-serif`;
                ctx.fillText(formatExifDate(date), baseX, baseY);
            }
        }

        // ===== 保存 =====
        // デバウンスと自動再描画: コントロール変更でリアルタイム更新
        function debounce(fn, wait = 150) {
            let t;
            return function (...args) {
                clearTimeout(t);
                t = setTimeout(() => { try { fn.apply(this, args); } catch (e) {} }, wait);
            };
        }

        (function attachAutoUpdate() {
            const ids = ['line','from','to','zoomScale','watermarkOpacity','textShrink','mapScale','textPosition','mapPosition','mapToggle'];
            const trigger = debounce(() => { generate().catch(() => {}); }, 160);

            ids.forEach(id => {
                const el = document.getElementById(id);
                if (!el) return;
                const ev = (el.tagName === 'SELECT' || el.type === 'range' || el.type === 'checkbox') ? 'input' : 'input';
                el.addEventListener(ev, trigger);
                if (el.tagName === 'INPUT' && el.type === 'text') el.addEventListener('change', trigger);
            });

            const fileEl = document.getElementById('file');
            if (fileEl) fileEl.addEventListener('change', () => { setTimeout(() => generate().catch(() => {}), 200); });

            window.addEventListener('resize', trigger);
        })();
        async function save() {
            const canvas = document.getElementById("canvas");
            const quality = parseFloat(document.getElementById('saveQuality')?.value || 0.92);

            // get JPEG blob from canvas
            canvas.toBlob(async (blob) => {
                if (!blob) return;

                // try to inject original APP1 (EXIF) if available
                try {
                    if (origImageArrayBuffer) {
                        const app1 = extractApp1Segment(origImageArrayBuffer);
                        if (app1) {
                            const jpegBuf = await blob.arrayBuffer();
                            const newBlob = await insertApp1ToJpeg(app1, jpegBuf);
                            blob = newBlob;
                        }
                    }
                } catch (e) {
                    console.error('EXIF reinject error', e);
                }

                if (navigator.share) {
                    if (shareInProgress) return; // 前回の共有が終わっていなければ何もしない
                    shareInProgress = true;
                    try {
                        await navigator.share({ files: [new File([blob], "result.jpg", { type: "image/jpeg" })] });
                    } catch (e) {
                        // 共有がキャンセルされたりエラーになることがある
                        console.error('Share error', e);
                    } finally {
                        shareInProgress = false;
                    }
                } else {
                    const a = document.createElement("a");
                    a.href = URL.createObjectURL(blob);
                    a.download = "result.jpg";
                    a.click();
                }
            }, "image/jpeg", quality);
        }

        // ===== 逆ジオコーディング（OpenStreetMap Nominatim） =====
        async function reverseGeocode(latVal, lonVal) {
            try {
                const url = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${encodeURIComponent(latVal)}&lon=${encodeURIComponent(lonVal)}`;
                const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
                if (!res.ok) return "";
                const data = await res.json();

                // 使いやすい表示名を選択
                if (data && data.address) {
                    const a = data.address;
                    return a.city || a.town || a.village || a.county || data.display_name || "";
                }

                return data.display_name || "";
            } catch (e) {
                return "";
            }
        }

        // ===== EXIF日付フォーマット ("YYYY:MM:DD HH:MM:SS" -> "YYYY/MM/DD HH:MM") =====
        function formatExifDate(d) {
            if (!d || typeof d !== 'string') return '';
            // 多くは "YYYY:MM:DD HH:MM:SS"
            const parts = d.split(' ');
            const datePart = parts[0] ? parts[0].replace(/:/g, '/') : '';
            let timePart = parts[1] || '';
            if (timePart) {
                const t = timePart.split(':');
                if (t.length >= 2) timePart = `${t[0]}:${t[1]}`;
                else timePart = t[0];
            }
            return timePart ? `${datePart} ${timePart}` : datePart;
        }
    </script>
