<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JR東日本 運行情報テキスト</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='50' font-size='52'%3E🚆%3C/text%3E%3C/svg%3E">
  <style>
    body { margin: 0; padding: 16px; color: #000; background: #fff; }
    #result { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font: 16px/1.5 sans-serif; }
  </style>
</head>
<body>
  <pre id="result" aria-live="polite">運行情報を取得しています…</pre>

  <script>
    const STATUS_ICONS = {
      "お知らせ": "❗",
      "運転見合わせ": "❌",
      "運転再開見込み": "❌",
      "運転再開": "🔺",
      "遅延": "🔺",
      "一部運休": "🔺",
      "経路変更": "⭕",
      "直通運転中止": "↩"
    };
    const params = new URLSearchParams(location.search);
    const result = document.querySelector("#result");
    const lineid = params.get("lineid") || "takasakiline";

    const API_URL = "https://api-challenge.odpt.org/api/v4/odpt:TrainInformation?odpt:operator=odpt.Operator:jre-is&acl:consumerKey=dys5jrrro1p7kk9096v1sg6ej43xfpghhqtag9dspl3lhxlyhu11y5y12ogoov9w";
    const LINE_IDS = {
      takasakiline: { railway: "Takasaki", name: "高崎線" },
      utsunomiyaline: { railway: "Tohoku", name: "宇都宮線" },
      keihintohokuline: { railway: "KeihinTohokuNegishi", name: "京浜東北線・根岸線" },
      chuo: { railway: "Chuo", name: "中央線" },
      chuosobuline: { railway: "ChuoSobu", name: "中央・総武線各駅停車" },
      yokosukaline: { railway: "Yokosuka", name: "横須賀線" },
      soburapidline: { railway: "SobuRapid", name: "総武快速線" },
      jobanline: { railway: "Joban", name: "常磐線" },
      jobanrapidline: { railway: "JobanRapid", name: "常磐線快速電車" },
      yamanoteline: { railway: "Yamanote", name: "山手線" },
      saikyoline: { railway: "Saikyo", name: "埼京線" },
      keiyoline: { railway: "Keiyo", name: "京葉線" }
    };

    function routeFor(lineid) {
      const known = LINE_IDS[lineid.toLowerCase()];
      if (known) return known;
      const railway = lineid.replace(/line$/i, "").replace(/(^|[-_])(.)/g, (_, __, letter) => letter.toUpperCase());
      return { railway, name: railway };
    }

    function japanese(value) {
      return typeof value === "string" ? value : value?.ja || "";
    }

    function formatTime(value) {
      const match = String(value || "").match(/T(\d{2}):(\d{2})/);
      return match ? `${match[1]}時${match[2]}分` : "";
    }

    function iconFor(status) {
      const key = Object.keys(STATUS_ICONS).find(name => status.includes(name));
      return key ? STATUS_ICONS[key] : "❗";
    }

    function formatInfo(info, route) {
      const note = japanese(info["odpt:trainInformationText"]);
      if (note === "平常運転") return "平常運転";
      const status = japanese(info["odpt:trainInformationStatus"]) || "お知らせ";
      const time = formatTime(info["odpt:timeOfOrigin"] || info["dc:date"]);
      return `【${route.name}　運行情報】\n${iconFor(status)}${status}\n${note}${time ? `(${time}更新)` : ""}`;
    }

    async function load(lineid) {
      const route = routeFor(lineid);
      result.textContent = "運行情報を取得しています…";
      try {
        const response = await fetch(API_URL);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const information = await response.json();
        const info = information.find(item => item["odpt:railway"] === `odpt.Railway:JR-East.${route.railway}`);
        if (!info) throw new Error("路線が見つかりません");
        result.textContent = formatInfo(info, route);
      } catch (error) {
        result.textContent = "取得できませんでした。しばらくしてから再度お試しください。";
      }
    }
    load(lineid);
  </script>
</body>
</html>
