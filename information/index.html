<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JR東日本 運行情報テキスト</title>
  <style>
    body { margin: 0; padding: 16px; color: #000; background: #fff; }
    #result { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font: 16px/1.5 sans-serif; }
  </style>
</head>
<body>
  <pre id="result" aria-live="polite"></pre>

  <script>
    const STATUS_ICONS = {
      "お知らせ": "❗",
      "運転見合わせ": "❌",
      "運転再開見込": "❌",
      "運転再開": "🔺",
      "遅延": "🔺",
      "一部運休": "🔺",
      "経路変更": "⭕",
      "直通運転中止": "→|"
    };
    const params = new URLSearchParams(location.search);
    const result = document.querySelector("#result");
    const lineid = params.get("lineid");

    const API_URL = "https://api-challenge.odpt.org/api/v4/odpt:TrainInformation?odpt:operator=odpt.Operator:jre-is&acl:consumerKey=dys5jrrro1p7kk9096v1sg6ej43xfpghhqtag9dspl3lhxlyhu11y5y12ogoov9w";
    const RAILWAY_API_URL = "https://api-challenge.odpt.org/api/v4/odpt:Railway?odpt:operator=odpt.Operator:JR-East&acl:consumerKey=dys5jrrro1p7kk9096v1sg6ej43xfpghhqtag9dspl3lhxlyhu11y5y12ogoov9w";
    const LINE_IDS = {
      takasakiline: { railway: "Takasaki", name: "高崎線" },
      utsunomiyaline: { railway: "Utsunomiya", name: "宇都宮線" },
      keihintohokuline: { railway: "KeihinTohokuNegishi", name: "京浜東北・根岸線" },
      chuo: { railway: "Chuo", name: "中央本線" },
      chuosobuline: { railway: "ChuoSobuLocal", name: "中央・総武各駅停車" },
      yokosukaline: { railway: "Yokosuka", name: "横須賀線" },
      soburapidline: { railway: "SobuRapid", name: "総武快速線" },
      jobanline: { railway: "Joban", name: "常磐線" },
      jobanrapidline: { railway: "JobanRapid", name: "常磐線快速" },
      yamanoteline: { railway: "Yamanote", name: "山手線" },
      saikyoline: { railway: "SaikyoKawagoe", name: "埼京線・川越線" },
      keiyoline: { railway: "Keiyo", name: "京葉線" }
    };

    function routeFor(lineid) {
      const known = LINE_IDS[lineid.toLowerCase()];
      if (known) return known;
      const railway = lineid.replace(/line$/i, "").replace(/(^|[-_])(.)/g, (_, __, letter) => letter.toUpperCase());
      return { railway, name: railway };
    }

    function japanese(value) {
      return typeof value === "string" ? value : value?.ja || "";
    }

    function formatTime(value) {
      const match = String(value || "").match(/T(\d{2}):(\d{2})/);
      return match ? `${match[1]}時${match[2]}分` : "";
    }

    function iconFor(status) {
      const key = Object.keys(STATUS_ICONS).find(name => status.includes(name));
      return key ? STATUS_ICONS[key] : "❗";
    }

    function formatNote(note, routeName) {
      return note.split(`。${routeName}`).join(`。\n\n${routeName}`);
    }

    function formatInfo(info, route) {
      const note = formatNote(japanese(info["odpt:trainInformationText"]), route.name);
      const status = japanese(info["odpt:trainInformationStatus"]) || "お知らせ";
      const time = formatTime(info["dc:date"]);
      return `${iconFor(status)}${status}\n${note}${time ? `(${time}現在)` : ""}`;
    }

    async function load(lineid) {
      const requestedRoute = routeFor(lineid);
      result.textContent = "";
      try {
        const [informationResponse, railwayResponse] = await Promise.all([
          fetch(API_URL),
          fetch(RAILWAY_API_URL)
        ]);
        if (!informationResponse.ok) throw new Error(`HTTP ${informationResponse.status}`);
        if (!railwayResponse.ok) throw new Error(`HTTP ${railwayResponse.status}`);
        const [information, railways] = await Promise.all([
          informationResponse.json(),
          railwayResponse.json()
        ]);
        const railwayId = `odpt.Railway:JR-East.${requestedRoute.railway}`;
        const railway = railways.find(item => item["owl:sameAs"] === railwayId);
        const route = {
          ...requestedRoute,
          name: japanese(railway?.["odpt:railwayTitle"]) || requestedRoute.name
        };
        const infos = information.filter(item => item["odpt:railway"] === railwayId);
        if (!infos.length) throw new Error("路線が見つかりません");
        const activeInfos = infos.filter(info => japanese(info["odpt:trainInformationText"]) !== "平常運転");
        const lastInfo = activeInfos.at(-1) || infos.at(-1);
        const output = activeInfos.length
          ? `【${route.name}  運行情報】\n${activeInfos.map(info => formatInfo(info, route)).join("\n\n")}`
          : "平常運転";
        const uuid = lastInfo["@id"].replace(/^urn:uuid:/, "");
        result.textContent = `${output}\n${uuid}`;
      } catch (error) {
        result.textContent = "取得できませんでした。しばらくしてから再度お試しください。";
      }
    }
    load(lineid);
  </script>
</body>
</html>
